<style>
  .guess-wrap { position: relative; z-index: 2; max-width: 980px; margin: 0 auto; padding: clamp(96px, 11vw, 140px) clamp(16px, 4vw, 32px) 70px; }
  .g-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
  .g-title { font-family: var(--font-display); font-size: clamp(30px, 5vw, 64px); line-height: 1.05; letter-spacing: -.04em; font-weight: var(--display-w); text-transform: uppercase; }
  .g-title em { font-style: normal; color: var(--a1); }

  .score { font-family: var(--font-mono); font-size: 11px; letter-spacing: .2em; color: var(--fg-faint); }
  .score b { color: var(--a1); font-size: 22px; letter-spacing: 0; }

  .photo-box { position: relative; border: 1px solid var(--card-line); border-radius: 4px; overflow: hidden; background: #000; }
  .photo-box img { width: 100%; height: min(52vh, 460px); object-fit: cover; display: block; filter: saturate(.9) contrast(1.02); }
  .photo-box::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 120px rgba(0,0,0,.55); pointer-events: none; }
  .q-no { position: absolute; left: 12px; top: 10px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; color: #fff; opacity: .8; text-shadow: 0 2px 12px #000; }

  .options { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-top: 14px; }
  .opt {
    padding: 14px 16px; text-align: left; cursor: pointer;
    border: 1px solid var(--line-strong); background: transparent; color: var(--fg);
    font-size: 14px; letter-spacing: .02em; border-radius: 2px;
    transition: border-color .2s, background-color .2s, color .2s;
  }
  .opt:hover { border-color: var(--a1); color: var(--a1-t); }
  .opt.right { border-color: var(--a1); background: color-mix(in srgb, var(--a1) 16%, transparent); color: var(--fg); }
  .opt.wrong { border-color: var(--a3); background: color-mix(in srgb, var(--a3) 14%, transparent); color: var(--fg-faint); }
  .opt:disabled { cursor: default; }

  .feedback { margin-top: 14px; min-height: 46px; font-size: 13px; line-height: 1.8; color: var(--fg-dim); }
  .feedback b { color: var(--a1-t); }
  .next-btn {
    margin-top: 8px; padding: 12px 22px; border-radius: 2px; cursor: pointer;
    background: var(--a1); color: var(--on-accent); font-size: 13px; letter-spacing: .06em;
    border: 0;
  }
  .next-btn[hidden] { display: none; }

  .result { text-align: center; padding: 40px 10px; display: none; }
  .result.on { display: block; }
  .result h2 { font-family: var(--font-display); font-size: clamp(26px, 4vw, 44px); letter-spacing: -.03em; }
  .result p { margin-top: 10px; color: var(--fg-dim); font-size: 13px; }
  .note { margin-top: 18px; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; color: var(--fg-faint); line-height: 1.9; }
</style>
<script>document.documentElement.classList.add('js');</script>
</head>
<body>

<header class="nav" id="nav">

<main id="main" class="guess-wrap">
  <div class="g-head">
    <div>
      <p class="kicker" style="margin-bottom:10px">图寻 · GEOGUESS</p>
      <h1 class="g-title">这是<em>哪儿</em>？</h1>

  </div>

  <div class="photo-box">
    <img id="photo" alt="待猜的照片" />

  </div>

  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="nextBtn" type="button" hidden>下一张 →</button>

  <div class="result" id="result">
    <h2 id="resultTitle">看完了。</h2>
    <p id="resultText"></p>
    <p class="note">答案是我按图的特征标的，可能不准 —— 你要是发现了错的，告诉我，我改。</p>
    <button class="next-btn" id="againBtn" type="button">再来一轮</button>
  </div>

  <p class="note">题库 100 座城市的卫星图，每局随机抽 5 题，四选一。真正的图寻是一张路边的照片，能说出它在中国哪条路 —— 那个本事，我留着。</p>
</main>

<script src="js/eggs.js"></script>
<script>
(function () {
  'use strict';

  const BANK = (window.GEO || []).map(function (g) { return g.name; });
  const PER_ROUND = 5;

  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const x = a[i]; a[i] = a[j]; a[j] = x;
    }
    return a;
  }

  function makeRound(city) {
    const others = [];
    while (others.length < 3 && BANK.length > 3) {
      const n = BANK[Math.floor(Math.random() * BANK.length)];
      if (n !== city.name && others.indexOf(n) < 0) others.push(n);
    }
    return { img: city.src, answer: city.name, opts: [city.name].concat(others) };
  }

  function pickRounds(n) {
    const pool = shuffle((window.GEO || []).slice());
    return pool.slice(0, Math.min(n, pool.length)).map(makeRound);
  }

  const ROUNDS = pickRounds(PER_ROUND);


  const $ = function (id) { return document.getElementById(id); };
  let i = 0, score = 0, locked = false;
  document.getElementById('total').textContent = ROUNDS.length;

  function shuffle(a) {
    a = a.slice();
    for (let k = a.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      const t = a[k]; a[k] = a[j]; a[j] = t;
    }
    return a;
  }

  function render() {
    const r = ROUNDS[i];
    locked = false;
    $('photo').src = r.img;
    $('qno').textContent = ('0' + (i + 1)).slice(-2) + ' / ' + ('0' + ROUNDS.length).slice(-2);
    $('feedback').innerHTML = '';
    $('nextBtn').hidden = true;
    $('result').classList.remove('on');

    const box = $('options');
    box.innerHTML = '';
    shuffle(r.opts).forEach(function (name) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.textContent = name;
      b.addEventListener('click', function () { pick(name, b); });
      box.appendChild(b);
    });
  }

  function pick(name, btn) {
    if (locked) return;
    locked = true;
    const r = ROUNDS[i];
    Array.prototype.forEach.call($('options').children, function (b) {
      b.disabled = true;
      if (b.textContent === r.answer) b.classList.add('right');
    });
    if (name === r.answer) {
      score++;
      $('feedback').innerHTML = '对了。<b>' + r.answer + '</b>';
    } else {
      btn.classList.add('wrong');
      $('feedback').innerHTML = '不是这里 —— 是<b>' + r.answer + '</b>。';
    }
    $('score').textContent = score;
    $('nextBtn').hidden = false;
    $('nextBtn').textContent = (i === ROUNDS.length - 1) ? '看结果 →' : '下一张 →';
  }

  $('nextBtn').addEventListener('click', function () {
    if (i < ROUNDS.length - 1) { i++; render(); }
    else {
      $('result').classList.add('on');
      $('resultTitle').textContent = '你答对了 ' + score + ' / ' + ROUNDS.length;
      $('resultText').textContent = score === ROUNDS.length
        ? '全中。你大概也认得那些山。'
        : (score >= ROUNDS.length / 2 ? '还行 —— 至少方向没跑偏。' : '不太熟这些地方，也正常。');
      $('nextBtn').hidden = true;
    }
  });

  $('againBtn').addEventListener('click', function () {
    i = 0; score = 0; $('score').textContent = '0'; render();
  });

  $('total').textContent = ROUNDS.length;
  render();
})();
</script>
</body>
