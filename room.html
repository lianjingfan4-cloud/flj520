<style>
  .room-wrap { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; padding: 20px; }
  .room-frame {
    width: min(1180px, 100%); max-height: calc(100svh - 40px);
    border-radius: var(--radius); overflow: hidden;
    border: 1px solid var(--card-line); box-shadow: var(--shadow);
    background: var(--bg); position: relative;
  }
  .room-frame svg { display: block; width: 100%; height: auto; }

  .obj { cursor: pointer; }
  .obj .hit { transition: filter .3s var(--ease), opacity .3s var(--ease); }
  .obj:hover .hit { filter: drop-shadow(0 0 10px var(--a1)); }
  .obj:focus { outline: none; }
  .obj:focus-visible .hit { filter: drop-shadow(0 0 12px var(--a3)); }

  .room-hud {
    position: absolute; left: 0; right: 0; top: 0; padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .18em;
    color: var(--fg-faint); text-transform: uppercase; pointer-events: none;
  }
  .room-hud a { pointer-events: auto; color: var(--fg-dim); }
  .room-hud a:hover { color: var(--a1-t); }

  .note {
    position: fixed; right: clamp(14px, 3vw, 34px); bottom: clamp(14px, 3vw, 34px);
    z-index: 60; width: min(320px, calc(100vw - 28px));
    padding: 18px 20px; border-radius: 16px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    border: 1px solid var(--line-strong);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
    opacity: 0; transform: translateY(12px); pointer-events: none;
    transition: opacity .35s var(--ease), transform .45s var(--ease-out);
  }
  .note.on { opacity: 1; transform: none; pointer-events: auto; }
  .note-k { font-family: var(--font-mono); font-size: 9px; letter-spacing: .2em; color: var(--a1-t); text-transform: uppercase; }
  .note-t { font-family: var(--font-serif); font-size: 20px; margin: 6px 0 8px; }
  .note-p { font-size: 13px; line-height: 1.9; color: var(--fg-dim); }
  .note-x { position: absolute; right: 10px; top: 8px; font-size: 14px; color: var(--fg-faint); cursor: pointer; }
  .note-x:hover { color: var(--fg); }

  /* 门 */
  .gate {
    position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center;
    background: var(--bg); padding: 24px;
    transition: opacity .7s var(--ease), visibility .7s;
  }
  .gate.go { opacity: 0; visibility: hidden; pointer-events: none; }
  .gate-card { width: min(420px, 100%); text-align: center; }
  .gate-mark {
    width: 54px; height: 54px; margin: 0 auto 24px; border-radius: 50%;
    border: 1px solid var(--line-strong); display: grid; place-items: center;
    color: var(--a1-t); box-shadow: var(--glow);
  }
  .gate-card h1 { font-family: var(--font-display); font-size: clamp(24px, 3.4vw, 34px); font-weight: var(--display-w); letter-spacing: -.02em; }
  .gate-card p { margin-top: 10px; font-size: 12.5px; line-height: 1.9; color: var(--fg-dim); }
  .gate-form { display: flex; gap: 8px; margin-top: 22px; }
  .gate-form input {
    flex: 1; min-width: 0; padding: 13px 14px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--line-strong); color: var(--fg);
    font-family: var(--font-mono); font-size: 13px; letter-spacing: .06em; outline: none;
    transition: border-color .3s var(--ease);
  }
  .gate-form input:focus { border-color: var(--a1); }
  .gate-form button {
    padding: 0 18px; border-radius: 10px; cursor: pointer;
    background: var(--btn-primary-bg); color: var(--on-accent); font-size: 13px;
  }
  .gate-err { margin-top: 12px; font-size: 11.5px; color: var(--a3); min-height: 1.2em; }
  .gate-hint { margin-top: 18px; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; color: var(--fg-faint); }
  .shake { animation: shake .38s var(--ease); }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
</style>

<script>
(function () {
  'use strict';
  const KEY = 'nova-room-open';
  const PASS = ['换了人间', 'huanshirenjian', 'hrrj', '换了人间！'];

  const gate = document.getElementById('gate');
  const card = document.getElementById('gateCard');
  const form = document.getElementById('gateForm');
  const input = document.getElementById('gateInput');
  const err = document.getElementById('gateErr');

  function openRoom() {
    gate.classList.add('go');
    setTimeout(function () { gate.remove(); }, 800);
  }

  let unlocked = false;
  try { unlocked = localStorage.getItem(KEY) === '1'; } catch (e) { }
  if (unlocked) { gate.remove(); }

  if (form) {
    setTimeout(function () { input.focus(); }, 300);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const v = (input.value || '').trim();
      if (PASS.indexOf(v) >= 0) {
        try { localStorage.setItem(KEY, '1'); } catch (e2) { }
        openRoom();
      } else {
        err.textContent = v ? '不对。再想想那四句里头。' : '总得写点什么。';
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        input.select();
      }
    });
  }

  /* ---------------- 房间里的东西 ---------------- */
  const NOTES = {
    moscow: { k: '窗 · WINDOW', t: '莫斯科的窗', p: '雪会下很久，落到窗台上不化。上海不下雪，所以我还挺喜欢这儿。' },
    poster: { k: '海报 · POSTER', t: '一张旧海报', p: '红的，斜的，一颗星。我喜欢那种蛮不讲理的力量 —— 一块颜色就够说一句话。' },
    scope: { k: '望远镜 · SCOPE', t: '看月亮用的', p: '图寻就是从这个习惯长出来的：先看形状，再看影子，最后看那条路有几车道。' },
    record: { k: '唱片 · CANON', t: '卡农', p: '从小听到大。写这页的时候，背景音乐也是它。' },
    lamp: { k: '台灯 · LAMP', t: '凌晨两点', p: '它还亮着。我不是熬夜型，但一算起来就忘了时间。' },
    desk: { k: '桌子 · DESK', t: '桌上的东西', p: '一本书停在第三章，一副球拍，一张折过的地图。都是没做完但我还惦记着的事。' },
    cat: { k: '猫 · CAT', t: '它不叫', p: '我算不下去的时候，它就坐上来。它不知道什么叫有限元，但它知道什么时候该来。' },
    plant: { k: '花 · PLANT', t: '养了很久', p: '隔壁有一盆更大的，在 garden.html。你可以去浇它。' }
  };

  const note = document.getElementById('note');
  const noteK = document.getElementById('noteK');
  const noteT = document.getElementById('noteT');
  const noteP = document.getElementById('noteP');
  const noteX = document.getElementById('noteX');

  function hideNote() { note.classList.remove('on'); }

  Array.prototype.forEach.call(document.querySelectorAll('.obj'), function (el) {
    function show() {
      const n = NOTES[el.dataset.note];
      if (!n) return;
      noteK.textContent = n.k;
      noteT.textContent = n.t;
      noteP.textContent = n.p;
      note.classList.add('on');
    }
    el.addEventListener('click', show);
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(); }
    });
  });

  if (noteX) noteX.addEventListener('click', hideNote);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') hideNote();
  });
})();
</script>
