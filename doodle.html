<style>
  /* ---- 这一页自己的纸和笔 ---- */
  :root { --hand: "KaiTi", "STKaiti", "Kaiti SC", "楷体", "Songti SC", serif; }

  .paper-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .5;
    background-image:
      linear-gradient(to right, color-mix(in srgb, var(--a1) 14%, transparent) 1px, transparent 1px),
      linear-gradient(to bottom, color-mix(in srgb, var(--a1) 14%, transparent) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(110% 90% at 50% 0%, #000 30%, transparent 85%);
    -webkit-mask-image: radial-gradient(110% 90% at 50% 0%, #000 30%, transparent 85%);
  }

  .doodle-hero { position: relative; z-index: 2; max-width: var(--maxw); margin: 0 auto; padding: clamp(110px, 13vw, 170px) clamp(20px, 4vw, 48px) 20px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: clamp(20px, 4vw, 50px); align-items: center; }
  .doodle-hero h1 { font-family: var(--hand); font-size: clamp(38px, 7vw, 92px); line-height: 1.12; letter-spacing: .02em; }
  .doodle-hero h1 em { font-style: normal; color: var(--a1-t); }
  .doodle-hero p { font-family: var(--hand); font-size: clamp(15px, 1.5vw, 20px); line-height: 2; color: var(--fg-dim); margin-top: 18px; max-width: 30ch; }
  .doodle-hero .dh-note { font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; color: var(--fg-faint); margin-top: 22px; text-transform: uppercase; }
  .dh-art { position: relative; }
  .dh-art svg { width: 100%; height: auto; }

  .doodle-grid { position: relative; z-index: 2; max-width: var(--maxw); margin: 0 auto; padding: 20px clamp(20px, 4vw, 48px) clamp(60px, 9vw, 120px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(12px, 2vw, 22px); }
  .doodle { background: color-mix(in srgb, var(--card) 80%, transparent); border: 2px solid var(--card-line); border-radius: 26px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: transform .35s var(--ease-out), border-color .35s var(--ease); }
  .doodle:hover { transform: translateY(-5px) rotate(-1.5deg); border-color: var(--a1); }
  .doodle svg { width: 100%; height: auto; }
  .doodle b { font-family: var(--hand); font-size: 17px; font-weight: 400; color: var(--fg); }
  .doodle span { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .16em; color: var(--fg-faint); text-transform: uppercase; }
  .doodle.wig { animation: wig .6s var(--ease); }
  @keyframes wig { 20% { transform: rotate(4deg) scale(1.04); } 45% { transform: rotate(-4deg) scale(1.05); } 70% { transform: rotate(2deg) scale(1.02); } 100% { transform: none; } }

  .ink-line { stroke: var(--fg); stroke-width: 3.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ink-thin { stroke: var(--fg); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .crayon-a1 { fill: var(--a1); opacity: .55; }
  .crayon-a2 { fill: var(--a2); opacity: .5; }
  .crayon-a3 { fill: var(--a3); opacity: .55; }

  .doodle-foot { position: relative; z-index: 2; max-width: var(--maxw); margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px) 60px; display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; color: var(--fg-faint); }

  @media (max-width: 900px) {
    .doodle-hero { grid-template-columns: 1fr; }
    .dh-art { order: -1; max-width: 340px; }
    .doodle-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>

<!-- 手抖滤镜：所有线都有一点歪，才像手画的 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wob">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="var(--fg)" stroke-width="1" opacity=".28" />
    </pattern>
  </defs>
</svg>

<script>
  (function () {
    var t = document.getElementById('toast');
    function toast(msg) {
      if (!t) return;
      t.textContent = msg; t.classList.add('show');
      clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 1600);
    }
    document.querySelectorAll('.doodle').forEach(function (el) {
      el.addEventListener('click', function () {
        el.classList.remove('wig');
        void el.offsetWidth;
        el.classList.add('wig');
        toast('「' + (el.dataset.name || '') + '」');
      });
    });
  })();
</script>
