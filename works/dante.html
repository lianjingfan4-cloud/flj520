/* ---------- 常量 ---------- */
const KIND_LABEL = {"迷途湮灭":["迷途 · 湮灭","#b06a4a"], "灵魂沉沦":["灵魂 · 沉沦","#9a5fa0"], "当场死亡":["当场 · 死亡","#b8453a"]};
const LS_AUTO = "dante_auto";
const LS_SLOT = "dante_slot_";     // 手动槽 key 前缀
const TOTAL_CHAPTERS = CHAPTERS.length;

/* ---------- 运行时状态 ---------- */
let state = null;                 // {nodeId, paraIdx, seen:[...], lastEnd:null}
let bgsReady = false;
let typing = false;
let FAST = false;                 // 自测时跳过打字机

/* ---------- 节点索引 ---------- */
const nodeIndex = {};
CHAPTERS.forEach((ch, ci) => ch.nodes.forEach(n => nodeIndex[n.id] = { data:n, ch, ci }));

/* ---------- 背景层 ---------- */
function buildBgLayer(){
  const layer = document.getElementById('bgLayer');
  for (let i=1;i<=7;i++){
    const d = document.createElement('div');
    d.className='bgimg'; d.id='bgi'+i;
    if (BG_URIS[i]) d.style.backgroundImage = "url('"+BG_URIS[i]+"')";
    layer.appendChild(d);
  }
  bgsReady = true;
}
function setBg(ci){ // ci: 1..7
  for (let i=1;i<=7;i++){
    const el=document.getElementById('bgi'+i);
    if(!el) continue;
    el.classList.toggle('on', i===ci);
  }
}

/* ---------- 章节信息 ---------- */
function chapterIndexOf(nodeId){
  const r=nodeIndex[nodeId];
  return r ? r.ci : 0;      // 0-based chapter index
}
function setChapInfo(ci){
  const ch=CHAPTERS[ci];
  if(!ch) return;
  const pos = String(ci+1)+'/'+TOTAL_CHAPTERS;
  document.getElementById('chapInfo').innerHTML = '第 <b>'+ch.chapter+'</b> 章 · '+ch.circle.split('·')[0].trim()+' &nbsp;·&nbsp; '+pos;
}

/* ============================================================
   打字机 / 渲染
   ============================================================ */
function setText(el, full, done){
  // 简单逐字打字机
  el.innerHTML='';
  if(full.length===0){ if(done)done(); return; }
  if(FAST){ el.innerHTML=full; typing=false; if(done)done(); return; }
  let i=0;
  typing=true;
  const step=()=>{
    if(i>=full.length){ el.innerHTML = el.innerHTML.replace(/<span class="caret"><\/span>$/,''); typing=false; if(done)done(); return; }
    // 一次推进 1~2 字，保持流畅
    const chunk = full.slice(i, i + (full.charCodeAt(i)>0x2e7f?2:3));
    el.innerHTML += chunk;
    i += chunk.length;
    // 追加光标
    if(!/caret$/.test(el.innerHTML)) el.innerHTML += '<span class="caret"></span>';
    requestAnimationFrame(step);
  };
  step();
}

function flushText(){ // 点击跳过打字
  // 把剩余文字直接补齐
  const node = state && nodeIndex[state.nodeId] ? nodeIndex[state.nodeId].data : null;
  if(node && typing){
    typing=false;
    document.getElementById('text').innerHTML = node.paragraphs[state.paraIdx];
  }
}

/* ---------- 渲染一个节点 ---------- */
function renderNode(nodeId, paraIdx){
  state = state || {};
  const rec = nodeIndex[nodeId];
  if(!rec){ console.error('missing node',nodeId); return; }
  const {data, ch, ci}=rec;
  const p = data.paragraphs[paraIdx] || '';

  setBg(ci+1);
  setChapInfo(ci);
  document.getElementById('chapterChip').textContent = ch.circle + ' · ' + ch.title;
  document.getElementById('nodeTitle').textContent = data.title;
  document.getElementById('choiceArea').classList.remove('show');

  const isLast = paraIdx >= data.paragraphs.length-1;
  const continueEl=document.getElementById('continue');
  if(isLast && data.choice){ continueEl.style.display='none'; } // 末段且需抉择：等打字完自动出选择
  else continueEl.style.display='block';

  const textEl=document.getElementById('text');
  setText(textEl, p, ()=>{
    // 打完后：末段+有抉择 → 直接亮出选择
    if(isLast && data.choice) revealChoice(true);
  });
}

function revealChoice(show){
  const node = state && nodeIndex[state.nodeId] ? nodeIndex[state.nodeId].data : null;
  const curIdx = state ? state.paraIdx : -1;
  const area = document.getElementById('choiceArea');
  if(!node || !node.choice){ area.classList.remove('show'); return; }
  if(show!==true || curIdx < node.paragraphs.length-1){ area.classList.remove('show'); return; }
  // 显示抉择
  const cp=document.getElementById('choicePrompt');
  cp.textContent = '◆ '+node.choice.prompt;
  const optBox=document.getElementById('options');
  optBox.innerHTML='';
  node.choice.options.forEach(opt=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=opt.text;
    const tag=document.createElement('span'); tag.className='tag';
    tag.textContent = opt.to ? '前行' : (opt.end? (KIND_LABEL[opt.end.kind]?.[0] || '抉择') : '抉择');
    if(opt.end) tag.classList.add('bad');
    b.appendChild(tag);
    b.addEventListener('click', (e)=>{ e.stopPropagation(); handleChoice(opt); });
    optBox.appendChild(b);
  });
  area.classList.add('show');
  document.getElementById('continue').style.display='none';
}

/* ============================================================
   主线推进（点击继续）
   ============================================================ */
function advance(){
  const rec = nodeIndex[state.nodeId];
  if(!rec) return;
  const data=rec.data;

  // 正在打字 → 先补全
  if(typing){ flushText(); return; }

  const area=document.getElementById('choiceArea');
  if(area.classList.contains('show')) return; // 选择中，交给按钮

  if(state.paraIdx < data.paragraphs.length-1){
    state.paraIdx++;
    renderNode(state.nodeId, state.paraIdx);
    saveAuto();
  } else if(data.choice){
    revealChoice(true);
  } else {
    // 末段且无抉择 → 本节点结束，顺延下一节点
    state.seen.push(state.nodeId);
    const next = nextNodeId(state.nodeId);
    if(next==='END'){ gotoNode('END',0); }
    else gotoNode(next,0);
  }
}

/* ---------- 计算本节点之后该去哪 ---------- */
function nextNodeId(nodeId){
  const rec=nodeIndex[nodeId]; if(!rec) return null;
  const ch=rec.ch, ci=rec.ci;
  const idx=ch.nodes.findIndex(n=>n.id===nodeId);
  if(idx>=0 && idx<ch.nodes.length-1) return ch.nodes[idx+1].id;
  // 本章末节 → 下一章首节 / END
  if(ci+1 < CHAPTERS.length) return CHAPTERS[ci+1].nodes[0].id;
  return 'END';
}

/* ============================================================
   抉择处理
   ============================================================ */
function handleChoice(opt){
  if(opt.to){
    state.seen.push(state.nodeId);
    gotoNode(opt.to, 0);
  } else if(opt.end){
    showEnd(opt.end, state.nodeId);
  }
}

function gotoNode(nodeId, paraIdx){
  if(nodeId==='END'){ showTrueEnd(); return; }
  state.nodeId=nodeId; state.paraIdx=paraIdx||0;
  addHistory(nodeId);
  renderNode(nodeId, state.paraIdx);
  saveAuto();
}

/* ============================================================
   结局（坏结局 & 真结局）
   ============================================================ */
function showEnd(end, fromNodeId){
  const overlay=document.getElementById('endOverlay');
  const kindEl=document.getElementById('endKind');
  const titleEl=document.getElementById('endTitle');
  const textEl=document.getElementById('endText');
  const btnBox=document.getElementById('endButtons');

  const kl = KIND_LABEL[end.kind] || ["结局", "#c45a4a"];
  kindEl.textContent = kl[0];
  kindEl.style.color = kl[1];
  kindEl.classList.remove('good');
  titleEl.textContent = end.title;
  textEl.textContent = end.text;

  btnBox.innerHTML='';
  const b1=document.createElement('button'); b1.className='ebtn'; b1.textContent='回档重来';
  b1.addEventListener('click', ()=>{ overlay.classList.remove('show'); rollback(fromNodeId); });
  const b2=document.createElement('button'); b2.className='ebtn ghost'; b2.textContent='回到标题';
  b2.addEventListener('click', ()=>{ overlay.classList.remove('show'); goTitle(); });
  btnBox.appendChild(b1); btnBox.appendChild(b2);

  overlay.classList.add('show');
  state.lastEnd = { from: fromNodeId };
}

function showTrueEnd(){
  const overlay=document.getElementById('endOverlay');
  const kindEl=document.getElementById('endKind');
  const titleEl=document.getElementById('endTitle');
  const textEl=document.getElementById('endText');
  const btnBox=document.getElementById('endButtons');

  kindEl.textContent='救赎 · 达成'; kindEl.style.color='#7fb27a'; kindEl.classList.add('good');
  titleEl.textContent='重返星空';
  textEl.innerHTML = '你们穿过地球的中心，从深渊最低处脱身而出。维吉尔与但丁攀下卢西法，踏过地心的裂口，回到南半球的天空下。\n\n"我没有死去，我没有活过该活的那一生——' +
    '如今，我从地狱里带回来的，不是恐惧，而是关于"我究竟是谁"的清醒。"\n\n但丁抬头，看见久违的星辰。那些在至暗处仍不熄灭的光，像是对每一个愿意自省之人的许诺：' +
    '罪可以认清，深渊可以穿过，只要人不停止向上仰望。\n\n—— 地狱篇 · 完 ——\n\n愿你在每一次抉择里，都听见自己灵魂深处的钟声。';
  textEl.style.whiteSpace='pre-line';

  btnBox.innerHTML='';
  const b=document.createElement('button'); b.className='ebtn'; b.textContent='回到标题';
  b.addEventListener('click', ()=>{ overlay.classList.remove('show'); goTitle(); });
  btnBox.appendChild(b);

  overlay.classList.add('show');
  state.lastEnd={ from:null, true:true };
}

/* ---------- 回档：悔过重来 ---------- */
function rollback(fromNodeId){
  // 回到抉择所在的节点起点，让玩家重新选择
  gotoNode(fromNodeId, 0);
  toast('悔 过 · 重 新 抉 择');
}

/* ============================================================
   存档 / 读档（localStorage）
   ============================================================ */
function snap(){
  return { nodeId:state.nodeId, paraIdx:state.paraIdx, seen:(state.seen||[]).slice(), at:Date.now() };
}
function saveAuto(){
  try{ localStorage.setItem(LS_AUTO, JSON.stringify(snap())); }catch(e){}
}
function loadAuto(){
  try{ const s=JSON.parse(localStorage.getItem(LS_AUTO)); if(s&&nodeIndex[s.nodeId]) return s; }catch(e){}
  return null;
}
function saveSlot(i){
  try{
    const s=snap(); s.slot=i;
    localStorage.setItem(LS_SLOT+i, JSON.stringify(s));
    toast('已存档 · 第 '+i+' 格'); refreshSlots();
  }catch(e){ toast('存档失败'); }
}
function loadSlot(i){
  try{
    const s=JSON.parse(localStorage.getItem(LS_SLOT+i));
    if(s&&nodeIndex[s.nodeId]){ resumeFrom(s); toast('已读档 · 第 '+i+' 格'); }
  }catch(e){}
}
function clearSlot(i){
  localStorage.removeItem(LS_SLOT+i); refreshSlots();
}
function resumeFrom(s){
  initState(s.nodeId, s.paraIdx||0, s.seen||[]);
  hideAllScreens();
  gotoNode(s.nodeId, s.paraIdx||0);
}
function deleteAll(){
  localStorage.removeItem(LS_AUTO);
  for(let i=1;i<=3;i++) localStorage.removeItem(LS_SLOT+i);
}

/* ---------- 存档面板渲染 ---------- */
function refreshSlots(){
  const list=document.getElementById('slotList');
  list.innerHTML='';
  const meta=(s)=>{
    if(!s) return '<span class="d">— 空 —</span>';
    const rec=nodeIndex[s.nodeId]; if(!rec) return '<span class="d">— 失效 —</span>';
    const d=new Date(s.at);
    return `<span class="d">${rec.ch.circle} &nbsp; ${rec.ch.title} &nbsp;·&nbsp; ${rec.data.title}</span><br><span class="d">${d.toLocaleString()}</span>`;
  };
  for(let i=1;i<=3;i++){
    const raw=localStorage.getItem(LS_SLOT+i);
    let s=null; try{ s=raw?JSON.parse(raw):null; }catch(e){}
    const row=document.createElement('div');
    row.className='slotRow'+(s?'':' empty');
    row.innerHTML=`<div class="slotName">第 ${i} 格</div><div class="slotMeta">${meta(s)}</div><div class="slotBtn">${s?'读档':'储存'}</div>`;
    row.addEventListener('click', ()=>{
      if(s){ loadSlot(i); closeSavePanel(); }
      else { saveSlot(i); }
    });
    if(s){
      const del=document.createElement('div'); del.className='slotBtn'; del.textContent='清除'; del.style.marginLeft='6px';
      del.addEventListener('click', (e)=>{ e.stopPropagation(); clearSlot(i); });
      row.querySelector('.slotBtn').after(del);
    }
    list.appendChild(row);
  }
}

/* ============================================================
   历史回顾
   ============================================================ */
let HISTORY=[];
function addHistory(nodeId){
  const rec=nodeIndex[nodeId]; if(!rec) return;
  HISTORY.push({t:rec.data.title, p:rec.data.paragraphs.join('\n')});
  if(HISTORY.length>200) HISTORY.shift();
}
function renderBacklog(){
  const bl=document.getElementById('blContent'); bl.innerHTML='';
  HISTORY.slice(-60).reverse().forEach(h=>{
    const p=document.createElement('p');
    p.innerHTML='<span class="n">'+h.t+'</span>'+h.p.replace(/\n/g,'<br>');
    bl.appendChild(p);
  });
}

/* ============================================================
   屏幕切换
   ============================================================ */
function goTitle(){
  state=null;
  HISTORY=[];
  hideAllScreens();
  document.getElementById('titleScreen').style.display='flex';
  const has=loadAuto();
  const cb=document.getElementById('continueBtn');
  cb.classList.toggle('dim', !has);
  // 背景
  const bg=document.querySelector('#titleScreen .bg');
  bg.style.backgroundImage = (BG_URIS[1]?"url('"+BG_URIS[1]+"')":"none");
  bg.style.backgroundSize='cover'; bg.style.backgroundPosition='center';
}
function hideAllScreens(){
  document.getElementById('titleScreen').style.display='none';
  document.getElementById('endOverlay').classList.remove('show');
  document.getElementById('savePanel').classList.remove('show');
  document.getElementById('backlog').classList.remove('show');
}
function startNew(){
  // 从第1章第1节点开始
  const first=CHAPTERS[0].nodes[0].id;
  deleteAll();
  HISTORY=[];
  initState(first,0,[]);
  hideAllScreens();
  gotoNode(first,0);
  toast('你正在步入幽暗森林……');
}
function initState(nodeId, paraIdx, seen){
  state={ nodeId, paraIdx:paraIdx||0, seen:seen||[] };
}

/* ============================================================
   全局事件
   ============================================================ */
document.getElementById('stage').addEventListener('click', ()=>{
  if(typing){ flushText(); return; }
  if(!state) return;
  advance();
});
// 点击文字区域同样推进（不加 stopPropagation，让整片区域都可点）

document.getElementById('newBtn').addEventListener('click', startNew);
document.getElementById('continueBtn').addEventListener('click', ()=>{
  const s=loadAuto();
  if(s) resumeFrom(s); else toast('尚无存档');
});
document.getElementById('restartBtn').addEventListener('click', ()=>{
  if(confirm('确定要重新开始整段地狱巡礼吗？当前进度将被清除。')) startNew();
});
document.getElementById('saveBtn').addEventListener('click', ()=>{
  if(!state){ toast('请先进入巡礼'); return; }
  refreshSlots();
  document.getElementById('savePanel').classList.add('show');
});
document.getElementById('saveClose').addEventListener('click', closeSavePanel);
function closeSavePanel(){ document.getElementById('savePanel').classList.remove('show'); }
document.getElementById('backlogBtn').addEventListener('click', ()=>{
  renderBacklog();
  document.getElementById('backlog').classList.add('show');
});
document.getElementById('backlog').addEventListener('click',(e)=>{
  if(e.target.id==='backlog') document.getElementById('backlog').classList.remove('show');
});

/* 键盘 */
document.addEventListener('keydown',(e)=>{
  if(e.key===' '||e.key==='Enter'){
    if(document.getElementById('titleScreen').style.display!=='none') return;
    if(document.getElementById('endOverlay').classList.contains('show')) return;
    if(document.getElementById('savePanel').classList.contains('show')) return;
    e.preventDefault();
    if(typing) flushText(); else if(state) advance();
  }
  if(e.key==='Escape'){
    document.getElementById('savePanel').classList.remove('show');
    document.getElementById('backlog').classList.remove('show');
  }
});

/* ---------- Toast ---------- */
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1900);
}

/* ============================================================
   自测 / 调试驱动（通过 URL hash）
   ?selftest  → 纯逻辑校验主线可达、坏结局可触发、无死链
   ?demo=N-M  → 直接跳到第 N 章节点 M 供截图
   ============================================================ */
function runSelftest(){
  const results=[];
  // 1) 主线正确路径
  let id='1-1'; const path=[]; let guard=0;
  while(id && id!=='END'){
    if(guard++>200) break;
    path.push(id);
    const rec=nodeIndex[id]; if(!rec){ results.push('FAIL: missing node '+id); break; }
    const corr=rec.data.choice && rec.data.choice.options.find(o=>o.to);
    if(!corr){ results.push('FAIL: no correct option at '+id); break; }
    id=corr.to;
  }
  results.push((id==='END'?'OK':'FAIL')+': mainline reachable, nodes='+path.length+', end='+id);
  // 2) 每个节点的坏结局结构
  let bad=0, hasChoice=0;
  Object.keys(nodeIndex).forEach(k=>{
    const n=nodeIndex[k].data;
    if(n.choice){ hasChoice++; const w=n.choice.options.find(o=>o.end);
      if(w && w.end && KIND_LABEL[w.end.kind] && w.end.title && w.end.text) bad++; }
  });
  results.push('OK: nodes='+Object.keys(nodeIndex).length+', nodesWithChoice='+hasChoice+', validBadEnds='+bad);
  // 3) 无死链（正确 to 全部可解析到现有节点或 END）
  let dead=0;
  Object.keys(nodeIndex).forEach(k=>{
    const n=nodeIndex[k].data;
    if(n.choice) n.choice.options.forEach(o=>{ if(o.to && o.to!=='END' && !nodeIndex[o.to]) dead++; });
  });
  results.push((dead===0?'OK':'FAIL')+': dead references='+dead);
  return results.join(' | ');
}

function boot(){ buildBgLayer(); goTitle();
  const q=location.search+location.hash;
  if(/selftest/.test(q)){
    const r=runSelftest();
    window.__SELFTEST__=r;
    document.title='TEST::'+r;
  }
  const md=q.match(/demo=(\d+)-(\d+)/);
  if(md){ const nid=md[1]+'-'+md[2]; if(nodeIndex[nid]){ setTimeout(()=>{ startNew(); gotoNode(nid,0); },100); } }
  if(/autoplay/.test(q)){ setTimeout(runAutoplay, 150); }
}

/* ============================================================
   DOM 驱动的完整交互自测：模拟真实点击流
   ① 主线：每节点把段落点完 → 点正确选项 → 达 END（真结局）
   ② 坏结局：中途点错误选项 → 弹结局 → 点“回档重来” → 回到抉择节点
   ③ 存档/读档：存一格 → 读一格 → 回到原位置
   ============================================================ */
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function clickStage(){ document.getElementById('stage').dispatchEvent(new MouseEvent('click',{bubbles:true})); }
async function clickText(){ const t=document.getElementById('text'); t.dispatchEvent(new MouseEvent('click',{bubbles:true})); }
async function runAutoplay(){
  FAST=true; const out=[];
  // ① 主线
  startNew();
  let guard=0;
  while(state && guard++<300){
    if(document.getElementById('endOverlay').classList.contains('show')){ break; } // 真结局已弹
    const id=state.nodeId;
    if(id==='END'){ break; }
    const data=nodeIndex[id].data;
    // 段落点完
    let pg=0;
    while(state.paraIdx < data.paragraphs.length-1){
      await clickStage(); pg++;
      if(pg>20) break;
    }
    // 触发抉择
    if(data.choice){
      await clickStage(); // 末段点击 → 亮出选择
      await wait(40);
      const area=document.getElementById('choiceArea');
      if(!area.classList.contains('show') && state.paraIdx>=data.paragraphs.length-1){ out.push('FAIL: choice not shown at '+id); break; }
      const opt=document.querySelector('#options .opt');
      if(!opt){ out.push('FAIL: no option button at '+id); break; }
      opt.dispatchEvent(new MouseEvent('click',{bubbles:true}));
      await wait(40);
    } else {
      await clickStage();
      await wait(30);
    }
  }
  out.push('主线: 终点='+state.nodeId+' 真结局显示='+document.getElementById('endOverlay').classList.contains('show'));

  // ② 坏结局 + 回档
  const ch2=CHAPTERS[1]; const nid=ch2.nodes[1].id; // 2-2
  gotoNode(nid,0);
  // 点到末段
  let g2=0;
  while(state.paraIdx < nodeIndex[nid].data.paragraphs.length-1 && g2++<20) await clickStage();
  await clickStage(); await wait(40);
  const wrongOpt=Array.from(document.querySelectorAll('#options .opt')).find(b=>/沉沦|湮灭|死亡/.test(b.querySelector('.tag').textContent));
  if(!wrongOpt){ out.push('FAIL: no wrong option found at '+nid); }
  else {
    wrongOpt.dispatchEvent(new MouseEvent('click',{bubbles:true}));
    await wait(40);
    const shown=document.getElementById('endOverlay').classList.contains('show');
    out.push('坏结局触发='+shown);
    // 点“回档重来”
    const back=Array.from(document.querySelectorAll('#endButtons .ebtn')).find(b=>/回档/.test(b.textContent));
    back.dispatchEvent(new MouseEvent('click',{bubbles:true}));
    await wait(40);
    out.push('回档后回到节点='+state.nodeId+' (期望='+nid+')');
  }

  // ③ 存档/读档
  state.paraIdx=0; gotoNode('4-4',0);
  const autoBefore=JSON.parse(localStorage.getItem(LS_AUTO)||'null');
  saveSlot(1);
  let slot=JSON.parse(localStorage.getItem(LS_SLOT+1)||'null');
  out.push('手存档='+(slot? (slot.nodeId+' p'+slot.paraIdx):'FAIL'));
  // 跳到别处再读档
  gotoNode('6-5',0);
  loadSlot(1);
  out.push('读档后='+state.nodeId+' (期望=4-4)');

  const res='AUTOPLAY: '+out.join(' | ');
  window.__AUTOPLAY__=res; document.title='TEST::'+res;
}
boot();
