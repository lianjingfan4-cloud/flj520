const CHAPTERS = [{"chapter":1,"circle":"第一圈 · 林勃（灵薄狱）","title":"第一章 · 迷途 · 林勃","subtitle":"清醒的幽暗与未竟之德","nodes":[{"id":"1-1","title":"幽暗森林","paragraphs":["我曾在人世旅程走到一半之时，迷失在一座幽暗的森林里。四周尽是浓得化不开的阴影，树木盘根错节，灌木纠缠如网，没有一条路能看清通向何方，连最熟悉的方向也认不出来了。我站在原地，心中又惊又惧。那年我三十五岁，正是生命最丰盛的年纪，却仿佛一切都在这片密林里骤然停下。抬头望去，林梢之上隐隐透出微光，黎明正从我头顶的世界慢慢醒来，可那光亮偏偏照不进这片林子，只让我更看清脚下的黑暗。我于是靠着树干喘息，一点点回想自己如何走到这一步——究竟是什么，让我偏离了本该笔直的路途，越走越深，越走越暗。","就在我正要往前去时，一道窄窄的路口猛地窜出一只花豹，浑身斑斓，皮色鲜亮，行动轻捷又举止傲慢，正正拦住去路，用炽热的眼睛盯着我，叫我进退不得。我正要退避，又见一头雄狮张着大口踱步而来，鬃毛蓬乱，气势汹汹，仿佛要将整片天地都吞下。我还未定神，一只干瘦的母狼又悄然现身，它贪婪一日胜似一日，眼睛泛着灰光，仿佛永无餍足，缓缓逼近，步步封死我所有的出路。豹、狮、狼，三只野兽将我围在当中，我的脚步越来越沉，几乎要被逼退回那片更深的黑暗里去。这一刻我终于明白，挡住我的不是野兽，而是我自己心里那三样东西：豹一样的野心与欲念，狮一样的骄傲与强横，还有那怎么填也填不满的贪婪。","就在这进退无路、几乎绝望的当口，我恍惚看见一个影影绰绰的人形，伫立在不远处，仿佛已在那里站了许久。他开口时声音沙哑而温和，像是隔着漫长的岁月传来：“你不是鬼，是人间的活人么？”我答不上来，只随着他的指引抬头。他告诉我，他是奉一位天上女子的嘱托而来，要带我离开这片死地，走另一条更艰难、也更光明的路。那一刻我心里明白：若转身逃回身后的黑暗，我终其一生都将困在这座森林里；可若信他的话往前，前头等我的，是我不敢想象的未知。我望着这个慈柔的影子，心里涌起一种说不清的信任，仿佛他本就是为我而来的一般。","原来这影子叫维吉尔，是罗马的诗哲。他站在原地静静等我，既不催促，也不强求，只把抉择留给我自己。背后的黑暗深不见底，前面的路也看不见尽头。我站在两个世界之间，心里两股念头来回拉扯，双脚却仿佛生了根，一步也迈不动，一步也不敢退。三个野兽无声地守着路口，维吉尔无声地等着我回答。"],"choice":{"prompt":"幽暗的森林与慈柔的向导之间，你要走向哪一边？","options":[{"text":"深吸一口气，走向维吉尔，请他为我引路","to":"1-2"},{"text":"我不敢信这陌生影子，转身逃回身后的森林","end":{"kind":"迷途湮灭","title":"永困幽暗森林","text":"你转身没入幽暗的森林，身后的光一点一点熄灭，维吉尔的身影也消散在雾气里。这里没有烈火，也没有鞭笞，只有无尽的迷途。你从此成了这座森林里游荡的影子，永远记得有一条路通向光明，却再也跨不出一步。你渴望那光，却只能望着它，日复一日，年复一年。你终于明白：林勃的悲，从来不是痛苦，而是伸手可及、却永远够不到的渴望。"}}]}},{"id":"1-2","title":"地狱之门","paragraphs":["维吉尔领着我，沿着那条昏暗的路往前走。他步履从容，缓缓告诉我此行的缘由：天上有一位女子，名唤贝雅特丽齐，见我被困在森林里，动了恻隐之心，特意恳请他来救我。她本已升入天堂，却仍为这一个迷途之人奔走，这份情意让我心头一暖。维吉尔说，他是受她所托，要带我穿过地底的世界，去见那真正的光；而这条路，必须从地狱的门户走起。我既感激又忐忑，前方仿佛没有尽头，却又有一种说不清的牵引，让我不由自主地跟着他的脚步，一步也不敢落下。我一边走一边想，这位素未谋面的天上女子，究竟是怎样的慈悲，才会为一个早已迷失的自己，千里迢迢请来这样一位引路人。这份恩情，我此刻还不明白，却已先记在了心里。","我们没走多远，一座巍峨的城门便立在眼前。那门高得望不见顶，通体黝黑，仿佛凝聚了世世代代的叹息。门前没有士兵把守，也没有刀剑，只有一行字，深深镌刻在门楣之上，任凭岁月侵蚀也不曾磨损。风从门缝里呜呜吹过来，带着一种说不清道不明的寒意。那不是恐惧，而是一种过分浓稠的安静，安静得能让人听见自己的心跳，一下，又一下，敲在空旷里。我停下脚步，看着这扇门，忽然有种奇怪的错觉——好像它等了我很久很久，就为了此刻把我拦在门外。我停下脚步细看，那门不是冰冷的死物，倒像一直睁着眼睛，静静等着每一个走到它面前的人，看他是惧怕，还是敢跨过去。","我抬头去读那行字，一字一字，如同冰水落在心头：“穿过我，走向无尽痛苦之城；穿过我，走向永恒悲伤之民；穿过我，走向永劫沉沦之族。你们这些进入此门的人，放弃一切希望吧。”最后那句话像一块巨石压在我胸口。放弃希望——这四个字，比任何刑具都叫我害怕。我本能地向后退了一步，仿佛那扇门下一刻就要将我整个吞没。我急切地望向维吉尔，想从他眼里看到一丝转圜的余地，可他只是静静地看着我，仿佛早就等着我在这里犹豫。","维吉尔没有拉我，他只轻声说：“凡踏入此处者，都曾与希望纠缠不休。可若你这样就在门前回头，那你永远学不会，什么才是真正的放下。”门就在前面，黑暗深处仿佛传来无数灵魂低低的喟叹，像潮水一样远远近近。我站在原地，心里反复掂量那四个字：放弃希望，到底是彻底的绝望，还是终于舍得放手的释然？"],"choice":{"prompt":"门楣上的铭文让你胆寒，你要如何应对？","options":[{"text":"定住心神，念一句信念之语，迈步跨过门槛","to":"1-3"},{"text":"被“放弃一切希望”吓住，转身逃回幽暗森林","end":{"kind":"灵魂沉沦","title":"被希望囚禁的人","text":"你被“放弃一切希望”的铭文击垮，转身狂奔，逃回那片幽暗森林。从此你一遍又一遍地在记忆里重读那行字，越是不肯放开，就越是抓不住光亮。你成了被希望本身囚禁的人——你执意要攥住那一点不肯放手的念想，反被它拖进无底的黑暗。林勃没有烈火，有的是永恒的悬望：你望着门内的光，却永远跨不出那一步。"}}]}},{"id":"1-3","title":"渡过阿刻隆河","paragraphs":["跨过门扉的那一瞬，身后的光明彻底熄灭了。眼前是一片无星的天空，耳边涌来一阵阵压抑的哭号，那哭声从四面八方升起，既不尖锐，也不凄厉，只是一声声绵长的、没有尽头的叹息。我紧走几步，来到一条荒凉的河边。那河水黝黑而浊重，几乎一动不动，仿佛凝结了千年的哀愁。岸上密密麻麻站着无数亡灵，他们挤在一处，目光空洞，仿佛都在等待着什么，谁也没有说话，只任由风吹起他们单薄的影子。我试着朝一个背影喊了一声，它却像没听见，依旧定定地望着对岸。我忽然想，或许它们不是不想回答，而是早已忘了自己还能被人呼唤。我望着这条河，忽然想起生前的故事里，常说要横渡冥河的古老传说。","就在我出神时，一个老人划着一艘小舟缓缓驶来。他须发皆白，眼珠却燃着不灭的怒火，正是渡神卡戎。他一见我便厉声呵斥，说我这活人走错了地方，休想上他的船。岸上的亡魂却争先恐后地拥上船去，仿佛渡河是它们唯一的归处。卡戎粗声粗气地说，只有死者的灵魂，才配由他载过这条阿刻隆河，涉过永生的冥河，踏上那遥远的彼岸。他一边说，一边用船桨把越界的亡魂赶回岸边，火气大得连河水都跟着翻涌。我这才看清，原来这些亡魂大多并不情愿，是被这滔滔的水声与宿命一路裹挟而来，此刻才成群地挤在时代的渡口，等着被送往那不可回头的彼岸。","维吉尔走上前去，沉声对卡戎说：“我这同伴有天上使者的授意，你不得阻拦。”卡戎听罢，那雷霆般的怒气竟缓缓平息下来，不再吆喝，只默默将船拢向岸边，眼神却仍带着狐疑。可我望着那凝固的黑色河水，望着船上挤作一团的亡魂，心里没来由地一阵翻腾。恐惧像潮水一样涌上来，我几乎要站不稳，只能死死攥住自己的衣袖，让指甲嵌进掌心，才能勉强撑住不倒下去。","船拢到我脚下，那些亡魂挤挤挨挨地站着，默不作声。我低头望去，河水黑得像一口深不见底的井，连一丝光亮都照不进去。卡戎板着脸，眼里的火却未熄灭，只等我一步跨错就要将我赶走。前行是这令人窒息的黑暗与狰狞的船夫，后退则是无边的永夜。我握着拳，站在生与死的边沿，脚底仿佛随时会陷下去。腿在发抖，心也在跳，可我知道，这一步，终究要自己跨出去才作数。"],"choice":{"prompt":"面对黑暗的河水和狰狞的船夫，你可敢踏上船去？","options":[{"text":"屏住呼吸，跟着维吉尔踏上小舟，任他渡我","to":"1-4"},{"text":"被黑暗河水吓住，死死扒住岸边不肯上船","end":{"kind":"灵魂沉沦","title":"搁浅在冥河之岸","text":"你死死扒住岸边的泥土，任凭卡戎如何催促，也不肯迈上那艘船。河水在你脚下静静翻涌，仿佛在嘲笑你的怯懦。维吉尔叹一口气，独自离去。从此你便永远搁浅在这阿刻隆河岸，既渡不到对岸，也回不去你来的地方。你的灵魂在岸边游荡，望着船来船往，望着一代代的亡魂涌向彼岸，唯独你永远停在原处，望着那条本属于你的路，渴望，却一步也踏不出去。"}}]}},{"id":"1-4","title":"林勃之环","paragraphs":["我过了船，仿佛做了一场极长的梦，等再睁开眼，自己已经站在了彼岸。我顾不上回味方才的惊惧，维吉尔扶着我的肩，带我一直往里走。我们越走越深，到了一处开阔的圆形地界，这便是地狱的第一环。这里没有雷火，没有深渊，也没有狰狞的刑具，只有一片朦胧的、灰蒙蒙的光。细听之下，空中到处都是压抑的叹息，那叹息不像痛苦时那样撕心裂肺，倒像是一声又一声说不出的哀愁，从四野低沉地涌来，久久不散。我一时竟分辨不出，这究竟是哭，还是想喊却喊不出来的静。我想起生前的夜里也曾有过这样的时候，心里堵得发慌，却一声也哼不出来。林勃的这一声叹息，便像极了那一瞬。","我环顾四周，无数灵魂聚在这里，神态安详，举止从容，没有谁痛苦地挣扎，也没有谁哭泣。他们的目光平静而空茫，仿佛早已习惯了这无边的寂静。我忍不住问维吉尔：这些人是谁，为何要困在这里？他答道，他们都是生前没有过错、也不曾犯罪的人，唯独欠缺一样东西——他们没有受过洗礼，生得早了一些，在世人还不知道基督之光的年代，便已离开了人世。我听了一阵恍惚，既替他们惋惜，又暗暗庆幸自己生得晚了些，还能赶上那光。","“他们并无罪愆，”维吉尔低声道，“只是生在了没有希望的时代，无缘领受那信仰的光荣。于是他们只得留在这里，永生永世地渴望，渴望着那永远触不到的光。”我听了，心里一阵酸楚。这不是能用刑罚来清算的罪，而是生不逢时的憾——他们什么也没做错，却永远够不着那一点真正的光荣。我望着他们安详的脸，竟觉得那平静比任何哭泣都更沉重，仿佛他们早已把叹息咽进了骨头里，谁也不愿再开口打扰旁人。我蹲下身，轻声问一个面容清癯的老者，问他为何不怨不等。他只静静地看着我，像是早已把这个问题问过自己千百遍，也早已在心里答过了千百遍。","这些灵魂全都活在自己的世界里，默默望着一个方向，仿佛那里有一道光，只是谁也没有说出它。我站着，久久挪不开目光。他们既没有罪，也没有错，却要在这里永远怀着一丝够不到的渴。我忽然心生怜悯，想要为他们停下，替他们说一句公道话。可这同情本身，就像是悬在深渊边上的一根细线，我在心里反复问自己：留下，究竟算慈悲，还是算软弱？"],"choice":{"prompt":"面对这些无过而永困的灵魂，你是否要停下为他们鸣不平？","options":[{"text":"压下怜悯，明白“无过”不等于“有光”，继续前行","to":"1-5"},{"text":"心怀悲悯，执意留下，要替他们乞求救赎","end":{"kind":"灵魂沉沦","title":"与悬望同沉","text":"你放不下这份恻隐，执意留在林勃，要替这些无罪的灵魂向天恳求。可这愿望本身，成了束缚你的镣铐——林勃的规则早已写好，你的悲悯救不了他们，反倒把你自己也钉在了这片长叹之地。你从此与他们一样，永远望着一丝够不着的微光，年年岁岁。你不曾犯罪，却因这放不下的慈悲，生生把自己困进了别人的遗憾里，连同那点渴盼一道，沉入无边的悬望。"}}]}},{"id":"1-5","title":"与古代哲人相会","paragraphs":["正沉吟间，四位俊逸的影子迎上前来。为首的是双目失明、却气度庄严的荷马，一开口，便是那万世同仰的诗句。他身后跟着贺拉斯、奥维德与卢坎，四人相视一笑，竟像一见如故，同声将我迎来，仿佛我也是他们当中的一员。维吉尔含笑引我上前，说这几位都曾以诗为炬，照亮过人类的漫漫长夜，如今正可与我作伴同行。我受宠若惊，却又隐隐觉得，能在这无望之地与他们相逢，倒像是命运赏我的一份安慰，让我在深渊边上，先望见了一角人间的清明。可我也留意到，他们唇边虽挂着笑意，眼底却没有光的影子——这一处城堡再华美，终究是缺了什么东西的。","我们一同来到一处高贵的城堡，四周是七重环绕的城垣，门前有清冽的水流，城里有绿得发亮的草地与花木。这里没有阴森，反倒透着一种肃穆的、属于原初的安宁。草地上聚着一群面容端肃的影子——那位手持沉思之姿的是苏格拉底，他身旁依着聪慧的弟子柏拉图，还有那位将万理分门别类的亚里士多德，以及德谟克利特、塞涅卡等一众先贤。他们举目凝望四方，神情平和，目光却远远越过城垣，望向外头那不知名的虚空。我看得有些恍惚：这样一群照亮人类的大智慧，竟也困在同一座城里。他们谈笑自若，仿佛早已释然，可我总觉得那平静底下，压着一层连他们自己也不肯碰的东西——像一扇永远关着、却谁也推不开的窗。","我望着这些人类智慧的光华，心头涌上一阵说不清的震颤：他们既不犯罪，也无过错，德性昭然，学识冠绝，却偏偏要困在这座不设门窗的城里，望着缺了光明的天。以他们的功德，本应早已得偿所愿才对。可为什么，连他们也够不着那点光？一瞬间，我心中竟生出一丝动摇——若连这些圣贤都不得救，那所谓的救赎，究竟算不算公允？我又有什么资格，去轻信那还没亲眼见到的光呢？","这念头一起来，就如同一颗石子投入深潭，涟漪一层层漾开。我看着苏格拉底平静得近乎落寞的眼睛，心里两种声音在打架：一种说，这样的哀怜确是人之常情；另一种却在悄悄发问——若他们一无过错、却永远够不着光明，那信仰的意义，究竟立在何处？我站在原地，一时竟不知道该信哪一个。"],"choice":{"prompt":"圣贤无过却不得救，你的信念可会因此动摇？","options":[{"text":"压下疑窦，向维吉尔请教这“无过之悲”的由来","to":"1-6"},{"text":"认定救赎不公，从此怀疑神明，不肯再往前行","end":{"kind":"灵魂沉沦","title":"认命于不公的人","text":"你认定这样的安排毫无公理，心头的火越烧越冷，最后化作一声自嘲的冷笑。你看穿了这世界的无情，便也把脚下的路一同看死了。从此你再不相信任何救赎，认定光只是骗人的幻象，便停下了脚步，在城堡的阴影里坐了下来。你没有错，也并非无得，却因这扇自己亲手关上的门，把自己永远留在了怀疑与不甘里，任岁月流尽，再无光亮。"}}]}},{"id":"1-6","title":"智者的叹息","paragraphs":["维吉尔踏前一步，望着那座不设窗的城，声音低沉如水：“你看他们，智慧冠绝古今，德行无可挑拣，可他们终身渴望着那扇从未对他们开启的门。这城虽名为光，却无窗无扉——不是光不愿照进来，而是他们生得早了，在信仰尚未为人所知的时代里，便已走完了各自的一生。”我顺着他的目光看去，那些智慧的身影仿佛成了凝固的剪影，安详里透着一丝说不出的空旷。我忽然想，若换作是我，拥有这样的学识，却只能困在门里，望着一生够不着的天，连我自己都不知道能不能撑住。我想象着自己若是他们，日日望着那道光却够不着，怕不是早已失了这份从容，只剩下一层深深的落寞。","“他们的悲，不在刑罚，”维吉尔续道，“而在于一种悬望——明知尽头有光，却终身不得近前。苏格拉底、柏拉图、亚里士多德，这些名字曾照亮人类的清晨，却唯独照不见自己脚下的路。他们若曾受洗，若能生在基督之后，本不必困于此地。”我一听，心头又被揪紧。他们明明离神那么近，仿佛一伸手就能够着，却只能隔着千百年，望着那扇永不开启的门。我几乎能听见那句说不出的话，就悬在他们的叹息里。","我看见这些智慧的心灵永远留着那一点够不着的缺憾，望着明明就在眼前、偏偏永远无法抵达的光明。他们不发一言，只是静静地望着，把千年的叹息都咽进肚子里。我不由得有些愤愤：这未免太不公道，凭他们的一身学问与德性，不该落得这样的下场。我几乎要替他们开口，向那冥冥中做主的天，质问一句为什么。为何偏偏让最懂道理的人，困在最说不出口的遗憾里？我几乎要替他们出口气，可这念头一起，我又隐约听见一个声音在问：你嘴上替他们鸣不平，心里可有一分，是在替自己不肯认的胆怯开脱？","维吉尔仿佛看穿了我的心思。他伸手拦住我：“你又想替他们求全责备了，是么？可你有没有想过，这城里最深的叹息，恰恰不是别人的亏待，而是他们自己也明白——再高的智慧，若不曾真心走近那份爱，终究只是一个人，独自站在门外。”我握着拳，一时语塞，千言万语都堵在喉咙里，一句话也说不出来。"],"choice":{"prompt":"你是否要替这些智者向天求全责备？","options":[{"text":"咽下不平，明白“知”代替不了“信与爱”","to":"1-7"},{"text":"执意替智者讨个公道，愤愤质问神的不公","end":{"kind":"灵魂沉沦","title":"为他人作怒的魂","text":"你咽不下这口气，替席间的智者向天发出质问，越说越是激昂，仿佛自己握住了公理。可这份为了他人的怒气，最终烧空了你自己的心。你沉湎于替别人讨公道的义愤之中，一味盯着他人的缺憾，反倒忘了自己脚下那一阶一阶向前走的路。你停在了这座城里，与那些智慧的叹息作伴，满腔义愤无处安放。你没有罪，却因这放不下的不平，把自己活成了另一声无声的长叹。"}}]}},{"id":"1-7","title":"离开林勃","paragraphs":["维吉尔缓缓转过身来，目光落在那群先贤身上：“你看，他们什么都有——智慧、德性、声名，样样不缺。可他们唯独缺一样：从未真正走进那绝对的爱里，从未在活着的时候，让那爱从心里长出来，化为实实在在的善行。这便是这里最深的悲剧——不是他们不够好，而是他们一辈子站在门外，望着门内的光，终究没有叩响它。”我一字一字听着，心里那团云，渐渐散开。原来困住他们一生的，从来不是才学，也不是命数，而是那始终未曾跨出去的半步。我的心一下子亮堂了：所谓救赎，从来不是一下子发生的事，而是无数个不愿再逃的瞬间，一寸一寸走出来的。","原来单单有知，并不能换来救赎。会思考、会赞美、会叹息，都不等于真正走近了爱。爱不是嘴上说说，也不是心中求索，而是要在尘世里一步一步走出来的——要对人慈悲，要行善积德，要在黑暗里也肯发光。我终于明白，这林勃正是给所有“聪明却未曾行出来”的人的镜鉴：你在人前再光耀，若不曾把光行到人心里，到头来，也只是永远站在门外。我从前总以为，想通一件事就是前进了，此刻才恍然，想通若不落地，终究只是半途。我忽然明白了自己为何会迷失在那片森林——不是因为我不知对错，而是因为我总是把明白，当成了做到。","我又看了一眼那些智慧的面孔，心里不再是不平与质问，而是一种沉甸甸的警醒。我转头望向维吉尔，说：“我要继续往下走。”他闻言，眼中流露出一丝赞许。这条路越往下越暗，罪也越深，可正是要亲自看尽每一层的苦，我才能真正明白，什么值得珍重，什么不该重蹈。我忽然觉得，这一趟不是替别人走，也不是为看热闹，而是要把自己心里那些还不肯认的罪，一桩一桩，重新照一遍。这念头一起，原本横在胸口的畏惧竟松动了几分，仿佛脚下那黑黢黢的深渊，也没有先前那样叫人害怕了。","我在林勃的出口站定。身后，是无望却安详的智者；身前，是更深、更黑的深渊。维吉尔已抬脚向前，回头等我。我心里清楚：真正的救赎，从来不在这层淡淡的叹息里，而在更深的、更需要人心去面对的地方。我一辈子没敢走的路，此刻，正等着我一步走下去。"],"choice":{"prompt":"林勃的叹息你已读懂，下一步，你当如何？","options":[{"text":"握紧脚下的路，随维吉尔走入更深的深渊","to":"2-1"},{"text":"贪恋这层“无苦”的安宁，在疲惫中停下歇息","end":{"kind":"灵魂沉沦","title":"向往安逸的沉眠","text":"你被这层“无苦”的安宁绊住了脚，觉得既没有刑罚，也无须直面深重，索性坐下来，歇一歇。可这片刻的安逸，正是最温柔的陷阱——你一旦停下，就再也站不起来。你想守护的不过是一点清风与平静，却在不知不觉间，活成了林勃里又一个无所求、也无所得的魂。你没有深渊可坠，没有烈焰可烧，只是背过身去，不再愿看清前面更黑的地方，让灵魂在这淡淡的叹息里，永远安睡了下去。"}}]}}]},{"chapter":2,"circle":"第二圈 · 色欲（雷雨漩涡之圈）","title":"第二章 · 风暴 · 色欲","subtitle":"让爱沉没的海，随风而逝的罪","nodes":[{"id":"2-1","title":"守门人米诺斯","paragraphs":["越过林勃那层空濛的雾气，我与维吉尔大人一路向下，行至一处更深的隘口。空气陡然沉了下去，光线仿佛被一只无形的手按住，连风都带着某种焦躁的喘息。就在这片幽暗的起点，踞坐着一位并不陌生的判官——米诺斯，克里特岛上那位以公正闻名的贤王，如今成了亡魂的裁决者。他不必动笔，也不需开口宣判，只消看一眼来人的眼神，便能把一生的罪过读个明白；他那条盘绕而起的巨尾，每绕上一圈，便替他定下一个更深的圈层。我们脚下的这条通道，正是通向他那尾尖所指的黑暗深处。","我们驻足了片刻，便见无数亡魂从四面八方涌来，像秋日里被风赶落的枯叶。他们瑟缩着走过米诺斯面前，由他逐一审视。米诺斯不言语，只盯着每个来人的眉心，仿佛在翻阅一本写满前尘的旧账；读罢，他便把长尾在身周一圈圈地盘绕起来，那绕起的数目，正与他判定的罪孽之环相应。一个又一个灵魂，就这样被他甩进各自的深渊，没有一个能逃过那一眼。我忽然明白，我们脚下这条幽暗的通道，正是通往那盘绕如恶龙的圈层的路。","终于轮到我们时，米诺斯抬眼打量我，那目光像豺犬闻到了异类的气味，带着一股审视而嫌恶的凉意。他裂开嘴唇，声音低沉而危险：「你这活人，竟敢走进死者的国度。你该记得那条铁律——入此门者，当弃所有希望。回去吧，趁你的血肉尚未沾染此处的怨气；再往前一步，便是连我都要替你惋惜的深渊。」他那条长尾在地面上缓缓扫过，发出磔磔的声响，仿佛在替我的命运记时。我心头一颤，那双眼睛里的光，是我在人间从未见过的、属于另一个世界的冷。","那一瞬间，一种莫名的怯意顺着脊背爬了上来。我不免脚步迟滞，甚至真的动了退回去的念头。可维吉尔大人立时挡在我身前，那姿态既不卑也不亢，只平静地对着米诺斯开口：「莫要阻挡他命定的行程。此人的旅途是天意所许，非他自恃的胆量，亦非你我能拦。」米诺斯的低吼在喉间滚了一滚，终究没有爆发，只把那条长尾恨恨地卷起，侧身让出道路。他也不再看我一眼，只将目光投向后方如潮水般涌来的亡灵，仿佛我不过是一阵无关紧要的风。","我这才明白过来：米诺斯的威吓并不可怕，可怕的，是我心底那一点对未知的怯意。他拦不住命定之人，正如恐惧拦不住一个愿意直面自己灵魂的人。维吉尔大人回过头，目光平静如水：「记住，愈是靠近污浊，愈要记得你为何而来。你并非要被这地狱的秩序压倒，而是要从它身上读出人世的光。」我深深吸了一口气，把那点怯意稳稳按回心底，随他迈入那片雷雨轰鸣的黑暗。"],"choice":{"prompt":"面对米诺斯的威吓，你要如何抉择？","options":[{"text":"我命定而行，自该继续走","to":"2-2"},{"text":"这深渊太可怕，我竟想退却","end":{"kind":"灵魂沉沦","title":"被风裹走的怯者","text":"你的脚后退了半步，那迟疑便成了最诚实的告解。米诺斯的尾巴骤然收紧，仿佛认出了你眉间那一丝怯意。你连推辞都未及出口，脚下的大地便成了无底的漩涡。狂风暴起，把你裹进那股永不停歇的黑色气流里——你终于明白，这桩罪罚里没有侥幸：凡是被恐惧与私欲拽住、没能守住理性的人，都要在欲海之风的呼啸中翻滚，直到忘记自己是谁。你再也听不见维吉尔大人的呼唤了。"}}]}},{"id":"2-2","title":"风筝般的风暴","paragraphs":["越下越深，那声息便越涨越高。我最初听见的不再是纯粹的风声，而是从黑暗深处翻涌上来的、密集得叫人头皮发麻的哀鸣。终于，头顶那层沉闷的铅云被撕开一个口——不，那不是天，而是一场永不止歇的风暴。它如同一只看不见的巨手，把无数道影子高高扬起，又重重摔下；它们撞上嶙峋的崖壁，发出一声钝响，随即又被抛向虚空，周而复始，没有一刻止息。那声音里没有哭喊的余地，只有同一桩事，被成千百回重复。","我站在原地，抬着头，连脚下都仿佛晃了起来。风暴的中央，忽然响起一声撕裂般的怒吼，像是这片黑暗深处藏着一头喘息着的巨兽。那些影子便在声浪里被卷得更高，像纸屑、像灰烬，又像深秋里被风追着跑的枯叶。我甚至能看清其中几张脸——有的闭着眼，有的却睁着，仿佛还在朝我呼喊，又仿佛已经喊得实在太久，连嗓子都哑了。那场景荒凉得叫人说不出话来。","维吉尔大人让我细看那些影子。它们不是被粗暴驱赶的牲畜，而更像我们家乡春日里被风吹散的纸鸢，或是一群被风卷落的寒鸦——只是这风再不停，它们也再落不了地。我努力辨认那些翻滚的形骸：那位是统治过无数城邦的亚述女王塞米拉米丝，身旁那位是以尼罗河为名的埃及艳后克里奥帕特拉；再远处，还有让千帆竞渡、只为她一人而倾覆的海伦，以及那个把最勇敢的武士卷进情网的特洛伊王子帕里斯。他们生前呼风唤雨，此刻却被同一种风玩弄于股掌之间。","我望着那些被抛上抛下、永无安宁的身影，喉头忽然一阵发紧。他们也曾是活生生的人，也有过动人的容颜与炽烈的心。为何会落到这般境地？风暴仿佛在回答我：他们活着的时候，是被欲望这阵「风」推着走的那一个；如今肉身消散，那阵风却还在，而且再也没有人能替他们拉下锚来。欲望上不得岸，风便成了永夜。","维吉尔大人仿佛看穿了我的动摇，淡淡道：「你若只是怜他们，便只看到了一半。他们并非被无端的风卷起，而是被自己心里的风卷起。明白这一点，你才谈得上看清这地狱。」我一怔，把视线从那些求救的手影上移开，转向这风暴更深处的真相——那里藏着比纸鸢更沉的东西，也藏着这一圈地狱真正的名字。"],"choice":{"prompt":"面对这样凄凉的风暴，你心中涌起的第一念是什么？","options":[{"text":"这是他们咎由自取的风，也是警世的碑","to":"2-3"},{"text":"太可怜了，我忍不住只想为他们哭","end":{"kind":"迷途湮灭","title":"溺于悲悯的看客","text":"你被那惨状牢牢攫住，泪水不知不觉就涌了上来。你不去看这风暴的因果，只一味替他们难过——可那难过一旦成了心头唯一的翳，你的脚步便也飘了起来。突然，你脚下的尘埃化作同样的风，把你轻轻托离地面。你惊觉自己竟也成了那纸鸢的一员，被无名的气流卷入、抛起、狠狠撞向坚硬的岩壁。原来悲悯若失其理，便只是另一种沉溺；你与那些影子再无分别，只在欲海的风里永无止境地打转。维吉尔大人的喊声远去，最后化作风与风之间的回响。"}}]}},{"id":"2-3","title":"弗兰切斯卡与保罗","paragraphs":["在那群被风撕扯的影子中间，有两道竟紧紧相拥，仿佛无论风暴如何咆哮，也撼不动他们相拥的姿态。这在四周翻滚的孤零魂影里格外扎眼，叫人心上一动。我忽然生出一种连自己也说不清的冲动，朝那对影子唤道：「被这风吹着的、你们二人，若有愿与我说话者，请停下来。」话音落下，那两道影子竟如听见了久违的呼唤，乘风缓缓飘落到我们面前，又轻轻歇了下来。","那是两个与我同乡模样的人。女的眉目间带着几分哀婉的倦色，男的则面容温润，却拢着一层化不开的阴影。他们稍稍抬起头，仿佛从漫长岁月的黑暗中细细打量我这一个活人，眼底是小心翼翼的惊奇。维吉尔大人低声告诉我：「那芳名叫做弗兰切斯卡·达·里米尼，另一位，是她丈夫的弟弟保罗。他们因同一桩罪一同落在这里，至死也未分离。」我心头一沉：兄弟之妻，叔嫂之分，这中间该隔着多少人间伦常，又有多少说不清道不明的纠葛。","我细细打量着他们。那女郎眉目之间有旧日贵族的矜持，也有被风刮了太久的憔悴，神色里透着一股欲言又止的味道；那青年则始终垂着眼，仿佛不敢去看四周，只用半边身子紧紧护住她。两人之间竟连一丝缝隙也无，像是那道风暴也分不开的剪影，又像是跌落同一道深渊时，彼此死死握住的一只手。我忽然明白，他们并非仅因并肩才显得亲近——而是那同坠的命运、那共犯的罪与那割不断的旧情，把他们的骨血都焊在了一起，再难拆解。","我本不该多问，可那克制不住的悲悯却从我喉间漫了上来。我想知道，把他们一路推到这狂风里的，究竟是一桩怎样的事；又或者，那是每个活人到死都绕不开的一处软肋。而那一念——那「知道了又如何」的念头，也正悄悄在心底盘桓，搅得我心神不宁。是细问到底，宁可揭开他们经年的旧伤，还是点到即止，留给他们和我自己一丝体面？","维吉尔大人这次没有拦我，只低声道：「你想问便问吧。只是记住：你眼中的眼泪，未必是他们此刻最需要的东西。」我望着那对相拥的影子，喉头滚了滚，终于开口：「弗兰切斯卡……若你愿说，便说与我听听，也好一慰我们这一程的孤寂。」风仿佛也在那一刻静了一瞬，只等她的回答。"],"choice":{"prompt":"面对这对相拥的灵魂，你想如何做？","options":[{"text":"轻声问她，把心事说来","to":"2-4"},{"text":"我不忍再看，想就此转身","end":{"kind":"灵魂沉沦","title":"欲言又止的错过","text":"你终究没有开口。那声没问出口的话堵在喉头，化作一声叹息，你便打算转身离去。可就在你转过身的刹那，那两道影子忽然低低哭了起来——他们等了太久，久到连一句询问都成了奢望，而你放下的一半话，恰恰是他们唯一渴求的救赎之舟。风骤然收紧，你还没来得及挪动脚步，便被那悲恸卷得失去了平衡。你的怜悯冷在了半途，你的双脚也再迈不动。从此你被留在风暴的边缘，与那些欲言又止的影子一同，在永不兑现的沉默里翻滚。那半句话，成了你此世最后的遗憾。"}}]}},{"id":"2-4","title":"爱的独白","paragraphs":["弗兰切斯卡的声音低而颤动，像从冰层下透出的水声。「世上再没有比在苦难中追忆往昔的欢愉，更叫人痛楚的事了。」她顿了顿，望着我苦笑，「你既然执意要听，我便说与你。我嫁给了一个由命运而非爱意撮合的人——那是我丈夫，他兄长，相貌与品行都叫我难以亲近。婚后，我的心却不自觉地，转向了他那温厚的弟弟保罗。」她说着，低下了头，「我们日复一日地在一处读书，那故事名叫《兰斯洛特》——讲的是一位骑士与他王后的一段恋情。」","「我们的日子，多半是在那个故事里度过的。」她幽幽地说，「书页翻动的时候，窗外的风雨都仿佛停了，只剩两个困在同一本书里的人，循着字句一点一点地靠近。我起初并不曾多想，只当那是寻常的消遣；可那一页页翻过去，我与他之间，便悄悄多了一点叫不出名字的东西。」她抬起眼，那目光里有追悔，也有掩不住的依恋。","「那一日，我们读到一个段落：那位骑士俯下身，亲吻了他心爱之人的唇。就在那字句之间，我与他四目相对，谁都没有躲开。」她的声音轻得几乎要被风吞没，「两个被爱所擒的人，也在那一刻相吻。我们自以为只是一时开卷的恍惚，却不知那一吻，竟是整整一世的牢。」她抬眼望我，「『爱，从不容许被爱的人不回爱』——那句话与那一吻，往往是在同一页、同一瞬里发生的。于是我们便在那字句面前，把自己交了出去。」","「可命运偏要在最不恰当的刹那睁开了眼。我那丈夫果然撞了进来，他认出我们，霎时悲愤如焚。我们尚未来得及分开，他便拔剑斩下……我与保罗，就此一同倒地，再也没能起身。」弗兰切斯卡说到此处，声音哽咽了起来。「直到今天，那阵风仍不肯放过我们——它把我们卷起，又掷下，仿佛要我们一遍遍重演那一瞬，重演那再也回不去的错。」","我听着，心里像压了一块石头，透不过气。她把自己说得多么身不由己——是被一本旧书、一句诗句拉下了水，是命运错配在先，是那「爱」不受她控制。可我又隐隐觉得哪里不对：若爱当真能叫人如此无辜，为何要把他们与塞米拉米丝、克里奥帕特拉们一同抛进这一阵风里？"],"choice":{"prompt":"听完她的独白，你的判断是？","options":[{"text":"身不由己但亦难逃其咎，望她自醒","to":"2-5"},{"text":"她是无辜的，全怪命运与那本书","end":{"kind":"灵魂沉沦","title":"为爱开脱的盲从","text":"你被她说服了，认定这全是命运的错、那本旧书的罪，与她本人无干。你甚至想开口为她辩解：爱哪里由得了人。可就在你让这个念头落地的一瞬，脚下的风像是认出了你——它捧起你，轻得像对待一个终于被说动的同谋。你这才发觉，你早已把理智与忠信都交给了那一念「无辜」。你也成了那些影子的同类，任由「爱」这一个字替你做所有的决断。风里再也没有可抓的船舷，你就这样被卷进欲海的漩涡，替别人开脱的每一句话，都成了缠住你的绳索。"}}]}},{"id":"2-5","title":"但丁的恻隐","paragraphs":["我当然无法不动容。那两个相拥的影子，一个悲戚低诉，一个沉默紧握——就那样，在生生世世的风里紧紧相偎。我忽然想起自己生前的青春，想起那些曾在心底烧过、又终究错付了的情愫。一股从未有过的酸楚猛地涌上鼻尖，我竟站不住脚，双腿一软，像被抽去了所有的力气，险些就这样昏厥在这片黑暗里。滚烫的泪顺着脸颊滑落，我好想替他们大哭一场，就替那点人间说不清道不明的可怜。","恍惚间，是维吉尔大人那冰冷而清醒的声音把我拉了回来。「起来。」他说，「你这么哭，是要哭到哪一步？」我抹着泪望向他，他却没有半分软化。「被你的眼泪冲昏的，不是他们，是你自己。你该看看他们为何落得这步田地——那驱使他们的『爱』，早已烧过塞米拉米丝、克里奥帕特拉、海伦、帕里斯。你数一数，他们哪一个不是被那阵『情不自禁』卷走的？」","维吉尔大人的话像一盆冷水兜头浇下。我怔怔地望回弗兰切斯卡，她说起那本书时的神情，既像悔恨，又像沉醉。她讲那一个吻时，眼底分明是亮的——那亮点不是求生，而是对那一瞬的依恋。我忽然出了一身冷汗：她并不真的认罪，她只是怜惜自己，怜惜那一段再也回不去的甜。而我，正差一点就要与她一同，沉溺在那种怜惜里。","我闭上眼，试着把那些滚烫的情绪一层层剥开。悲伤之下，是同情；同情之下，却是一股几乎要把我淹没的、替她开脱的冲动。我差一点就要替她喊出那句「不是她的错」。这个念头刚一冒出来，我便警觉了——若我此刻点头认了她的无辜，那我这条穿行地狱的路，又还有什么意义？这一问，把我也问住了。我原是来替人间辨明是非的，若连是非都随眼泪化了去，那这趟苦旅，岂不成了空走一遭？","「怜悯是人应有的德行，」维吉尔大人的声音低了下去，却一字一字砸在我心上，「可怜悯一旦失了分寸，便成了纵容。你要为她哭，还是要从她身上，看清『无节制之爱』的代价？」我望着那对仍在风暴中相拥的影子，眼泪终于慢慢止住。我深吸一口气，把那团悲悯收进心里，转而让它变成一柄反思的刀，去剖开那底下被粉饰的爱与欲。"],"choice":{"prompt":"你被这悲剧打动得几乎昏厥，接下来呢？","options":[{"text":"擦干泪，把悲悯转成省思","to":"2-6"},{"text":"沉溺在眼泪里，与她把泪流尽","end":{"kind":"迷途湮灭","title":"与泪共沉的迷途","text":"你任由眼泪流下去，忘了自己为何而来。那悲悯越积越厚，竟成了你脚下一片看不见的沼泽——你就这样与弗兰切斯卡一同浸泡在那场没有尽头的哀伤里。风把你抱得更紧，仿佛你本就属于它。你不再抬头看天，也不再记得维吉尔大人，你的目光只剩那对相拥的影子，替他们痛，替他们哭。渐渐地，你分不清哪是你自己的心、哪是他们的泪。当欲海的风彻底把你裹住，你也就成了又一个被「情不自禁」卷走的人。悲悯若失其分寸，原来与欲望一样，也能叫人淹死。"}}]}},{"id":"2-6","title":"爱的代价","paragraphs":["泪水止住之后，我的心反而清亮了许多。我重新望向那对影子——他们的故事固然惨烈，可真正把他们推进这狂风的，从来不是那本书、那一个字，而是他们自己：把爱放纵成了欲，又把这欲奉为不可抗的天命。爱本无罪，罪在它失了节制、没了伦理，只顾燃烧，却不知该朝哪个方向。弗兰切斯卡把那句「爱不容人拒爱」当作挡箭牌，轻轻巧巧地，就把理性和忠信都抛进了风里，自己也成了风中一片落不得地的叶子。","我把这个念头在心里又转了一遍，竟有些后怕。她那一句「爱不容人拒爱」，乍听是情话，细想却是最方便的借口——因为它把一切都怪罪给「爱」，仿佛人只消张开怀抱，便再不必对自己负责。可若真是如此，那这世上岂不是谁都可以凭着一句「情不自禁」，把忠诚、道义，甚至他人的一生，都轻飘飘地打发了？塞米拉米丝、克里奥帕特拉们，不也正是在这样一句话面前，被轻轻推下深渊的么？","我忽然又想到生前的自己——有多少次，我也是这般，用一个动人的理由，为心头那股无名的火寻找开脱？「我只是情不自禁」「我是身不由己」——这些话，听起来多像她那句「爱不容人拒爱」。原来我们都那么擅长替自己编一个无辜的壳，好把欲望裹在里头，还理直气壮。想到这里，我背上竟起了薄薄一层冷汗。","「爱若失了分寸，便会从光明坠入暗影。」维吉尔大人低声说，「它不是让你沉沦，而是让你在正确的方向里燃烧。弗兰切斯卡的错，不是她爱了，而是她把爱圈成一道只容得下自己的墙，把承诺与道义都锁在了墙外。」我点了点头，心里那道仿佛锈住的门，悄然透进一丝光。我再看向那对影子时，便不再只见到一对苦命的恋人，而是见到一面镜子——镜中那场失度的燃烧，正照着我自己也从未照过的地方。","我望着那仍在风暴中不得安宁的影子，轻声问自己：若我生而有爱，我将如何待它？——我要守忠信，要知节制，要让爱成为照亮彼此的光，而不是吞没理智的风。这一念既起，脚下的道路仿佛也跟着稳当了些。我又抬头看了他们一眼，不再只是心酸，而是多了一分清醒的怜惜。"],"choice":{"prompt":"从弗兰切斯卡的命运里，你读出了什么？","options":[{"text":"她与我皆是镜中人，当自省而非自怜","to":"2-7"},{"text":"我只是个旁观者，这与我无干","end":{"kind":"灵魂沉沦","title":"抽身事外的自欺","text":"你定了定神，自以为不过是个路过看客——这桩惨事与你何干？你甚至有些庆幸自己与弗兰切斯卡不是一类人。可就在这份撇清生出的一瞬，风里忽然传来她幽幽的声音：「你方才与我一同落过泪，此刻又想干干净净地走。」你心头一震，低头才发觉，自己腿上早已缠满了方才为之浸湿的绳索——那是你替自己开脱的每一句「与我不相干」。你越是想摆脱，那绳索便缠得越紧。你终于明白，若不肯从别人的罪里照见自己，那罪便要轮到你自己。你被卷入风中，替那句「与我无干」付了代价。"}}]}},{"id":"2-7","title":"离圈之悟","paragraphs":["我们告别那对仍在风中相拥的影子，沿着来路向上回返。风暴的咆哮渐渐被甩在身后，仿佛隔了一层厚厚的、听不见回响的水幕。可那声音并没有真正离去，它只是改由我的记忆来播放。我一面走，一面反复咀嚼维吉尔大人方才那句话：这一圈之所以如此凄烈，是因为「情欲把灵魂的理智之帆撕成了碎片」——人心的帆一旦被撕碎，便只能让风推着走，再也掌不了自己的舵。","「你看那些被卷起的灵魂，」维吉尔大人又说，「他们不是没有过选择，只是不肯动用那一份选择。什么时候人愿意让理性为欲望掌舵，让忠信为爱留一盏灯，风就再也撼不动他。」我望着脚下与头顶那片褪色的幽暗，渐渐明白了：地狱不是惩罚，而是一面毫无保留的镜子——它把你一生放纵、躲闪、自欺的部分，原原本本地照了出来，让你在你生前最不愿面对的地方，面对面地看它一眼，看个清楚。","我停下脚步，临别前又回望了一眼那旋涡。风仍在转，影子仍在其中起落。它们与我之间，仿佛只隔着一步——这一步，是生与死的距离，也是我与那场放纵之间，仅剩的一道堤。我若再退一步，便会与它们同陷；我若迈过去，便能把这一圈的警醒，带出地狱去。我望着那旋涡，仿佛也望见了许多年前那个被一阵风轻易卷走的自己——那时我也以为，那只是身不由己。","「那么，路还长，」我轻声对自己说，「我会记得这一圈。」我要守的，不只是忠与节——而是无论对爱、对欲、对世间任何一样东西，都不再任由它把我卷走。凡有所爱，必守其忠；凡有所求，必知其节。让理性做帆，让德性做锚。那样的话，风再大，也只是把我往前送，而不是把我卷回深渊。","走出风暴边缘的时候，我回头又看了一眼那道旋涡般的黑暗。弗兰切斯卡与保罗仍在其中，仍在风中紧紧相拥。我替他们心酸，却不再替他们流泪。维吉尔大人沿着幽暗的路径向前，微微侧首：「走吧，前面还有更沉的东西等着你。」我应了一声，把这一层的领悟细细收进心底，随着他，向更深、更冷的地方走去。"],"choice":{"prompt":"离开色欲之圈，你要为这一程立下什么？","options":[{"text":"立誓凡爱必守忠与节，理性之帆永不坠","to":"3-1"},{"text":"这故事太长情，我再回味一阵","end":{"kind":"迷途湮灭","title":"沉溺回味的逐浪者","text":"你在风暴边上又停了下来，舍不得。那对影子、那场悲剧、那一句「爱不容人拒爱」，实在是太扣人心弦了。你想再停留一会儿，再替他们心酸一遍。于是你没能跨过那道离开的坎，那记忆便成了一双看不见的手，把你轻轻拉回风中。你本已悟到的道理，被这一转念又消磨殆尽。当你回过神来，自己竟又悬在了那股黑风之上，随那无数影子一同翻滚。原来沉溺不一定只在欲望里——沉溺于一场自以为动人的悲剧，同样能叫人放弃前行。你终于再难分辨，那些泪究竟是为他们，还是为你自己。"}}]}}]},{"chapter":3,"circle":"第三圈 · 暴食（恶臭浊雨之圈）","title":"第三章 · 浊雨 · 暴食","subtitle":"吞下去的欲望，永不餍足","nodes":[{"id":"3-1","title":"地狱三头犬刻耳柏洛斯","paragraphs":["我们顺着石阶往下，风声在耳畔骤然变了调。方才色欲之圈还是狂风卷着飞沙，那风能刮得人睁不开眼；如今却换成了一种黏腻的、沉甸甸的雨，落在人身上黏黏糊糊。脚下的石阶也早没了干爽，覆着一层能陷下脚掌的软泥。我边走边想，这第三圈，怎么连空气都跟别处不一样。雨滴不是清亮的，而是浑浊的、带着腥气的，打在肩甲上像敷了一层化不开的油。天空低低压下来，灰蒙蒙的没有一丝缝隙，仿佛这片天地本身就正往下坠。维吉尔走在前头，脚步却依旧沉稳，只轻声说了句：当心。这里住着贪食的恶兽。","话音未落，雾里便滚来一阵咆哮——那声音有三个头，层层叠叠，粗哑得像开水灌进枯井，又像谁把一口破钟闷进泥里猛敲。黑洞洞的崖壁下，一只庞大的畜生蹲踞着，三颗脑袋从同一副肩胛上探出来，左右两边各一颗，中间一颗稍高，獠牙上滴着黏涎，六只眼睛在暗处泛着浑浊的黄光。它身上没有半点神话里的威严，反倒透出一种庞大的、迟滞的笨重，可那份笨重底下，藏着纯粹到令人心冷的凶暴。那畜生张开嘴，涎水混着雨水淌下，喉咙里滚出咕噜噜的声响，仿佛在说：我饿。填满我。","我们脚步一近，三头犬便俯下身子，六尺来长的身子弓成一张满弦的弓，三两下作势要朝这边扑来。它的六个鼻孔一张一合，呼出的尽是腐烂的腥气，熏得人几欲作呕。我的腿几乎不听使唤，下意识便想往后退。就在这电光火石之间，维吉尔却不退反进。他俯下身，从泥地里抓起一大团黏稠的烂泥，五指一收，回身便将这团污泥稳稳塞进那畜生张着的三张嘴中。三头犬被这突如其来的食物噎住，猛咳两声，那六只眼睛里的凶光竟渐渐涣散，喉咙里的咆哮也化成了含混的呜咽，伏下身去，不再动弹。","维吉尔拍了拍手上的残泥，回头看我，神色平淡：你别把它想得有多厉害。它的本性只有一件，就是无止境地向里吞。你越是往后退，它越觉得你是猎物。他顿了顿，目光落在我身上：记住这畜生——它张开的三张嘴，就是人的欲望。贪吃的人，贪财的人，贪名的人，喂饱他们的从来不是真正到嘴的东西，而是自己心头那一分害怕、一分退让。我望着那只安静下来的三头犬，望着一地的烂泥与浊雨，心里那股寒意，一点一点被别的东西给替代了。"],"choice":{"prompt":"三头犬扑来，你是否被它的凶相吓得停下？","options":[{"text":"我攥紧拳头，跟着维吉尔大步跨过去","to":"3-2"},{"text":"我僵在原地，不敢迈出一步","end":{"kind":"当场死亡","title":"被恶犬吞没的贪者","text":"你被那六只浑浊的眼睛钉住了，脚底像渗进烂泥，一寸也挪不动。三头犬扑上来时，涎水混着污泥糊了你满脸，三张嘴同时咬下——你只觉得身子一轻，便被整个吞进了那滚烫的肚腹里。四周黑得没有一丝光，你听见自己的骨头在它胃里被榨出声响，而更可怕的是那畜生含混的呜咽：它还在饿，还在找，仿佛把你吞下去不过是开了个胃。你这一生吞下了多少，此刻便以这具肉身偿还多少；泥与雨在你头顶合拢，你永远留在了它咽不下的那一口饥饿里。"}}]}},{"id":"3-2","title":"贪食者的沼泽","paragraphs":["越过那只昏睡的三头犬，眼前豁然展开一片无边无际的泥沼。先是脚下的地皮一软，人便陷进去半寸；再往前走，那股气味便浓得躲不开了。浊雨倾盆而下，却不是清凉的，而是黑沉沉、油腻腻的，落在人身上像烧化的松脂。地面冒出咕嘟咕嘟的气泡，升起的不是水汽，而是股股腐烂的甜腥味——那是酒与肉放坏了的气味，混着人身上散出的热气，捂住口鼻也挡不住。泥沼里横七竖八躺着许多人，他们不是站着，也不是坐着，而是永远地、趴伏般瘫倒在烂泥里，任雨水一遍又一遍地打在背上、头上。","维吉尔领着我踏着一块块勉强露出水面的土墩往前走。我这才看清，那些躺倒的并不是枯骨，而是人——他们肚子高高鼓起，像被什么东西从里面撑满、撑到走形了；面孔浮肿，眼皮半阖，嘴唇一张一合，发出含混不清的呻吟。饿……一阵声音掠过水面。我饿……永远吃不饱……那些喉咙里的字句被雨冲得零零碎碎，却一遍又一遍地重复，仿佛他们还在一场永远不会散席的宴会上，举着空杯，对着空盘，迟迟不肯离席。有的还在泥里扒拉着什么，扒拉出来的却只有浸了水的烂草。","我认出了其中的一些面孔。那是城里那些阔绰的食客——每逢宴会便坐在首席，把烤天鹅、蜜炙乳猪一样样往嘴里送，末了还要拿牙签挑剔一番的；那是集市上贪嘴的摊主，把整筐的果子一颗颗抹进嘴里的；还有那些佛罗伦萨的体面人，他们用一席宴请来兑换一桩生意，用一张长桌来丈量一个人的分量。如今他们全都在这里，瘫成一滩，淹没在名为嘴的欲望里。他们的身体被撑得变了形，可他们的眼睛，还对着空无一物的前方，扒拉、吞咽，扒拉、吞咽，仿佛只要再咽一口，那口填不满的肚子便会满足。","不知怎的，我竟有些替他们难过，喉头动了动，差点就要蹲下身去。维吉尔回头望我，像是看穿了我的心思，轻轻摇头：你不该可怜他们的病，也不该忘了他们的病。一个人若把一生的力气都用在往嘴里塞上，到头来，他嘴里剩下的就只有永远填不满的那份空。他望着那一片起伏的泥沼，声音放低了些：他们现在的样子，不过是他们活着时早就替自己选定的模样。你看那口肚子，你喂它多少，它都嫌少；你若把心也喂它，便连人都不剩了。我收了收迈出去的脚，把那些涌上来的同情，又压回了心底。"],"choice":{"prompt":"看见这些糜烂的身影，你是否生出心软的同情？","options":[{"text":"我压下同情，提醒自己这是罪罚应得","to":"3-3"},{"text":"我蹲下身，想扶起其中一个","end":{"kind":"灵魂沉沦","title":"沉入泥沼的饕客","text":"你蹲下身，想替其中一个撑起浸在泥里的头。你的手刚一触到他温热的胸口，那泥沼竟像活了似的，一圈圈缠上你的手臂、腰、颈。你这才发现，自己早已分不清那团烂泥是敌人还是同伴——你尝到一股甜腻的味道自舌尖漫开，那是烈酒、蜂蜜、烤肉混杂的滋味，你忍不住吞咽了一口，又一口。泥慢慢没过你的下巴，你还在吞咽，还在吞咽，永远无法停下，也永远吃不到满足的那一口。"}}]}},{"id":"3-3","title":"故人恰寇","paragraphs":["我正俯身望着那些瘫倒的饕客，一个声音忽然从泥沼里冒了出来，沙哑又熟稔，像隔着一层水波传来：喂……是你吗？托斯卡纳人？你也来这泥里看清自己了？我蓦然回头循声望去，只见一个身影吃力地抬起半个头，就着浊雨辨认我。那身形浮肿，脸肿得不成样子，猪样的面颊沉甸甸垂着，眼皮厚得几乎遮住瞳仁——但我还是认出了他。我怕认错了，压低声音问：是你吗？恰寇？他像是等这句话等久了，费力地点了点头。","他是我的同乡，也是这座城里一个出了名的饕客。活着时，他常坐在酒馆最好的位置，面前永远垒着几层碟子，谈笑之间把一盘盘收拾干净，末了还要咂咂嘴，嫌这顿的鱼不够新鲜。他认得我，我也记得他那副吃相。如今他却陷在齐腰深的烂泥里，雨水顺着他的下巴滴落，张口满是腥气，只勉强挤出一句：是我。我在这泥里泡了这么久，就等一个能说上话的人。他咳嗽几声，眼珠浑浊地望着我，像要把什么话从肺腑里一并喷出来。","打听打听佛罗伦萨吧。恰寇忽然说，声音里带着一种活在泥里也熄灭不了的热切。那座城，如今怎么样了？我一愣，正要开口，他又自顾自地说了下去，仿佛这些话在肚子里憋得太久、太满了：不用你答，我也知道。那座城啊，就要翻了。他喘着气，党争、贪婪，谁也不肯让谁一步——上头那些人一个比一个贪，把公家的钱、百姓的粮，全都往自己肚里填。他边说边把身子往水面探，像是怕我听不清。你放心，它不会一直太平下去的，罪，总有一天要清算。","他说得激动，身子在泥里打起颤来，脸上竟浮起一丝近乎得意的神情，仿佛这座城的坍塌，正是他咽气前最后盼到的一场热闹。我一时也被他说得入了神，满脑子只剩下：谁是白党，谁是黑党，谁会赢，谁要倒——那些城里人嚼烂了的闲话。我几乎忘了，自己正站在一块比他们更清醒的土墩上，忘了我来这里是学着看清一件事，而不是来打听一则八卦。维吉尔在一旁静静望着，没有开口，只是那眼神，像一面又冷又亮的镜子，把我那副凑近了打听热闹的模样，照得一清二楚。我下意识往后缩了缩，这才惊觉，原来自己在不知不觉间，也把别人的灾难，当成了下饭的一碟小菜。"],"choice":{"prompt":"听到佛罗伦萨将倾，你是否只顾起劲地打听政治？","options":[{"text":"我克制撩起的兴趣，望向这个沉沦的灵魂","to":"3-4"},{"text":"我蹲下身，追着恰寇一句句追问党争","end":{"kind":"灵魂沉沦","title":"沦为八卦的饕客","text":"你蹲下身子，追着恰寇一句句问：谁主事，谁下台，哪家的钱袋更鼓。你越问越起劲，几乎忘了脚下是泥，也忘了头顶正在下雨。恰寇的眼里闪过一丝悲悯，忽然伸出一只肿大的手，抓住你的腕子，轻轻一拽——你半个身子便陷进了烂泥。你挣扎，却发现你吞下去的每一句揣测，都化成一口黏稠的浊水灌进喉咙。你这才明白，你把别人的罪恶当消遣的功夫，自己也早已沉进同样一个填不满的坑里。你抬起头，雨还在下，再也没有一个人愿意回答你。"}}]}},{"id":"3-4","title":"政治的预言","paragraphs":["我心里那团关于党派的火被勾了起来，正想再追问，恰寇却顺着自己的话头说了下去，像是替我把城里的底细摊开在雨里。他掰着指头，一桩一桩地数：那三家顶着佛罗伦萨名头的门派，如何轮番把持着市政，如何把一场选举变成一桌分赃的宴席，赢家拿走肉，输家连骨头都不剩。他越说越快，语气里那股看客的热闹劲也越来越足。你以为那是治国？他发出一声含混的嗤笑。那是只长了嘴、没长心的畜生，围着同一口食槽抢食罢了。","上头那些人，一个比一个奢靡。恰寇把身子往泥里沉了沉，像是要把这番话也一并压进泥底。长袍要用金线，房屋要高过塔楼，一顿饭要摆半个城的菜。可他们从没想过，这些都不是树上摘的、地里长的，都是底下人的血汗。他喘了口气，声调沉下来：奢靡这东西，像个无底的食槽，喂得越满，它越是往下沉，总有一天要把整座城一起拖进泥里。你说他们吃的是饭吗？他们吃的是别人省下来、供上来的日子。他说完这几句，仿佛用尽了力气，额上沁出冷汗，雨水一冲便散了。","我听着，心里却渐渐被一股怒气填满，捏紧了拳头，恨不能替那座城里的百姓，朝那些政客脸上啐一口。我忍不住问：那好人呢？这座城里，难道一个好人都没有？恰寇抬起肿胀的眼皮，浑浊的目光里有了一点亮，又随即暗下去。他哑声道：有一两个吧。可这城里的风俗，把好人与好人隔开了——他们心里都有一杆尺，却没人敢先伸出手，怕自己一朝先倒了，就成了别人的盘中餐。他说着，身子缓缓往泥里滑，声音越来越低。","末了，恰寇又抬起一只湿漉漉的手，朝我这边的方向虚虚一抓，像是要抓住什么在他身后早已消失的东西：若你回去，替我向那些还站着的人说一声——别再抢那口食槽了。若不回头，地上有多少奢靡，地下就有多少泥。话音落下，他的眼终于阖上，整个人像一截浸透的木桩，慢慢、慢慢沉入浊雨与烂泥之中，再也看不到一点踪迹。我站在原地，那团怒气还堵在胸口，却不知该往何处去了。我原以为，骂尽了贪婪的人，自己便算是清醒的那一个；可恰寇一声一声数着的，分明也有一份我从不曾细想的共罪。那团火，烧得我发烫，却也照得我发慌——我怕我再骂下去，从嘴里喷出来的，就不是公道，而是我自己的不甘了。"],"choice":{"prompt":"听到预言，你是否把满腔怒火只对准政客？","options":[{"text":"我闭眼深吸一口气，把怒火转向自省","to":"3-5"},{"text":"我把怒火一股脑倾到政客头上","end":{"kind":"灵魂沉沦","title":"怒火反噬的评说","text":"你把怒火悉数倾到那些政客头上，越骂越解气，仿佛只需骂尽他们，你自己便干净了。可你脚下那滩烂泥不知何时已没上鞋面，你顺手揪住身旁一株枯草想稳住身子，那草却一扯便断了——你跌坐下去，溅起的浊水灌进衣领。你忽然意识到，那些你骂得最狠的贪婪，此刻正顺着你的话头，一点点沉淀进你自己心里。你抬头，恰寇早已沉没，没有人再替你指路。雨把你这点自以为是的清白冲得干干净净，只留下你，和那口共同填不满的食槽。"}}]}},{"id":"3-5","title":"暴食的根源","paragraphs":["恰寇沉入泥沼后，四下一时安静下来，只有雨还在下。我站在原地，心里那团火并未熄灭，却多了个之前没有的念头，像一粒种子，被这阵浊雨淋着，悄悄发了芽。我转向维吉尔，问出那个在我喉头萦绕许久的问题：老师，贪吃与贪婪——它们不是一回事吧？一个是嘴上一时的馋，一个是一生的算计，为何都堕进这泥里？我原以为他会笑我糊涂，可他没有。","维吉尔没有立即答话。他望着那片烂泥，沉默良久，才缓缓开口：你以为它们不同，是因为你给它们起了不同的名字。可你要是拨开那层皮，就看得见它们底下是同一样东西。他抬起手，指着一具仍在咕哝吃不饱的身影。贪吃的人，是食欲失了度；贪婪的人，是物欲失了度。一个用碗，一个用钱袋，可里头装的是同一个字——欲。他顿了顿，声音更沉了些：欲本身不是罪。罪在它越过了够这个字。","你看这泥里的人。维吉尔的声音沉沉地落下来。他们在活着时，何尝不是好端端的人？可他们把口腹当成了唯一的目的，吃进多少也觉得不够，从没有一刻停下来想一想：这一口，是活下去的养料，还是填不满的坑？他叹了一声。一个人若把得到当成了目的，把享用当成了报答，他便再学不会感恩——他只会一直张嘴，永远嫌这世界亏欠了他。说到这里，他忽然停住，目光落在我身上。你听，他们到现在还在嚷着饿。他们不是饿，是忘了什么是饱。","我听着，忽然觉得背脊一阵发凉。维吉尔那句越过了够这个字，像一枚钉子，不偏不倚地钉进我心里。我隐隐想起自己那些享乐的念头：那顿可以多要一碟的酒宴，那件一眼相中便非买不可的衣，那对偶有应酬时便想摆出的排场。我不也常常在够了之后，还伸手去够那份再多一点吗？我低头望着自己的手，心里那粒刚刚发芽的念头，忽然长成了一株不敢直视的东西。我沉默良久，终于把那句一直想绕开的话，对着自己说了出来：原来那些我所以为的、无伤大雅的一点贪，和这一地烂泥，本就是同一根藤上结出来的果，只是我这一头，还没烂得那么显眼罢了。"],"choice":{"prompt":"明悟同源，你是否也低头审视自身对享乐的贪？","options":[{"text":"我沉默良久，正视起自己心里那点贪","to":"3-6"},{"text":"我心想这点小享乐哪至于成罪","end":{"kind":"灵魂沉沦","title":"放不下的那一口","text":"你心里那个念头冒出来：我这点小享乐，哪至于就成罪了？于是你理直气壮地把目光从自己身上移开，只当维吉尔是在说别人。可正是这股我不是的侥幸，成了踏进泥里的第一步。你忽然觉得喉咙发干，舌尖泛起一股熟悉的甜腻——仿佛一桌不该有的宴席正在面前摆开，你忍不住伸出手去。等回过神，半条腿已经陷进了烂泥。你这才发现，你最放不下的，不是眼前的食物，而是那句永远也说不出口的够了。你往后仰倒，再也站不起来。"}}]}},{"id":"3-6","title":"一颗麦粒的教训","paragraphs":["我望着这片泥沼出神，很久没有开口。维吉尔也不催我，只站在一旁，由着雨水顺着斗篷的边沿一滴滴落下来，落进脚下的泥。我忽然想起一件事——小时候祖母常对我说的一句话：人是要吃饭的，可人不是为了吃饭才活着的。那时我不懂，只觉得是老人家的唠叨，听过便忘。可此刻，站在这满地撑饱的人中间，这句话忽然变得又重又亮，像一颗沉在深水里的石子，突然浮到了眼前。","老师。我开口，声音有些发涩。人若把这具身子当成了唯一的去处，把吃、穿、住、用都当成活着的全部……那他和这泥里的人，还有什么分别？维吉尔点了点头，眼中露出一丝赞许：你问到根上了。他抬手指向泥沼。你看他们——他们不是死在这泥里，是活着的时候，就已经把自己活成了这副模样。把身体当作目的，便与那只见了食物就往里吞的畜生，没有两样了。他收起手：人之所以为人，是因为人除了这具身子，还有别的东西要安放。","食，是为了养这具身子，好让它能承载灵魂，走完这一程。维吉尔的声音温和却笃定。可你若反过来，让这具身子来奴役你，为了它去算计、去争抢、去堆满一辈子也用不完的东西——那就是把主与客颠倒了。他顿了顿，道：麦粒落到土里，是要长出更多麦粒，反哺人的；人吃了麦粒，是要靠这份力气去行善、去求知、去爱人的。若光进不出，光吞不做，那一颗麦粒在你肚子里，便只化作一堆腐物，再多，也填不出一分人生的重量。","我心头一凛，目光便不自觉地投向泥沼深处那些肿胀的身影。我忽然发现，他们与生前那座金碧辉煌的奢靡之都，竟重合在了一起——城里的每座高塔，每张长桌，每件金线长袍，都是这群人一点一点堆出来的；他们把世间的丰足都搬进自己肚里，却忘了自己为何要活。我望着自己的手，回想起那些为了一口奢侈而耗费的银钱与心血，心里竟浮起一股说不清的惭愧。我暗暗问自己：那一口，我到底是为了活，还是为了那一口？若把吃、穿、住、用都当成丈量自己的尺子，那把尺子量出来的，怕是只剩一具被喂肥了的空壳，而那个本该站在这具壳里的、会爱会怜悯的人，早就被挤到角落里去。我站在原地，任雨点把那些念头一点点浇醒，心里那根弦，被拨得又紧又清。"],"choice":{"prompt":"你是否愿意改一改自己衣食起居的奢？","options":[{"text":"我深吸一口气，在心里许下收敛的承诺","to":"3-7"},{"text":"我心想这点排场正配得上我的身份","end":{"kind":"灵魂沉沦","title":"自欺的奢靡","text":"你心里默默找着理由：我这点排场，正配得上我的身份；我要是不讲究，反倒失了体面。你把这些话说给自己听，说得很顺，仿佛天经地义。可恰在此时，泥沼中一只手忽然捞住了你的脚踝——那是早已沉没的恰寇，他肿大的面容从泥里浮起，冲你哑声一笑：体面？那都是我当年咽下去的借口。你一时语塞，那只手却轻轻一带，你整个人便顺着泥滑了下去。你这才明白，你把奢当成体面的那一刻，就已经和这群人一样，把身体供成了自己的神。雨声渐远，你再也说不出一句辩解。"}}]}},{"id":"3-7","title":"离圈之悟","paragraphs":["我们穿过那片恶臭的泥沼，一步一步向远去。浊雨渐渐稀疏，脚下的烂泥也慢慢变硬，踩上去终于能站稳些了；空气中那股腐烂的甜腥味，也一点一点淡了下去，取而代之的是一种清冷的、干净的凉意，像有人揭开了压在胸口的一口大锅。我回头望了一眼身后那圈被雨雾吞没的沼泽，心里没能马上松快起来——恰寇那句话，还有我自己许下的那个念头，都还压在胸口，沉甸甸的，一时半会儿散不掉。可那阵清冷的凉意拂过面颊时，我又觉出几分说不清的轻松，仿佛背了许久的重物，终于被卸下来一小角。","维吉尔走在我身边，似乎察觉到了我的心绪，放慢了脚步。他没有回头，只像自言自语般说道：你要记住今天的路。世上真正难走的，从来不是脚下这一段泥，而是你心里那口填不满的坑。他顿了顿，语气里多了一点少见的温和：美德这东西，并不在禁绝，也不在放纵。禁绝了，人便枯槁；放纵了，人便沦为一头吃饱就算的畜生。美德，就在于把欲望放在中道——食是养，享是敬，够则止，多则损。他笑了一下：这一点，你比那一圈的人都早懂了。","你看那头三头犬。维吉尔又说。它生来只剩一个念头，就是往里吞，所以它只能做一只守门的畜生，守着别人，也守着自己那一口吃不完的饥饿。而人生来有手、有心，有去爱、去创造、去怜悯的本领——你若把这些都熄了，退回到只知吞咽的地步，那这副灵魂，便白来了这一世。他望着渐渐散开的雨幕，声音像被这凉风洗过一般清亮：你这一路，不是来数别人的罪的，是来把自己心里那点脏，一点一点擦干净的。","我们越走越远，头顶那片灰压压的雨云，终于裂开一道缝，漏下一点冷白的天光。我忽然觉得呼吸畅快了许多，先前那些关于威风的奢、关于体面的排场，都像被这阵凉风洗过了一样。我在心里默默立下一个誓：往后这一生，凡入口的、上身的、占下的，我都要先问自己一句——这是养，还是欲？若只是欲，我便收回手去。维吉尔像是听见了我心底的话，微微勾了勾嘴角：走吧，前面的路还长。你既然放下了这点贪，便继续往下走。下一圈，还有别的东西，在等着你认清自己。"],"choice":{"prompt":"立誓涤除暴食之罪，你是否随维吉尔继续前行？","options":[{"text":"我重整心志，迈步走向下一圈","to":"4-1"},{"text":"我回身，想再放纵最后一口","end":{"kind":"灵魂沉沦","title":"回身再贪一口","text":"你望着身后那团正慢慢合拢的烂泥，心里涌起一个念头：就再放纵一次吧，出了这个圈，再改也来得及。你回过身，朝那团还在冒泡的浊雨走去。可这一步踏出，泥沼像是早就等着你，一下子没到你的腰际。你这才发现，所谓再一回的侥幸，从来都是欲望留给人的第一个坑。你越是往回走，那口填不满的坑越是张得大，直至彻底把你吞没。天光在你头顶合拢，雨重新哗哗落下，你再也找不到那条通往下方的路了。"}}]}}]},{"chapter":4,"circle":"第四、五圈 · 贪婪与愤怒（厉河与冥河）","title":"第四章 · 巨石 · 污泥","subtitle":"钱把灵魂压碎，怒把灵魂淹没","nodes":[{"id":"4-1","title":"财神普鲁托","paragraphs":["踏入第四圈的入口，脚下的坡道愈发陡峭，空气里浮动着一股金属与尘土的腥气，仿佛整座地狱都在为金子涌动。我抬眼望去，岩壁的阴影里蹲踞着一个庞大的身影——那是贪婪之神普鲁托，狼的面孔、臃肿的躯壳，喉咙里滚着含混不清的兽语。他稍稍一动，便带起铁器与硬币相碰的脆响，像无数银钱在看不见的暗处流转、攒聚，又被谁死死攥在指缝间，怎么也松不开。那声响顺着岩壁渗出来，一根一根，钻进耳朵里，仿佛在数着人心里到底还藏着多少舍不得放下的数目。","那只「兽」像是在吼出某种神谕一般的话语，粗哑又混沌，一半是古老的咒骂，一半直指我这个还活着的人。他在向我展示人间那些被金银压弯的脊梁，展示我记忆里见惯的世相：为钱妻离子散，为钱昧了本心，为钱连来世也一并典当。他的词句在洞窟之间来回碰撞，又碎成更细的声响，仿佛每一句都在劝我沉下去，劝我相信这世间的道理到头来不过是聚与散、多与少，其余皆是虚妄。那低语盘旋着，不肯散去，像是在等我先软了心、先动了念。","我握着剑柄的手微微发汗。这低语虽在肉身之外，却一口咬在心上，它要我惧怕它，要我相信它所掌管的才是世界的真相。我太清楚这道门槛落在何处了：只要我迟疑一刻、回望一眼，那条向下的路便会被这贪婪的阴影拦腰截断。贪念从不在某一枚金币上，而在人被它牵着走的那个瞬间——我若在此回头，便等于向它认了输，也等于把前面看过的那些罪与罚，都轻轻放过了。于是我只把脚底钉稳，不去应它那句话。","「住口！」维吉尔的声音如惊雷炸开。他上前一步，厉声喝退那匍匐的恶魔：「这不是你能扰乱的路。走开，让我与我的门徒在冥途上通行。」又斥道：「别想用你在人间也教人一败涂地的钱财，吓唬一个比你更清醒的灵魂。」那庞然身影在呵斥中嗫嚅着退下，撑起兽翼遁入黑暗。我心头一阵发木，才发觉方才竟真被那关于金银的话语攫住了一瞬——贪这念头，从来不在金银本身，而在甘心被它牵引着走的那颗心。此念一提，我不禁在胸口悄悄记下这一笔，好叫自己在更深处不忘了它。","维吉尔重新走回我身旁，并不急着催我，只静静道：「你方才听见那兽语底下，到底在怕什么？无非是怕想起，自己手里也攥着一样放不下的东西。」我沉默着低头，指尖拂过腰间的剑柄。方才还让我心头一紧的低语，此刻被他一言点破，竟变作一面镜子——我原以为我惧的是这恶魔，惧的却是那个在心底默默计较过一处的自己。我深吸一口气，朝他点了点头，抬脚追上了他的步伐。"],"choice":{"prompt":"面对普鲁托的兽语低语，你选择——？","options":[{"text":"握紧佩剑，跟随维吉尔向前。","to":"4-2"},{"text":"停步细听，那关于金银的低语。","end":{"kind":"灵魂沉沦","title":"被金币的兽语吞没","text":"你循着那道低语停下，任由关于金子的想象在心头蔓延。起初只是听，随即是看，再后来你伸出手，仿佛要握住那本不属于你的财富。普鲁托的兽语越发稠密，将你层层裹缠。等维吉尔回头寻你时，你已和他之间隔着一整片腐臭的矿脉——你被贪念牵引着，永远留在了第四圈的迷雾里，连同你一生的渴望，都成了别人脚下冰冷的金属。"}}]}},{"id":"4-2","title":"推石的两队","paragraphs":["绕过普鲁托，眼前豁然展开一片巨大的环形洼地。洼地里排着两列绵长的灵魂，正呼号着、咬着牙，把沉重的巨石朝彼此滚去——那一头是贪婪者，这一头是挥霍者，两列人各自抱着石头，向正中相向而行。石头压在肩头，把他们的脊背压成一道弯弧；他们的脚深陷在灰白的尘土里，每一步都像从地底拔出沉重的根。那尘土扬起又落下，混着他们嘶哑的喘息，把整片洼地熏成一片灰蒙蒙的沼泽。","当两队在最窄处相撞，便有咒骂声轰然炸开：「你们为何拼命攒着不放！」「你们为何挥霍得这样凶！」他们一面骂，一面推着巨石从对方身侧错身挤过，然后掉转头，把石头重新推回起点，再重新相向而行。没有尽头，也没有歇息，只有石头压弯的脊背和永不会停的一步。那相互的呵斥听久了，竟像是一场永远吵不出结果的争辩——两边都指着对方的错，却谁也没看见自己手里那块石头。","「他们把钱财抓得太紧，或是挥霍得太狠。」维吉尔在我身侧低声道，「这两样本是一体两面——惜财如命与败家如流，都离「中道」一样远。他们生前各执一端，死后便被这罪罚逼着，向着彼此永远跋涉；既不真正抵达，也不真正离开，只在两种极端之间来回耗尽自己。」他顿了顿，「你看那石头，就是他们拿不动的念头本身。他们一生都在跟钱财较劲，死后便连命都化作这搬不动的分量。」","我看着那群被石头驱赶的灵魂，心底渐渐浮起一层凉意。他们并非什么穷凶极恶之徒——不过是世人口中的「会过日子的人」与「败家子」，一个攥得太紧，一个散得太快，偏偏都忘了钱财只是手中之物，而非心上之主。这推不完的石头，仿若把自己的一生都压进了那一声声「为何」的质问里；守住与撒手若都失了分寸，原来同样会把灵魂磨成灰。想到这里，我不禁低头看了看自己的手，险些也替一个数目发过急。","我站着看了许久，忽然明白这推石的罪罚，其实并不陌生。人这一生，谁没在「攒」与「花」之间摇摆过？只是有人把攒当成了命，有人把花当成了乐，说到底，都是把钱看得比自己重了。维吉尔没有多言，只领着我绕开那两列蹒跚的身影。我在心里替他们记下一声叹息，也顺便替自己那点险些就要计较的念头，轻轻松了绑——原来摆得正的，从来不是钱的多少，而是藏在钱背后的那一颗心。"],"choice":{"prompt":"看着他们永远推不完的石，你心中——？","options":[{"text":"想起美德在中道，为他们叹息。","to":"4-3"},{"text":"暗自解气，笑他们咎由自取。","end":{"kind":"灵魂沉沦","title":"同被巨石碾碎","text":"你那声嗤笑还未落地，身前尘雾骤起。一队阴魂撞回头来，错把你也当作同类，巨石循着旧路撞向你的方向。你欲躲已迟——庞大而沉重的石头碾过你的胸口，把你和那些贪婪、挥霍的身影一同压进尘土。你直到被碾碎才明白：嘲笑他人的沉沦，会把你也拖进同一道泥淖，因为你同样没有站在中道的岸上。"}}]}},{"id":"4-3","title":"运气的转轮","paragraphs":["沿着洼地的边缘前行，我忍不住回头再看那一列列推石的灵魂。维吉尔放缓了脚步，仿佛洞悉了我心头的疑惑，缓缓开了口：「你以为他们只是爱钱？不，是求财的贪欲，把灵魂变成了金钱的奴隶。钱财本是要人来使唤的东西，可他们把一生都交给了它，于是轮到钱财来使唤他们。」他说着，目光落到那一队队压弯的脊背上，声音里没有嘲讽，只有一种近乎怜悯的平静。","「人在人间总以为，攒得越厚就越安稳。」他轻轻摇头，「可世间的钱财，本性就无常。今日在你手里的，明日便流向别人；今日借你发家的，明日也能把你吞没。你若把它当作绝对可靠的依靠，就成了它的囚徒——这正是第四圈的人在永恒里学不会的事。」他的声音不高，却像在水面荡开的一圈圈涟漪，一字一句都不是虚言，听得我心头那点「多攒些便无虞」的旧念，也跟着晃了晃。","「你看那转轮。」他抬手指向远处的虚空。我顺着他所指望去，仿佛看见一座巨大的「命运的转轮」，在无边的暗色里无声旋转。有人被轮缘高高托起，有人又随轮沉入低处；没有谁永远立在顶峰，也没有谁被永远压在谷底。转轮不停，便是钱财与运数真正的模样——你所凭恃的，随时可能被轮到别处去。看着那不急不缓旋转的轮影，我竟生出一种说不清的怅然，仿佛一生斤斤计较的得失，都被这轮影轻轻化去了。","「求财致贫，炫富招损。」维吉尔看着我，「真正的『中道』，不是一味攥紧，也不是一味挥霍，而是让钱财替你所用，却不替你作主。你把它当工具，它便服侍你；你把它当主人，它便把你也变成石下之人。」他这一问，像一根针，准确地扎进我一直没敢细看的念头里。我沉默了许久，才在心里承认：确有那么一个数字，曾被我当成了底牌，无论我怎么在嘴上说淡然，心里却早已被那个数目攥得死死的。","我望着那无声旋转的轮影，良久没有说话。原来钱财从来不是秤，它只是被风吹来吹去的沙，谁要是把它当成重量去压，压垮的只会是自己。维吉尔走在我前头，那道紫袍在暗色里一晃一晃，像是替我开出一条不贪不纵的路。我悄悄把那当作底牌的数目，从心里卸下，改放到它本该在的位置——好叫它从此只替我办事，而不是替我作主。这上头的一进一退，原是我最该修的那门功课。"],"choice":{"prompt":"听到「命运之轮」的言说，你有所悟，却仍——？","options":[{"text":"坦承自己也曾贪求钱财，愿学着放下。","to":"4-4"},{"text":"心想转轮无常，不如学着挥霍自保。","end":{"kind":"灵魂沉沦","title":"被虚荣的挥霍吞没","text":"你悟得钱财无常，却用错了解法。既然高墙终会倾颓，金库终会散尽，你索性学着挥霍，把散尽之日提前。你张开手，任浮华与虚荣灌满生命，以为这样就不必再怕失去。可你很快发现，挥霍与吝啬原是同一张转轮的两面——你最怕留不住，反而比谁都更不知节制地把它推得更远。最后你像第四圈下的阴魂一样，成日追逐着抓不住的幻影，把一生都当成了燃烧的柴薪。"}}]}},{"id":"4-4","title":"斯提克斯冥河","paragraphs":["第四圈的坡道终于到头，脚下却骤然一沉。眼前没有地，只有一片巨大的黑色沼泽在前方铺展开来——那是第五圈的斯提克斯冥河。腐臭的气息扑面而至，浓得仿佛连呼吸都黏在了喉咙里。岸边的泥是黑的，水是黑的，连从水面上浮起的气泡都带着一股陈年的腥苦，让人浑身的皮肤都不由得绷紧。我下意识屏住呼吸，却又不得不换气，那气味便趁隙钻进肺里，堵得人几乎作呕。","泥沼之上，正是一片惨烈的喧嚣。无数半裸的灵魂在黑水面上相互撕打，用拳、用头、用牙咬住对方，把怒火化作实实在在的冲撞与撞击；溅起的不是清水，而是冒着黑泡的烂泥。他们怒吼着，谁也不肯松手，仿佛唯一能证明自己还「在」的，便是把恨砸向另一个同样被恨困住的灵魂。那断断续续的嘶喊，混着泥水的声响，听久了叫人头皮发麻，也让人不由得退后半步，生怕这股怒气无端溅到自己身上。","而在泥沼更深处，那些溺在水里、只露出半张脸的人，却发不出任何声音。他们只能在喉咙里、在水面下咕嘟嘟地吐着一串气泡，那气泡仿佛他们咽了半生的怨气，如今连开口争辩的力气都耗尽了——既上不了岸，也沉不到底，被自己那口闷气永远堵在浑浊的泥里。吵闹的与沉默的，原是同一圈魂灵，却分隔在这片沼与水之间，谁也不曾解脱。看着那无声冒出又无声破掉的气泡，我竟一时说不出这二者哪一个更苦。","眼前的混乱与死寂同时涌来，我的心咚咚直跳。这暴怒的嘶喊与那无声的怒意，一样让我浑身发冷。维吉尔并不催我，只站在我身侧，等我先在这片泥沼前站稳了脚跟。我低头看了看脚下的软泥，知道一步踏错，便会连自己也沉进这永不平静的黑水里。此前在第四圈学到的「节制」，在这里却还远远不够——因为这里拷问的是人内心那团烧不完的火，以及偏偏不肯说出口的那口闷气。","维吉尔停下脚步，等我缓过那一阵心惊，才道：「怒与水、火一样，本是中性的；只是人一任它烧起来，便连自己的分量也烧没了。」我望着那一片沸腾的黑沼，忽然明白斯提克斯真正困住的，不是那些彼此撕咬的手，而是那颗不肯让怒气冷却、也不肯让郁结化开的心。我攥紧衣袖定了定神，把目光从那些缠斗的身影上移开，望向泥沼尽头那条朦胧的岸——那里通往我该去的地方。"],"choice":{"prompt":"望着沸腾的黑色泥沼，你的脚步——？","options":[{"text":"攥紧维吉尔的衣袖，仍迈步向前。","to":"4-5"},{"text":"被这混乱震慑，想要转身逃回。","end":{"kind":"灵魂沉沦","title":"被愤怒的泥沼拖入","text":"你被那癫狂的撕打吓得退了一步，脚下却是烂泥。黑色的沼泽仿佛早就等着你，立刻浸没你的小腿。你挣扎，那些浮在水面的阴魂却把你当作新来的敌人，扑上来撕扯、推搡，直到你再也无力浮起。你和那些把怒烧尽的人一起沉进斯提克斯——你本恐惧他们的暴怒，结果恐惧本身也成了一种怒，把你一起拖入永无宁日的沼泽深处。"}}]}},{"id":"4-5","title":"愤怒与愤懑","paragraphs":["我们贴着斯提克斯的泥岸缓缓前行，尽量避开那些厮杀的中心。维吉尔望着一处又一处的撕打，终于开口：「你看这圈里的，其实是两种『怒』。」我屏住呼吸，知道他又要为我剖开一层原来不曾看清的东西——这地狱里的每一圈，从来不是表面看起来那么简单。前一刻我还在为那嘶喊的心惊，如今一句「两种怒」，便把我方才那点浅薄的观感，轻轻掀了开来。","「一种，是面上发得出来的暴怒。」他指向水面上那些彼此撕咬、以头相撞的灵魂，「他们一有火气便发作，用拳、用口、用恨去砸向别人；烧尽了自己，也烧伤了身边的每一个人。他们的怒是明火，人人看得见、躲得开，却也躲不掉被灼伤的命运。」他微微一顿，「可这怒，至少还肯『发』出来——它露在明面上，旁人还能避，还能劝。」","「另一种，却在这水底。」维吉尔放低了声音，「他们把怒气吞进肚里，从不开口，从不发作，只把满腹的怨与委屈压在心底，年深日久，熬成一潭死水。那就是『郁怒』，人们常说的『愤懑』。他们既不争吵，也从不放下——以为不开口便是忍了、赢了，其实只是把火咽下去，任它在心里慢慢熬成黑疹，最后连自己也沉进这泥里。」他说着，目光落向那些只露半张脸、默默吐着气泡的身影，久久没有移开。","「所以你瞧，同是发怒，明火与暗火同是不平；一个烧向别人，一个烧向自己。两种怒，离『理性的中道』都一样远，一个也不比另一个高贵。」维吉尔说完，静静看向我，「你口中从不责备那些动怒的人么？你心里，可也有从未说出口、也从未消化的郁结？」他一言点破，我竟一时答不上话来，只觉得那股被我当作「修养」攥住的闷气，隐隐在胸口泛起了酸。原来我把「不发火」当成美德，却从没肯正视那口咽下去的气。","我低下头，久久没有作声。原来这些年我自诩的好脾气，多半只是把火压进肚子里，等到无人处，才让它一丝一丝地烧。维吉尔并不逼我回答，只领着我先前走去。可我知道，那一口被称作「修养」的闷气，已经悄悄在我心底泛了酸——它若不化，迟早也会把我拖成水底那一个沉默的影子。发得出来的怒要修，咽得下去的气更要修，修到最后，无非是要把那颗心摆回正当处。"],"choice":{"prompt":"听维吉尔剖析两种怒，你心里——？","options":[{"text":"省察自己也有藏在心底的郁结。","to":"4-6"},{"text":"心安理得地想，我至少从不打人。","end":{"kind":"灵魂沉沦","title":"郁怒沉入泥底","text":"你松了口气，庆幸自己从未动手伤人。可就在这一瞬，你听见水底传来更幽深的声响——那些把怨气吞进肚里、一声不发的人，正从喉咙里冒出苦涩的气泡。你忽然辨认出，那气泡的节奏竟与自己某回咽下的愤懑一模一样。你越是辩称「我从不发火」，那口没咽下的气就越是郁结，最后把你的沉默也变成一片黑疹，缓缓沉入你从未正视的泥底。"}}]}},{"id":"4-6","title":"城门的阻拦","paragraphs":["走出斯提克斯的泥沼，一座高耸的城墙矗立在我们面前——那是冥城狄斯（Dis）的城垣。城墙黑得发亮，塔楼如同烧红的铁一般泛着火光，仿佛整座城都在烈焰之中冷眼俯视着来者。城砖上仿佛还渗着昔日的血与恨，风卷着灰烬，绕着墙根打转，发出低低的呜咽。那墙高得看不出顶，仰头望去，砖缝里仿佛还嵌着许多双不肯闭上的眼睛，正冷冷地打量着我们这两个不速之客。","「站住！」城墙上传来暴怒的呼喝。我抬眼望去，那一排竟不是普通守卫，而是堕落的天使——他们曾立于光中，如今脸上只剩下狰狞与不甘，齐声朝我们怒吼：「你这活人，也敢踏进这座城？」他们挥动着兵器，不许我靠近那扇半掩的门。门缝里透着光，可那道光像是被什么堵住了，怎么也透不进来，显得格外的冷。那一声声怒骂从高处砸下，砸得人耳膜发疼，也像是在替这座城把来者挡在门外。","紧接着，两个复仇女神的身影出现在矮墙上——墨格拉与阿勒克托。她们纠缠着蛇发，眼中燃着噬人的怒火，嘶哑地尖叫着，堵住我们的去路。维吉尔上前与他们周旋，却被那一片歇斯底里的咆哮压了回来；他定了定神，又一次开口，仍旧不能撼动那扇沉重的门。四周的高墙仿佛在向后压来，把呼吸都挤得短促。我看着一向沉着的引路人被人挡了回来，心头那杆天平，也忍不住往「退」的那头沉了一沉。","我头一次看见这位一直从容的引路人，露出几分无计可施的疲态。他微微蹙眉，像是也被这突如其来的挫败绊住了脚步。城墙下的我们相对无言，四周只有风声和那些堕落者尖利的叫嚣。我心底原本一路向前的勇气，忽然在这堵墙前晃了一晃——原来纵是智者，也有迈不过的一瞬；原来真正的考验，未必都藏在深渊里，有时就拦在进门的第一步。我捏了捏拳，知道这关口若自己先泄了气，便再也没有人能拉得住。","我攥了攥拳，又把它松开。既然这一关拦的不是我的剑，而是我的心，那我更不能在此拧着劲儿，去跟另一股硬气较真。维吉尔虽一时受挫，可他始终没有转身的意思——我便也不去泄他的气。城里那声尖利的叫嚣仍在墙头回荡，可我已不再追着它听了，只立在原地，与他一同等着那扇门露出转机。恐惧最打不败的，恰恰是一个不肯先退的人。"],"choice":{"prompt":"眼看维吉尔一时受挫，你——？","options":[{"text":"忍住恐惧，与他一同等待转机。","to":"4-7"},{"text":"灰心地说「我们回头吧」。","end":{"kind":"灵魂沉沦","title":"被高墙拦回原地","text":"你的一句话，让本已动摇的维吉尔默然。你们沿着来路回头，走回斯提克斯的泥岸。可地狱的路没有回头这一说——你越往回走，那一重此前已看过的痛楚便越是模糊、越是沉重，渐渐压得你举步维艰。你终于明白：在初次的失败上转身，不等于保全，而是把恐惧放大成一座更高的墙。你被困在墙下，终究没能迈进那扇半掩的门，也没能看清门后那一点微光。"}}]}},{"id":"4-7","title":"离圈之悟","paragraphs":["就在我们被堵在城下、进退两难之际，城门口忽然传来一阵异动。仿佛有一双手自天而降，拨开了那扇沉重的门，一束微光从门缝里漏了出来。原本叫嚣的堕落者与复仇女神，也在这突如其来的威仪之下，退让、噤声，让开了一条路。那光并不炽烈，却很稳，恰好容得下一个人走进门去。我望着那道光，方才在墙下攥紧的心，才敢一点点松了开来——原来紧要关头，需要的不是硬闯，而是先稳住自己不退。","维吉尔松了口气，踏前一步，示意我跟上。我的胸口仍存着方才那股惧意，却也在石门开启的声响里，慢慢把这四、五两圈的所见收拢成一句：钱财是工具，从来不是主人；怨怒当化正义之怒，而不是爆裂的、吞没一切的恨。这一刻，我仿佛听见自己心底有什么沉重的块垒，正顺着门缝的光，一点一点被移开。那推石的身影、吐着气泡的魂灵、以及堵在墙前的怒火，原来都在指着同一件事——人被外物与情绪牵着走时，便不再是自己。","「你若把钱财当工具，它便为你所用；你若把它当主人，你便成了第四圈那推不尽的石头。」维吉尔没有回头，只说给我听，「你若把怒气化成正直的不平，去护该护之人，那是勇；你若任怒烧成恨，明火与暗火同是吞噬你与旁人的淤泥。」他的话语像一瓢冷水，把我心头那点还未熄灭的焦躁，轻轻地浇熄了下去。非是不许有怒，而是这怒得是替公理而生的「正气」，不是替一己之私烧起来的「怨火」。","我深吸一口气，把那堵高墙、那片泥沼、那些推石的身影都记在心里。脚下的路通向更深的黑暗，我知道前面还有更重、更幽晦的罪与罚。但这一刻，我忍住恐惧，让理智重新在前头擎起一盏灯。我在心里把「节」与「正」二字又默念了一遍，随即轻声开口：「我准备好了。」于是迈开步子，向那更深的黑暗走去。既然「节」护住我不为财役，「正」导我怒而不为恨，那么再深的路，也终究是能一步步走过去的。","走入门缝的微光时，我回过头，望了一眼身后那两圈的暗影。推石的、撕打的、沉在泥里的，一个个身影都还停在该在的地方。我忽然庆幸自己不曾在那堵墙前转身，也不曾把自己的日子过成一块搬不动的石头。既然「节」能让我不为财役，「正」能让我怒而不为恨，那么再往深处的黑暗里去，我也有底气一步步走过。我转回身，循着那束光，踏进了狄斯的门。"],"choice":{"prompt":"城门将开，你——？","options":[{"text":"轻声道「我准备好了」，走向下一重黑暗。","to":"5-1"},{"text":"推说太累了，剩下的黑暗改日再走。","end":{"kind":"灵魂沉沦","title":"停在黑暗门槛前","text":"你停下来，许诺自己不急于走进那更深的黑。可惜地狱的黑暗从不等你备好——你的一日「改日」，在永恒里被无限拉长。你只向前踏了半步便停住，于是那半步也成了你的界，而你始终停在两重黑暗之间的门槛上，看着身前身后同样稠密的夜色，进不得，也退不回。你终于察觉：怯懦与贪婪、暴怒一样，都是让人停在原地的石头。"}}]}}]},{"chapter":5,"circle":"第六、七圈 · 异端与暴力（冥城与血河）","title":"第五章 · 火墙 · 血河","subtitle":"信仰的裂缝与暴力的血","nodes":[{"id":"5-1","title":"冥城之门","paragraphs":["狄斯城的城墙矗立在眼前——它不是普通石头砌成的墙，而是一道烧得通红的铁壁，砖缝间流淌着暗红的火光，仿佛整座城都在燃烧。城门紧锁，门内透出无数火舌与直上颅顶的哭嚎，那哭声层层叠叠，像是无数人把自己的一生化作同一声叹息，在暗处哀哀啜泣。上一刻还在狄斯门前受挫于愤怒恶魔的但丁，此刻望着那扇由顽劣幽灵把守的巨门，喉头发紧，脚步几乎要原地定住。他忽然想起，自己这一路走来，真正让他心生退意的，从来不是那些狰狞的怪兽，而是每一次站在门槛前、被自己心里翻涌的东西所拽住的那一刻。","他转过头，看向身边那位以理性与智慧一路引他前行的诗人维吉尔。只见维吉尔也面色凝重，额角沁出冷汗，可他依旧没有停下，没有后退，更没有让一丝动摇浮上那张沉静的脸。他低声说：这一城是愤怒与顽固的巢穴，它们守在门前，不过是为了不让我们看穿它们心里藏着的东西。但丁听着，在心里一遍遍地告诫自己，不能被这滔天火势与翻涌的恐惧，淹没了那条通往清醒的路。他第一次真切地明白，神意可以替他推开一扇门，却无法替他迈出那一步——迈步的，终究只能是他自己。","就在此时，一道光自天而降。那光不是火焰——火焰是灼人的、滚烫的，而这道光更冷、更纯粹，像黎明时分第一缕还不灼人的晨曦，清亮而安详。它踏过冥河的水面而来，水在它脚下凝成坚实的路，仿佛连翻涌的冥河都肯为这神意让开道来。那是一个身披圣洁之光的使者，他缓步走到城门前，目光平静得如同一池秋水，眉宇间没有一丝威压，却自有一种不容抗拒的力量。而他身后那些凶悍的恶魔，却在看清他的那一瞬，发出凄厉的嘶鸣，纷纷溃散、退入阴影深处，再也不敢探出头来。","天门在这位神使面前缓缓开启。他并未用力，只轻轻一抬手，那扇连愤怒恶魔合力都推不开的巨门，便像被火融开的蜡，一点点向两侧张开。入城的路通了，可门内扑面而来的，是灼热的空气，和仿佛自大地深处被压迫上来的、经年不散的惨呼。金红色的火光映红了整条幽暗的长街，也映红了但丁的脸。他站在门边，第一次真切地感到：往地狱深处每踏进一层，都是一次对自己内心的拷问——那一道道门，锁住的从来不只是罪人，还有他心底那些他不敢正视的阴影。","他犹豫着，脚步钉在原地，喉间发干，几乎要转身退走。维吉尔轻轻拍了拍他的肩，声音沉静而温和：恐惧是人心最诚实的影子，却也正是最先要跨过的那道门槛。你驻足于此，正是因为它照出了你心里残留的犹疑。你若连这一步都不敢迈，又怎能在更深的黑暗里，找到那缕能照见你一生的光？但丁深吸一口气，像是要把所有的胆怯都一同吞进肺里，终于向前，迈出了那一步。他知道，跨过这道门，他就不再只是看客，而是要睁着眼睛，去看这个世界最沉的一面。"],"choice":{"prompt":"面对城中灼热的火焰与哭号，你要如何自处？","options":[{"text":"握紧维吉尔的手，迈步进城","to":"5-2"},{"text":"让恐惧压过脚步，停在城门前","end":{"kind":"灵魂沉沦","title":"城门前的迟疑","text":"你的脚像被钉住一样留在城门外。被神使驱散的恶魔虽退入阴影，却在黑暗中重新聚拢，它们嗅到恐惧的气味，纷纷自焦黑的城垛探出头来。你一迟疑，那条本为你而开的路便骤然合拢，神光熄灭，冥河重新翻涌。无数只手自火墙里伸出，将你拖进那片滚烫的城垣之内——你成了这里徘徊的又一缕犹疑之魂，永远在门前徘徊，永远迈不出下一步。地狱不是先惩罚罪人，而是先惩罚那些不敢前行的人。"}}]}},{"id":"5-2","title":"焚墓异端","paragraphs":["跨入城门，眼前的景象让但丁屏住了呼吸。第六圈的每一寸地面，都散布着敞开的石棺，棺盖被掀翻在地，像无数只张开的嘴，无声地等着什么。棺内没有腐尸，只有灼烧的火焰在舔舐着某处——细看才明白，那是盛着罪人躯体的棺椁，火焰自棺壁深处烧起，把肉身与魂灵一同煨烤，却从未真正将它们焚尽。火焰是活的，又似乎是被什么永久地钉在了这里，除了燃烧，再无别的去向。整片场地没有风，没有声，只有火焰低沉的舔舐声，在死寂里格外清晰。","这里埋葬着谁？维吉尔低声说：是信奉异端之徒，尤其是主张灵魂随肉体一同死灭的伊壁鸠鲁派。他们生前宣称，人死了便什么都没有了，既无天罚，也无审判，所以放纵今生、无所畏惧，仿佛世俗的享乐便是人生的全部，仿佛死后的一无所知是某种可以拿来炫耀的洒脱。此刻，他们被自己的信条反噬——因为他们所否定的，恰恰真实存在：灵魂不灭，而审判，正由这永不熄灭的火，一桩桩、一件件地降临到他们头上。他们曾笑天罚是虚妄，如今却躺在火里，亲眼去看那虚妄如何成真。","但丁沿石棺间的通道缓步而行。那些被火灼烧的身躯在棺中微微抽动，发出几乎是叹息的低吟，听来不像挣扎，倒更像一种沉默的认命。他心中忽然生出一丝怪异的念头：若灵魂真的随肉体一同灭亡，那么这些人此刻又为何在受苦？若死后真的一无所知，那这满城的火焰与呻吟，又算是什么？他越想越觉得，那一套把死亡说得轻飘飘的论调，实在站不住脚——真正把一个人钉进这火里的，从来不是刀剑，而是他生前深信不疑的那句谎言。","他停在一具棺椁前。里面的人正从火焰中挺起半身，目光灼灼地盯住他，那目光里有审视，也有多年不改的强硬。维吉尔在身后低声道：是他——法拉利纳。但丁的心猛地一动，他知道，这位生前以坚定与强悍著称的佛罗伦萨贵族，此刻正躺在他自己最深信的那个答案里，承受着火的审判。而他那句不信灵魂、不信天罚的信条，正随着每一缕火焰的舔舐，变作他永恒的墓碑——他生前引以为傲的清醒，到了这里，反成了把他钉在最深处的那根钉子。","但丁缓缓低下头，只见那一座座敞开的石棺，在摇曳的火光里延伸向远方，数之不尽。每一座棺材里，都躺着一个生前把话说得很满、把死亡看得极轻的人。他们曾以为自己比谁都清醒，以为看穿了生死便算是超脱，却不曾想，真正清醒的人，恰恰是那些肯承认自己有所不知、敬畏着冥冥之中那份秩序的人。一念之差，便把这满城的火，从别人的诅咒，烧成了自己的归处。"],"choice":{"prompt":"听闻‘灵魂随肉体死灭’的论调，你如何想？","options":[{"text":"你亲眼所见，灵魂并未死灭","to":"5-3"},{"text":"或许他们说的也有几分道理","end":{"kind":"灵魂沉沦","title":"俯首于谬误","text":"你暗自点头，心想人死如灯灭，或许不假。就在这一念之间，脚下石棺的棺盖砰然闭合，将你扣入其中。无数只手自棺壁里伸出，把你牢牢按进灼热的火焰。你听见自己的躯体在火中发出滋滋之声，却始终烧不灭——因为你所否定的灵魂，正真切地承受着永不止息的烈火。你成了这第六圈新的一员，躺进自己信奉的答案里，被自己曾笃信的虚妄反复拷问着。谬误之毒，从不是死后才发作，而是在你信它的那一刻便已上线。"}}]}},{"id":"5-3","title":"法拉利纳的骄傲","paragraphs":["火焰中，法拉利纳挺直了胸膛。这位生前以骄人的武力与坚定的意志捍卫家乡、在党争中屹立不倒的佛罗伦萨贵族，此刻虽被火焰包围，却仍像当年在城中一样昂首而立，毫无惧色。他打量着但丁，眉宇间带着一丝倨傲，仿佛这灼身的火焰与他丝毫无关，仿佛他仍是那个在城头号令众人、令敌人闻风丧胆的强人。火在他身周翻涌，映得他的轮廓忽明忽暗，却始终烧不到他那份不肯低头的模样。","他开口便问起但丁的族人——原来他认出，这正是曾与他家族政争对立的血裔。即便身处火棺，他仍放不下尘世的恩怨与荣耀，仿佛那些党派与家世，远比身下的火更让他看重。维吉尔在一旁低声叮嘱但丁，让他在与这位傲慢亡魂交谈时，言语要谨慎得体，方不致冒犯那克制在火里的尊严。但丁谨记在心，却也忍不住想：一个连死后都放不下恩怨的人，他的骄傲，究竟是为他自己加的冕，还是替他自己掘的坟。","但丁与他谈到家乡的残破与党争。法拉利纳回答时，眼神一度黯然，仿佛被勾起了某段他不愿回首的往事，却又很快重新燃起骄傲的火光。他对但丁说：我依然无所畏惧。他所说的无所畏惧，是对死亡与惩罚的无惧——因为他根本不承认灵魂会受审判，也不承认死后还有什么可惧的。他把这份硬气当成了真正的勇敢，却不知这正是他陷身火中却无从脱身的缘由：一个连审判都不肯承认的人，自然也不会去求那唯一能救他的宽恕。","等到法拉利纳的火光重新炽盛，但丁才渐渐明白：一个宁可否定灵魂永生，也不肯垂下高傲头颅的人，他的骄傲再硬，也终难逃这自燃之火。那些曾在尘世为他加冕的强毅，在此处成了他亲手掘开的墓坑——不是勇敢，而是执迷。错误的信仰，让他付出了比任何敌人都更沉重的代价：他把本可以得救的那点谦卑，也一并烧了个干净。但丁望着那团固执的火，忽然懂得，真正的勇敢，不是不肯低头，而是肯在错的地方，放下那副自以为是的傲骨。","他忽然想到，一个人若不肯承认自己有错，那他无论多么强悍、多么有理，都只是把自己关进了一座更小的井里，抬头只见一片自以为是的天空。法拉利纳的遗憾不在于他不够强，而在于他太相信自己是对的——一个人对自己的信念越笃定，便越听不进那声能救他的提醒。但丁默默地把这份心念记下，仿佛也在提醒自己：这世上最危险的骄傲，不是居高临下看轻别人，而是连自己错了，都浑然不觉。"],"choice":{"prompt":"面对法拉利纳的硬气，你作何反应？","options":[{"text":"他的骄傲不能掩盖其谬误","to":"5-4"},{"text":"被他的硬气深深打动了","end":{"kind":"灵魂沉沦","title":"傲于谬误","text":"你不禁为法拉利纳的硬气心折，觉得这样的无畏令人敬佩。念头方起，你脚下的石棺便裂开一道口子，灼烫的火舌卷上你的腿脚，将你拖入其中。火烧的不是你的肉身，而是你那刚被肯定的骄傲——你在自己的无所畏惧里，被永远地架在火上。你这才明白：分辨善恶，从来不在胆量大小，而在于是否敢于承认自己的错。你越是一味强硬，那火便越是不肯熄灭，直到你甘愿低头，看清那被你一直回避的真相。"}}]}},{"id":"5-4","title":"血河弗雷杰顿","paragraphs":["离开第六圈，但丁与维吉尔来到第七圈的崖边。一条赤红的河流自崖下涌过，水不再是水，而是一锅翻滚的沸血，泛着暗红的泡沫与蒸腾的气——这是地狱里最直接、也最沉重的罪罚之河，名为弗雷杰顿。河面灼烫得连对岸的岩石都泛起焦色，热浪逼人难近，隐隐能听见河心深处传来的咆哮与呻吟，像是无数根喉咙在沸血里一齐翻腾。那声音此起彼伏，听久了，竟有一种令人头皮发麻的黏腻。","河中浸着无数灵魂——那些生前以暴力残害他人、掠夺他人血肉的暴君与凶手。他们或被淹到没顶，或被推到齐颈，沸腾的血水在烧灼着他们，正如他们生前曾让别人的血泊成河。但丁认出其中有阿喀琉斯、亚历山大这些声名显赫的征服者，他们曾以武力征服万民、踏平城池，此刻却被武力铸成的血河牢牢钳住，连挣扎都只是徒劳的抽搐。那曾经让天下震颤的名字，如今一个个泡在血里，成了一道供人默然观赏的罪证。","岸边，一群半人马守在河畔。它们的上半身是人，下半身是马，手持弓箭，目光凶狠而警惕，巡守着这片渡口。为首的半人马喀戎上前，身形高大，神色沉稳，仿佛是这群烈性怪物中唯一存有几分理智的。他说自己可以带这两位活着的人渡河，却严正警告：不得靠近河岸，否则会被血河的涛浪卷入，与那些暴君一同沉沦。但丁望着他背上与河中同伴的箭痕，知道这片渡口绝不是能讲情面的地方。","但丁望着血河中挣扎的身影，心中生出一丝说不清的东西——这些征服者，曾经也有功业、有雄心、有臣民，为何会落得这般下场？他几乎要为他们叹息，觉得那一声声嘶吼里，分明藏着不甘与委屈。维吉尔仿佛看穿他的心思，低声道：以暴力夺人者，最终被暴力所夺。你若要为他们辩解，便先要去问那些被他们的铁蹄碾碎的弱者。一句话，让但丁那点软下来的心，又硬了回来。他终于明白，那是他们在替自己不义的一生，付一笔迟来的债。","他在渡河时，目光不自觉掠过那些只剩半截肩膀浮在水面的面孔——有人曾坐拥半壁江山，有人曾因一怒而血流成河，如今却连一声完整的呐喊都发不出。血河不会记得他们生前的荣光，只会一遍遍烫过他们的皮肤，让他们永远尝到那曾加诸于人的灼痛。但丁心下默然：暴力这柄剑，挥舞时看似痛快，可它每砍下一刀，都有一丝反噬悄悄缠上持剑人的手腕，直到某一天，那只手腕再也放不下剑，也再拿不起任何温暖的东西。"],"choice":{"prompt":"面对血河中的暴君，你会生出共情么？","options":[{"text":"他们以暴力夺人，终被暴力所缚","to":"5-5"},{"text":"他们不过是为了雄图壮志","end":{"kind":"当场死亡","title":"沉入血河","text":"你为那些征服者心生辩解，觉得他们不过是成王败寇。这一念的松动，让原本平静的河面骤然掀起血浪，滚沸的血水越过河岸，当头将你吞没。你坠入灼烫的弗雷杰顿，血漫过你的口鼻，你越是挣扎，那鲜血便越是灌进你的肺里——你不是被火烧死，而是被你所认同的以力服人的暴力，用自己的血活活淹没了。你终于尝到那柄伸向别人的剑，是怎样反手刺回握剑之人身上的。"}}]}},{"id":"5-5","title":"自杀之林","paragraphs":["渡过血河，眼前出现一片怪异的森林。树是褐色的，扭曲、盘结，没有一片绿叶，枝条间长满布着毒刺的荆棘，望去像一片枯死的、痛苦的骨林，又像无数只向上伸着的手。风穿过树林，没有寻常的沙沙声，只余一种压抑的低语，仿佛整片林子都在无声地哀嚎，每一根枝干都在吐着沉重的喘息。这里的静不是安宁的静，而是一种被按捺住的、随时可能爆裂的呜咽。","维吉尔告诉他，这第二环正是自杀者之林。那些生前弃绝自己生命的人，死后化作这扭曲的树。他们既无法回到人身，也无法在别处安息，只能作为树木被永远禁锢此地，得不到自由，也得不到解脱。林间盘旋着鹰身女妖哈比——那些有着少女面孔、鸟身与利爪的怪物，它们成群落下，啄食着树梢的枝叶，像一群永不餍足的诅咒，把每一次的疼痛，都撕得更深、更久。","每当哈比撕下一根枝条，那棵树便剧烈地颤抖，自断裂处涌出殷红的汁液，同时发出人一样的啼哭——那是受伤的魂灵在哀号，而它越哭，哈比便啄得越欢。但丁不忍，伸手去触碰一株树，哪知刚一碰到，树皮便渗出鲜血，枝干开口说起话来，正是当年的御前大臣彼得。那声音嘶哑而颤抖，仿佛在这片林子里，他已经独自忍了太久，太久没有人和他说过话。","彼得是被诬陷而自尽的，生前忠贞，却因政敌构陷而绝望自戕。他的灵魂化作树，如今被哈比啃食，却仍念念不忘自己的清白。他告诉但丁：人最大的悲哀，是亲手放逐了自己本该珍视的生命与大地。但丁惊觉，这林里没有一株树是一开始就想死的——他们都是先被绝望与屈辱压垮，才选择了那条最不该选的路。而那条路的尽头，不是解脱，是另一座更漫长、更沉默的牢笼：连哭泣，都只能化作流不尽的汁液，连后悔，都换不来一次重新选择的机会。","但丁把那只正流着血的断枝轻轻放回树干，心里一阵发酸。他突然想到，若一个人能在最绝望的那一刻，多等一等，多看一眼身旁还肯伸出手的人，哪怕只多等一炷香的工夫，也许就不会走进这片再难回头的林子。自弃看似是把苦痛握在自己手里，实则却是把唯一的生机也一并掷了出去——不是不让旁人疼，而是连自己得救的可能也一同掐断了。这林子里每一棵树，都在无声地替所有被绝望压垮的人摇头。"],"choice":{"prompt":"你认为自弃生命只是个人之痛么？","options":[{"text":"生命是不可自弃的天赐","to":"5-6"},{"text":"是他们自己的苦，旁人无权置喙","end":{"kind":"灵魂沉沦","title":"荆棘缠身","text":"你认定那是他们各自的选择，旁人管不着。话音刚落，旁边的荆棘便疯狂地蹿起，将你紧紧缠绕。荆棘上的毒刺一根根扎进你的皮肉，你越是挣扎，它便缠得越紧，尖刺便越深入——你终于体会到，那种无人理解、唯愿一死的孤独，是怎样一寸寸把人绞进绝望的。你不愿去救别人，于是连自己也被这片绝望的荆棘永远勒住，既无法动弹，也无法死去。生命从不只属于自己，遗弃它的人，终会被自己的遗弃反噬。"}}]}},{"id":"5-6","title":"火砂袭天","paragraphs":["穿过自杀之林，走出第三环的边界，脚下的大地倏然变成一片无边无际的火砂。细密的沙砾滚烫灼人，每走一步都像踩在炭火上，脚底传来一阵阵钻心的烫痛。更骇人的是天空——一片赤红的云自头顶压下来，不断落下一片片细小的火雨，像无数烧红的碎屑簌簌而降，打在地上、打在人的皮肤上，滋滋地烫出阵阵青烟。这片火砂地没有屋檐，没有树荫，火雨与热砂层层逼来，把一切逃避的缝隙都封得死死的。","火砂地上，一群灵魂赤身裸体地奔跑着。他们没有停歇的余地——火雨自天而降，他们必须一边躲闪一边狂奔；一旦跑得慢了，脚下的热砂又立刻灼伤他们。这些人中，有亵渎神明的，有重利盘剥、以高利贷将他人逼入绝境的，也有放纵色欲而亵渎天理的，都被这三重火罚追得无处可逃，只能在这片没有尽头的灼热里，跑向他们早已注定的结局。那奔跑声从不停歇，像一场永远跑不到头的刑罚。","但丁在人群中看见一个昂然挺立的身影——卡帕涅乌斯，这位在围攻底比斯时曾狂妄蔑视神明的战士。他躺在火砂上，任凭火雨落在身上，灼烧他的皮肤，却仍仰天怒吼，咒骂着众神。他宁可被烧死，也绝不向神明低头，那份狂傲带着一丝近乎悲壮的光，令但丁一时分不清那是勇气，还是执念。他呼号的言语里没有半点悔意，只有不肯咽下的抗拒，仿佛只要他还敢骂，他便还赢着。","但丁看着他，心里既惊又叹。维吉尔却不似他这般动摇，冷冷道：你看他，这是对神明的亵渎——他比任何受刑者都更固执地抗拒那唯一能救他的力量。狂傲让卡帕涅乌斯把来自神明的援手当成侮辱，于是这烈火，便成了他永恒的伴生；他越是倔强，那火便烧得越深，仿佛在为他的傲慢作一场不会落幕的注脚。但丁望着那片灼人的火砂，忽然懂了：不是火在惩罚他的不信，而是他的不信，亲手把自己变成了不灭的火。","他默默看着那些在火雨里奔逃的身影——他们并非不想要停歇，只是一旦停下，脚下的热砂便会把他们的脚烫出焦烟。但丁忍不住想，凡是不肯敬畏，又不懂得自制的，到头来都只能这样一刻不得安宁地奔跑，连片刻的喘息都是奢望。人之所以为人，恰在于他知道什么该敬畏、什么该克制；若连这份自觉都放下，那他与那被火追着、无处安身的躯体，也就再无分别了。"],"choice":{"prompt":"你是否被卡帕涅乌斯的狂傲吸引？","options":[{"text":"狂傲终是自焚之火","to":"5-7"},{"text":"敢蔑视神明，何等的傲骨","end":{"kind":"当场死亡","title":"焚于狂傲","text":"你为卡帕涅乌斯的不屈暗暗喝彩。就在这缄默的认同里，头顶的赤云骤然压低，一阵密集的火雨浇在身上，燃起你的衣衫与发肤。你惊叫着奔跑，却发现四周的火砂也随之高涨，你跑得越快，火焰便追得越猛；你不肯停下，火便不肯放过你。你最终被烧成一段焦黑的轮廓，才终于明白：不是神明容不下你的傲骨，而是傲慢本身，就是那团从内部烧穿你、让你拒绝被救的火。狂傲从不是勋章，而是自焚的引信。"}}]}},{"id":"5-7","title":"离圈之悟","paragraphs":["走出第七圈，但丁回望那一片由血河、自杀林与火砂组成的地狱疆域，心情久久不能平静。那一幕幕滚烫的景象还在他眼前晃动，脚下却已踏上了更平、更暗的地面。维吉尔停下脚步，向他道出这第七圈真正的玄机：暴力之罪，其实分作三种——对他人施以暴力，对自身施以暴力，以及对神明施以暴力。这三种暴力看似不同，骨子里却都指向同一件事：把力量，用错了地方。","对他人之暴，落进血河弗雷杰顿，被沸血淹没；对自身之暴，化作自杀之林，被哈比撕啄、被荆棘绞缠；对神明之暴，则被放逐到火砂地上，承受永不止息的天火。三种罪，三种刑罚，环环相扣，没有一种不是以强势扭曲了爱与秩序——把本该用来守护的手，变成了掠夺、自毁与亵渎的刃。爱是把人抬高、彼此成全的力量，而一旦成了强势的爪牙，它便反过来把人拖进最深的水里。","但丁听着，忽然觉得心里一阵刺痛。他想起自己此前的犹疑、骄傲、共情与怜悯，想起自己在每一个抉择边缘险些坠落的瞬间。人类——这个被赋予了理性、能思考、能爱、能选择的物种——竟能用这份理性去残暴地夺人、毁人、压制神明；也同样能用这份理性去自伤自弃、自我流放。力量本无善恶，握它的手，才决定了一切。而那只手能不能握得稳，全看握它的人，是否还留有一分敬畏与自制。","他闭上眼，低声道：人的理性，既能如此可畏，也能如此可悲；既能把人托举向善，也能把力量扭曲成暴行与自伤。我若不能时时以敬畏与自制持守这份理性，那它比之野兽的蛮力，又有何异？维吉尔欣慰地点头，伸出手，指引他向更下一圈的地狱走去。但丁知道，他这趟地狱之行，不单是看别人的罪，更是照见自己心里那些隐秘的裂缝——而那些裂缝，才是他最需要去填补的地方。","他走了几步，又忍不住回望那片火砂与血色，心中仿佛有一盏灯被点亮。原来所谓的救赎，从来不是逃离罪的灯火，而是在看清罪的分量的那一刻，肯回头去审视自己手里的力量、心里的天平。血河灼的是夺人之暴，荆棘缠的是自弃之痛，火砂焚的是亵神之傲——三把火，烧出的却是同一句追问：你把这辈子握在手里的力气，究竟用来护人，还是用来伤人？但丁把这句追问收进心里，与维吉尔一同，朝更深处走去。"],"choice":{"prompt":"读完这一圈，你如何铭记此行？","options":[{"text":"以敬畏与自制持守理性","to":"6-1"},{"text":"人的理性不过是强者的工具","end":{"kind":"灵魂沉沦","title":"弃理性的魂","text":"你脱口而出，觉得既然理性能被用作暴行，那它本质也无甚可贵。这句话落地的刹那，四周的血河、荆棘与火砂顿时齐齐涌向你——不是惩戒你，而是让这三重罪罚同时认领你。你被血河淹没，又被荆棘缠绕，再被火砂灼烧，三重刑罚在你身上轮转不休，仿佛在昭示：那些被你轻慢、被你当作工具的理性与善念，恰是唯一能让你免于这些刑罚、走向救赎的力量。你此刻才追悔，却已迟了——轻贱善念的人，终究会被自己的轻贱放逐。"}}]}}]},{"chapter":6,"circle":"第八圈 · 欺诈（十道恶囊 Malebolge）","title":"第六章 · 恶囊 · 欺诈","subtitle":"用聪明作恶的深渊","nodes":[{"id":"6-1","title":"怪蛇革律翁","paragraphs":["越过了第七圈尽头那条沸腾的血河，脚下的石坡骤然陡峭起来。空气里那一股被火与血灼透的腥热，到了这里竟化作一种黏腻的凉，贴在皮肤上，挥之不去。四下里的哭喊与兵刃声渐渐远了，取而代之的是一种更深沉的动静——像是整座大地深处，压着千百个人压低了嗓子在低语。维吉尔在崖边停下脚步，回头看我一眼，神色比此前任何一步都要郑重。他说，这里是第八圈，欺诈渊，也是比暴力更深的一层罪。他没有与我并肩，而是让我独自走上去，看看下面的景象。我虽不解，还是依言独自向前，迎着那阵阴风，探出身子。","我俯身望向断崖之下。那里裂开一道深不见底的巨缝，像大地张开的巨口，层层叠叠竟有十道环形的沟壑，如同一座沉入地底的巨大竞技场。沟壑与沟壑之间，被嶙峋的岩脊隔开，那岩脊又化作一道道横跨的窄桥，狭窄得只容一人侧身而过，一边是壁立千仞的崖，一边是深不见底的黑暗；那些窄桥一路向下延伸，沉到目力所及的尽头，仍不见底。十道恶囊里，各自翻涌着昏黄的火光与升腾的腥烟，隐约传来哭喊与鞭响，被风搅成一团，听着竟不像活人的声音，倒像是大地自己在低声呻吟。","就在我凝望之际，一个影子从对面的岩壁无声地攀上了我脚下的石沿。那是一头我从未见过的怪物。它竟生着一张人的脸，眉目端正面容温和，甚至噙着一丝慈和的笑意，像极了一位可以托付性命的长者，让人一见便想亲近，把戒备都忘了大半。可当它缓缓向我爬近，我才看清，那所谓的身躯竟是一条布满花纹的蛇身，盘曲着蠕动，四肢是兽的蹄爪，抓在石上无声无息；而在它背后，赫然拖着一根蝎子般的毒尾，尾尖泛着幽幽的光，轻轻摆动。它抬眼望着我，仿佛正要开口与我搭话，那分寸拿捏得恰到好处，几乎叫人要放心把手伸过去。","“诚实的脸，毒蝎的尾。”维吉尔的声音在我身后响起，平静得像在陈述一件常识，“这就是欺诈的守望者，革律翁。世上多少骗局，都先披一张正人君子的脸，先让旁人放下戒心，而后再把人一点点拖进深渊。你若要往下走，先问一问自己——你识不认得这假面？”我望着那张温和的脸，又望向那根泛光的毒尾，一时竟有些犹豫。它太像一个好人了，甚至比许多我认识的活人更像一个好人；我也几乎要以为它真是这趟旅途里一位恰好的帮手。"],"choice":{"prompt":"面对革律翁慈和的脸与垂下的毒尾，你如何做？","options":[{"text":"看穿这假面，按兵不动，静待它露出獠牙","to":"6-2"},{"text":"被这张和善的脸打动，伸手上前探看","end":{"kind":"当场死亡","title":"被毒尾卷入深渊","text":"我被那张温和的脸骗过，情不自禁地靠近。革律翁的笑意更深，当我正要去碰那看似可亲的面庞时，它身后的毒尾骤然扬起，像一道疾电扎进我的手背。剧痛顺着血脉烧到心口，我却发不出声音。它不紧不慢地将我卷起，像掸走一粒尘埃般，把我拖向那道不见底的裂缝。坠落时只有风声，还有我听着自己心跳一点点熄灭的声音。直到最后我才明白：这世上真正引人入深渊的，从来不是狰狞的恶，而正是那张让我放下戒心、诚恳和善的脸。"}}]}},{"id":"6-2","title":"第一恶囊 · 诱骗者","paragraphs":["我凝住呼吸，定定地望着那张慈和的脸，又慢慢落向它身后那根毒尾。革律翁见我不为所动，那笑意便淡了下去，缓缓伏低了身躯，像一个被识破的小贩收起了吆喝。维吉尔说，它识得我不是轻易上钩的人，便愿意载我们一程；欺诈最懂得掩饰，可它到底也认得出同样谨慎的人。我跨上那怪物的脊背，它便贴着陡峭的岩壁、循着那道深缝盘旋而下。风从谷底涌上来，黏腻的凉越来越重，那股腥与臭也一阵比一阵浓，熏得人几乎要背过气去。","革律翁将我们放在第八圈的低处，便无声地去了，仿佛从不曾与我们相识。维吉尔领我跃上一道横贯沟壑之间的石脊，顺着它向前走。脚下是第一道恶囊，沟里黑压压全是奔跑的人群，赤着身，被一群长角的恶鬼紧紧追赶；恶鬼手中的长鞭抽得空气啪啪作响，鞭落之处皮肉绽开，那些人便嚎叫着绕圈狂奔，跑得脚后跟几乎翻起，却一刻也不能停下。我站在桥上看了一会儿，只觉得那鞭声一下一下，抽得连我这旁观的人都跟着心惊。","“这些是诱骗者。”维吉尔指给我看。那群人里，有一个身形魁梧者，正是当年率队远航的英雄贾森，“他凭一张舌灿莲花的嘴，哄得一位公主倾心，替他与族人效劳；事成之后，他却转手将她抛弃，像丢一件用旧了的器物。你看他如今走在这鞭下，正是把当初那副说尽甜言蜜语的嘴脸，一寸一寸跑还给世人看。”我望着那奔逃的身影，心里竟生出一分说不清的轻慢——相较血河里那堂皇的刀剑与战车、那些卷起风沙的厮杀，这“靠嘴皮子骗人”的行径，好像是轻了许多立时便算不得大事。","“你可是觉得，言语上的欺哄算不得大罪？”维吉尔仿佛看穿了我的心思，“暴力伤的，是人的皮肉，皮肉总还有愈的时候。花言巧语毁的，却是一个人最要紧的信与清白——那份东西一旦碎了，就再难拼回原样。被鞭打的，都是偷了别人心的人；那鞭子，正是无数颗心头被辜负的回响。你一个‘轻’字，就把他们偷走的东西，也一并轻待了。你再想想，若你交付真心的人，只用一句漂亮话就把你换来换去，把你替他做的那些事、说过的那些话都一笔勾销，你心里那点冰凉，又会轻到哪里去？被辜负的人不会流血，可她们一辈子都在那伤口上站着，走不出去。”我望着那道绕圈的人流，忽然不敢再轻看它了，那轻飘飘的一句甜言，原来也能压垮一个人。"],"choice":{"prompt":"三寸不烂之舌骗来的春宵，是否算不得大罪？","options":[{"text":"它毁掉的是人的信任与清白，同样卑劣","to":"6-3"},{"text":"不过是花言巧语，无伤大雅","end":{"kind":"灵魂沉沦","title":"被鞭驱驰，永无宁日","text":"我笑着说，哄人几句哪里算得上罪。话音未落，四周的景物骤然旋转，我发觉自己也赤着身，混进了那道绕圈奔逃的人流。一只长角恶鬼抡着鞭子追上来，啪地一声落在我背上，我疼得向前冲去，想停下辩解，想说我不是这样的人，可鞭子不许我停，也不许我回头去找那个被我辜负的人赔罪。我这才明白：我用花言巧语偷走的那颗心，早已化作这鞭上每一次落下的回响——我只能替它，一圈一圈、永无宁日地跑下去。"}}]}},{"id":"6-3","title":"谄媚者与贪权者","paragraphs":["我们越过第一道恶囊，沿石脊来到第二道。俯身望去，沟下是一片黑浊的泥沼，翻着恶臭，里面半埋着许多张面孔。他们仰着头，把嘴张得大大的，吐出一口口浑浊的泥水，喉间发出咕噜咕噜的声响，像溺水的人，却永远沉不下去。维吉尔说，这些是谄媚者——生前把人捧得天花乱坠、专拣人爱听的话说、把是非舔成了一汪蜜的人，如今便被泡进他们当年端给人喝的那碗毒粪里，一辈子洗不净那张嘴。我站住看了半晌，只觉得那股臭气，比方才的鞭声更叫人不适，因为它黏糊糊的，挥甩不掉。","我们继续前行，来到第三道恶囊。这一道里，布满了许多像洗礼盆一样的圆形石洞，洞口只露出半截小腿与脚掌，脚底窜着火，烧得皮肉焦黑、不时簌簌剥落。维吉尔指着那些脚，声音沉了下来：“这些，是被火烤着的人。他们生前把神圣的职位当成可以买卖的货物，谁出的价高，谁就能戴上那顶本该属于德行与责任的冠冕。你认得最底下那一位么？那是教皇尼古拉三世——他把教会当成金库，把教义当成算盘，如今便被更深地钉进石洞，脚底的火，就是他永远烧不尽的贪。”","我望着那些张着脚的圆洞，心里忽然生出几分说不清的复杂。谄媚不过动动嘴皮，钻营不过是人人都有的上进心；说一两句好话哄哄人、往高处走一走，难道不是世间再寻常不过的事么？我下意识把这话问出了口，声音不大，却在这寂静的石脊上听得清清楚楚。维吉尔没有立刻答我，只抬手，指了指那泥沼里一群吐着泥水的人，又指了指那些被火烤着的脚。","“寻常，不意味着无伤。”他终于开口，“当一句好话代替了真诚，当职位的钥匙换成了一袋金币，信任便从根上烂了。你今日顺手赞一个，明日顺手敬一杯，天长日久，人心里那点耿直，就被悄悄泡软了。你以为你没有作恶，可正是这一个个‘人之常情’，把世道磨成了这口烂泥，把人心烧成了这盆火。你嘴上那点圆滑，与这泥沼、这火焰，原是一体的——今日你夸一句，明日他贪一分，那火苗，就是从小到大、一点一点喂起来的。”他顿了顿，指着那泥沼，“你且看那些泡在里面的人，哪一个当初不以为自己只是嘴甜了些、上进些？可正是这点‘上进’，把那要紧的位子当成货，把众人的敬重当成价，到头来把自己也泡进了这汪他们亲手沤成的臭水里。谄媚与贪权，从来不是两件事，而是同一只手，把真相按进泥里。”我看着那些吐着泥水的脸，忽然不敢再答话了。"],"choice":{"prompt":"谄媚与贪权，是否只是无所不在的“人之常情”？","options":[{"text":"它腐蚀真相，让人心沦为交易的筹码","to":"6-4"},{"text":"人人都会说好话，也都想往上爬，何罪之有","end":{"kind":"灵魂沉沦","title":"泡在阿谀与贪欲里","text":"我说，说几句好话、想往上走，天经地义。话音未落，我脚下猛地一空，整个人栽进那片黑浊的泥沼。油腻的泥水漫过我的胸口，我张着嘴大口换气，呛进嘴里的却不是水，而是我从前的奉承——那些甜言蜜语此刻全化作一股馊腐的腥味。我想爬出去，双脚却似被什么钉住，那正是我想往上爬的念头，把我死死按在泥里。我仰头，又看见石洞里窜起的火，耳边仿佛传来金币落袋的叮当声。我这才明白，我贪的那个位置，到头来只容得下这一潭泡烂我的泥。"}}]}},{"id":"6-4","title":"占卜者与贪赃者","paragraphs":["我们继续前行，来到第四道恶囊。我探头往下看，沟里满是人，却令人几乎不忍直视——他们的头被生生拧到背后，面孔朝向自己的脊背，眼泪只能顺着背脊流下，脚步却一步步朝后挪。他们看不见前方，只能望着自己来时的方向，像一群被倒着拖走的影子。维吉尔说，这些是占卜者与巫师。他们生前口口声声能窥见明天、能读出命运的底牌，把人心底的好奇与畏惧当成生意来买卖，如今便被永久地扭转了视线——他们一心想看的未来，从此再也够不着了，只剩下朝着过去、永远倒退的两只脚。","“占卜害人，还在其次。”维吉尔领我走到第五道恶囊。眼前是一片漆黑的湖，烧得滚烫，咕嘟咕嘟地翻着泡。那是沸腾的沥青。湖下藏着许多灵魂，他们每每憋不住探出头来换气，便被守在石桥上的恶鬼用长钩高高捞起、再重重丢回沸油里。那些人是贪赃枉法的官员——把国家的律法当成可以买卖的货物，把百姓的性命当成自己的钱袋，如今便被烧红的沥青一遍遍地烫，一遍遍地捞起，又一遍遍地沉下去，仿佛永无止境。","我看着那些在黑油里挣扎的人，心里忽然有些发愣。把水搅浑、把黑的说成白的、把白的说成黑的——这不正是最能言善辩的人最擅长的本事么？在我们那座城邦，能辩倒对方便是胜者，能把官司打赢便是能人。我自打读诗起，竟一直以为那是一桩光彩的本事，甚至暗自羡慕过那些摇唇鼓舌、官司场上游刃有余的人，觉得他们真本事，比我埋头写诗要机灵得多。","“你再想想。”维吉尔说，“语言，是人类彼此许下的约定；你用它，本是为了说出人心中原本就明白的道理，好叫人相知、相托、相依。你偏用它来颠倒黑白、为一己私利打歪主意，那它便不再是聪明，而是狼爪。沥青烧的，正是那些伸向别人钱袋与名节的脏手；黑油冒的泡，正是那些被你搅浑的是非。你能言善辩，却把道理当成了私器——这实在比笨拙更叫人替你不值，因为你本可以不用它来作恶的。”他顿了一下，又指了指那道湿漉漉的窄桥，“这世上最怕的，不是莽夫用拳，而是聪明人用嘴；因为拳头叫人狼狈，舌头却叫人把黑的当成白的、把坏的当成好的，还让旁人替他拍手叫好。你读书识字，本该比谁都更懂得这话的分量。”"],"choice":{"prompt":"把水搅浑、颠倒黑白，是否只是技高一筹的“聪明”？","options":[{"text":"它背叛了语言本该承载的信用","to":"6-5"},{"text":"不过是会说话的人占了点便宜","end":{"kind":"灵魂沉沦","title":"被滚油吞没的巧舌","text":"我说，能说会道的人占点便宜，算什么罪。话音刚落，脚底的岩石骤然塌陷，我整个人栽进那片滚烫的沥青湖。油烫得我皮肉滋滋作响，我拼命往上爬，刚露出水面，便被石桥上伸来的长钩勾住，重重摔回沸油里。我一次次想开口争辩，想证明我的歪理多么有道理，可灌进嘴里的只有滚油。我忽然懂得：那些被我搅浑的水，如今汇成了一潭，烫的正是我自己的舌头——而它从此再也说不出半个清白的字。"}}]}},{"id":"6-5","title":"伪善者与盗贼","paragraphs":["我们越过第五道恶囊，眼界再次被眼前的景象占满。第六道恶囊里，缓缓走着长长的一路人，他们都披着斗篷——那斗篷的外面镀着一层耀眼的金，走在火光下闪闪发亮，几乎要晃得人睁不开眼；可披在他们身上却沉重无比，压得他们迈步艰难、一步一挪，像各自背着一座山，走得越慢，那金便越发闪亮。维吉尔说，这些是伪善者。他们把心修成了空壳，只在外面刷一层体面的金漆，用来骗过旁人的眼睛；如今那层金依旧锃亮，壳里的铅却把他们拖得寸步难行，走得越体面，就越是抬不起脚。","在这一群人中，我看见一个被十字架钉在地面上的人——那是当年力主处死那位圣者的祭司长，如今他便横卧在路上，让每一个与他相类的伪善者从他身上跨过去。我也从他身上跨了过去，脚步踏过那片被镀金的影子，心里说不清地难受，仿佛我也做了一件见不得光的事，仿佛那层金，也有一片贴在了我的背上。","再到第七道恶囊，景象陡然一变。沟底简直像个蛇窟，无数黑蛇缠作一团，毒牙向人咬去。我看见人与蛇在彼此间变换——一个人抱着几条蛇被咬中，转眼间烧成一团灰、又化作蛇形；另一条蛇却抽出人形，竟长出了他的面容，顶替了他的位置，仿佛从没人像他那样存在过。维吉尔说，这些都是盗贼。他们生前偷人钱财、窃人算计、偷别人的名与利，如今便被剥夺了最私密的东西——他们自己，在别人的影子与被偷的形体之间，永远互换，永远认不出哪一个才是自己。","“你很心动么？”维吉尔的目光落在我脸上，“那层发亮的金，那副偷来的刺激与体面，你是不是也觉得，人前风光不过如此，顺手拿点什么也无伤大雅？”我低头不语。我确实曾经羡慕过那些穿金戴银、人前显贵的人物，也确曾在无人看见时，动过一丝不劳而获的念头，哪怕只有短短一瞬。此刻被他一语点破，那点念头便无所遁形，只好羞愧地垂着眼，不敢看他。他叹了口气：“你可知道，他们那层金剥下来就是铅，重得连一步都挪不动；他们偷来的那副皮囊，最后也换成了别人的脸。你羡慕他们先风光、觉着拿点东西无伤大雅——可你拿来的是别人的，还得是你自己的，这一进一出，谁也不亏，亏的只有那个被偷了东西、又被你顶替了模样的人罢了。”"],"choice":{"prompt":"那“体面”的光环与“偷”来的刺激，你是否也觉得诱人？","options":[{"text":"外壳越亮，里面越空；偷人者终会失己","to":"6-6"},{"text":"披件漂亮外衣、顺手拿点也无妨","end":{"kind":"灵魂沉沦","title":"金袍成铅，人蛇互易","text":"我说，披件光鲜外衣、顺手牵羊，有什么打紧。话音未落，我便被什么套住了肩——低头一看，一件金灿灿的斗篷落在我身上。我正觉得光彩，那金漆却像褪色般剥落，露出底下死沉的铅，压得我弯下腰去。我想脱下它，却怎么也挣不开。这时一条黑蛇缠上我的小腿，狠狠一咬，我眼见自己的手变成了鳞与尾，而另一条蛇却从我烧尽的灰里立起，长出了我的脸。我再也找不回自己了——而这，才是我偷别人东西时，那人才真正尝到的痛楚。"}}]}},{"id":"6-6","title":"恶谋士与离间者","paragraphs":["来到第八道恶囊，沟中漆黑，没有人在里面行走，每一寸却都被火光填满。那火不是成片的，而是千百道长长的火舌，各自裹着一团灵魂。火焰贴着人形燃烧，像一件恰好合身的火衣；人在火中，不到近前，几乎看不出身形。维吉尔望着一道火光说：“那里面有奥德修斯与狄俄墨得斯，他们合谋用一匹木马，骗开了友邦的城门；这火焰里一具裹着两个灵魂，正是因为他们的恶计，从来是两个人合着做的。”又指向另一道：“那是圭多·达·蒙特费尔特罗，一位智者。他把智慧拿去为一己算计出谋划策，到头来，也把自己烧成了一个只会算计的火团。”","我望着那些吞没灵魂的火，心里却翻涌起一种近乎赞叹的热忱。那是何等精妙的心机，何等算无遗策的谋划——一群人的生死、一座城的存亡，都被玩弄于股掌之间，连那样的智慧中人也要服膺。我忍不住对维吉尔说：“这样的聪明，难道不值得称道么？若没有这点本事，他如何能从刀光剑影里全身而退。”","“聪明本身是好的。”维吉尔说，“但才智，是上天点亮来照见真理的，不是拿来焚毁世人、更不是焚毁自己的。一个人把心思全用在算计朋友、算计无辜、算计如何占尽上风上，那火焰便成了他的牢笼；他越想越聪明，那火便烧得越旺，直到把他也烧成一个只会算计、别无其他的空壳。你看那火，亮得耀眼，却也不过是烧着自己的一点光罢了——它照亮了别人的路，可它自己，只剩一截焦炭。”","我们前行到第九道恶囊。一片黑暗中，一个巨大的身影在山谷间来回冲撞，手中挥着一柄长剑，把沟里的灵魂劈开又愈合、愈合再劈开，像一道永远缝不上的伤口。被斩的，都是挑拨离间之徒——他们生前把骨肉之情挑断、把同道的信义撕碎、把本应相连的人们生生拆成两半，如今便也被人一分为二，再也拼拢不起来。维吉尔低声说，那其间也有穆罕默德——凭一己之言撕开同源信仰的人物；你只需记住这句话：用舌头把本是同源的人们劈开，比用刀剑更割肉。","走出第九道恶囊，我仍觉得那一口凉气哽在喉间。先前我几乎要为那精妙的算计叫好，此刻却只觉得脊背发冷：原来聪明用对了地方，是烛火；用错了地方，便是牢笼，是刀，是一道把人心劈开的缝。我望着远方，问自己——那算计的本事，究竟该叫人钦佩，还是该叫人警醒？它亮着、转着，看得人心动，可它烧掉的，又是谁呢？"],"choice":{"prompt":"谋略越聪明，用来作恶就越值得钦佩吗？","options":[{"text":"才智应照亮而非焚毁，聪明作恶最卑劣","to":"6-7"},{"text":"能算到人心、设下妙计，本身就是本事","end":{"kind":"灵魂沉沦","title":"被自己的火舌包裹","text":"我说，能算尽人心、设下妙计，本身就是本事。话音未落，我脚下窜起一道火光，贴着我的人形烧成一团。那火不灼我的皮肉，却灼我的心，卷着我那些自以为得意的算计，一层层烧成灰烬。我想冲出去，却发现越动脑筋，那火便裹得越紧——原来我引以为傲的心机，恰是这团火本身。我终于懂得维吉尔的话：才智用来照亮，是灯；用来算计作恶，便是把自己也封进去的牢笼。聪明越多，火越旺，而我再也算不出一条逃出去的路。"}}]}},{"id":"6-7","title":"离圈之悟","paragraphs":["走到第八圈的尽头，脚下又是一道陡直的岩壁，往下便是通往最后一圈的窄路。我没有急着下，而是回过头去，久久地望着身后那片由十道恶囊铺展成的深谷。风从谷底翻上来，带着火、油与腥泥的气味，我站在那气味里，忽然把这一路见过的东西，一件件从头到脚地想了起来——从这一道上头，我看到了一种缓慢的、几乎不易察觉的坠落。","那诚实的脸与毒尾，那被鞭驱赶的甜言蜜语者，那泡在粪污里的谄媚，那脚底烧着火的贪权者，那道拧到背后的眼神，那滚烫的黑油，那镀金的铅衣，那人与蛇互换的躯体，那裹着算计燃烧的火舌，那被剑劈开又愈合的人——他们没有一个真正动过手，可他们的每一个念头，都比血河里的刀剑更致命。刀剑砍的是人，而这些，砍的是人与人之间的那根绳子。我忽然明白过来，喉咙发紧。","“暴力伤的，是皮肉；欺诈伤的，却是人心。”维吉尔站在我身旁，声音很轻，“野兽也懂得撕咬，可野兽不会守约，不会说谎，不会把别人交付的信任拿来回本。人之所以为人，正是因为人愿意相信人。欺诈，偏偏把这根连系着千万人的绳子，一刀一刀地割断了——”他顿了顿，“它背叛的，不是某一个人，而是人类彼此依靠的那一点起码的信。这，正是它比野兽更卑劣的地方。”","我低着头，心里翻涌着我自己的那些小小的不诚——那些为转圜顺口说出的好话，那些怕得罪人而咽下的真话，那些在权衡里悄悄算过的小聪明。原来我离这个深渊，只隔着一句“无伤大雅”。我原以为诚实只是不撒谎，如今才渐渐懂得，诚实是肯把心放平，是肯让语言与真心站到一边，是即便因此吃亏，也要对得起那个信我的人。我又想起这一路看过的那一张张脸，他们起初也都觉得自己只是聪明些、圆滑些、会来事些罢了——可正是这一个个“一点点”，一点点地把人和人之间那点信任，啃成了我脚下的深渊。","我抬起头，望着维吉尔，把这番话在心里默默打磨了一遍，终究只说出一句：“请您引我往下走。从今往后，我愿把这副才智用在本分，用在守信，用在于昏暗里照见人心上，绝不再拿它去算计一个肯信我的人。”维吉尔缓缓点头：“能为自己羞耻的心，是这地狱里唯一还活着的东西。守住它，别把它也烧了。”"],"choice":{"prompt":"往后与人周旋，那点“无伤大雅”的假话，还留么？","options":[{"text":"不留。正直，才配得上这份才智","to":"7-1"},{"text":"说几句好话圆场，原也算不得作恶","end":{"kind":"灵魂沉沦","title":"自欺的深渊","text":"我说，逢场作戏说几句好话，算什么作恶。可就在我抬脚欲走的那一刻，一件金灿灿的东西落在我肩头——我以为那是件风光的外衣，它却越来越沉，压得我弯下腰去。我低头看去，那层金褪了色，露出底下的铅。我想张嘴为自己辩解，吐出来的却是一团黏腻的泥水。我这才恍惚想起，我方才那声“无伤大雅”，不正是这一路上我看不起的伪善者与谄媚者们的腔调么？原来，那些被我推得最远的人，正是我自己。"}}]}}]},{"chapter":7,"circle":"第九圈 · 背叛（科奇图斯寒冰之湖）","title":"第七章 · 寒冰 · 背叛","subtitle":"最深的罪，是辜负信任","nodes":[{"id":"7-1","title":"巨人的深井","paragraphs":["一行人中，我走在维吉尔身侧，脚下的岩石忽然变得开阔起来。那不再是一条窄路，而是一整圈巨大的环形洼地，仿佛一口通往地心深处的枯井；井壁陡峭而下，消失在浓稠得化不开的黑暗里。我试着朝井底望去，却只看见一层叠着一层的黑，深到连目光都探不到底；那黑暗像是有了重量，沉沉地压着，仿佛这口井没有尽头，只有更深的寒被一点一点藏在那看不见的下方。空气里有一种奇怪的压迫感，像是有什么东西隔着很远，正用低沉的呼吸压迫着我的耳骨，连脚下坚硬的石都仿佛在这呼吸里微微颤抖。我正要探头张望，却听见一阵低沉得令人骨头发麻的声响——不是雷，不是风，而是一声一声、沉重而缓慢的喘息，像整座山都在缓缓翻身。","借着昏黄的光，我看见了井缘处几尊几乎不敢相信的形体。那是巨人，真正的巨人。他们比我记忆里最高的塔楼还要高出数倍，粗壮的手臂被铁链牢牢束缚在井壁之上，只有胸膛与头颅能勉强转动，金属碰撞的冷响混在他们的呼吸里。其中一个是宁录——那个妄图建造通天之塔、令神搅乱人类言语的王；还有提堤俄斯、布里阿柔斯……他们每一个都是“力量”的化身，虽拥有足以撼动山岳的筋骨，却一个个被钉在这地狱的最边缘。他们有的怒目而吼，有的颓然垂首，仿佛在向每一个仰望者提醒：凡妄自尊大者，终将沦为自己野心的囚徒，越是曾经不可一世，越是如今动弹不得。","维吉尔低声对我说：“这便是狂妄的下场。他们曾以力量俯视诸天，甚至甘愿为一己之名而冒犯神明，如今却被自己的力量永远困住。身体再庞大，也撑不起一颗虚妄的心。”就在这时，一个未被完全锁住的巨人——安泰俄斯——缓缓低下头，他的瞳孔像两轮暗夜里的月亮。维吉尔上前，用我并不完全听得懂的言辞恳请他弯下身躯，载我们下到湖底。巨人沉吟片刻，竟真的俯下身来，伸出比船舷还要宽的手掌，掌心那道道沟壑深得像河谷，仿佛能盛下一整片海。","我看着他掌心那道道沟壑，心头一阵发冷：若是他稍有恶意，只消轻轻一握，我和我的导师便要在这漆黑的井里永眠。恐惧攫住了我。这样庞大的存在，这样不可测的深，每一步都踩在真实的危险上。我几乎想要转身逃回这个早已不属于我们的上层，仿佛只要回头，就还能回到那个尚且熟悉的世界。可维吉尔的目光坚定如石：“不要被形体吓住。真正强大的，从来不是尺寸，而是能够驾驭它的心智与德行。心若清明，再深的井也不过是一条路。”我深吸一口气，把那股想逃的冲动，一点点按回心底。","我试着把目光从那些有形的身躯上移开，去看井壁上一道道被磨得光滑的旧痕。那不是天生的纹路，而是无数个世纪里，被链锁勒过、被挣扎磨过的印记；有的地方甚至泛着一点被体温焐热的暗光，仿佛曾有人在这里死死攥住过什么，终究还是松了手。我忽然明白，这口井并不只关着巨人——它还关着每一种“以为可以凭自己挺立”的骄傲。我紧了紧衣袍，把这点念头收进心里：骄傲一旦被上了铁链，便再也不是力量，而只是一副搬不动的枷锁。深井之下、黑暗之上，能依靠的从来不是蛮勇，而是一颗肯低头看清自己的心。"],"choice":{"prompt":"面对巨人的庞大与深井的黑暗，你想……","options":[{"text":"握紧师者的手，继续下行。","to":"7-2"},{"text":"被恐惧压垮，转身逃离。","end":{"kind":"灵魂沉沦","title":"回不去的来路","text":"我转身便逃，可这深井之上并无回头路。黑暗像潮水般倒灌，我的双腿陷进突然冻裂的岩缝里，再也无力拔出。安泰俄斯没有追我，只发出一声沉重的叹息，仿佛在说：连一眼深渊都不敢正视的人，便只配永远活在深渊的影子里。寒气从脚底一寸寸爬上心口，把我的念头冻成一团硬冰——我永远留在了通向第九圈的路上，没人再为我引路。"}}]}},{"id":"7-2","title":"寒冰之湖","paragraphs":["安泰俄斯把我们轻轻放在一片坚实的地面上，便又缓缓直起那山岳般的身躯，渐渐隐没在身后的黑暗里。我抬眼望去，顿时被眼前的景象钉在了原地。前方不再是石与火，而是一望无际的冰湖——科奇图斯，地狱的最深处。那不是寻常的冰，是一整片凝固的水域，清冷、透明，像一块巨大的水晶，把黑暗也一并冻在里面。湖面平整得没有一丝波纹，一直延伸到天边，仿佛连天与地之间的边界，都被这片冷抹平了。空气里没有一丝风，寒意却顺着每一寸皮肤钻进来，安静得能听见自己心跳的回响，还有血液在血管里流动的细微声响。","我低下头，才发现这冰里冻着人。一个人，又一个人，层层叠叠地封在透明的冰层之中。他们的头发结满霜白，身体以各种姿态凝固，有的面孔朝下，仿佛在羞愧地回避，有的深深没入冰底，只剩一截模糊的影子。我伏下身子，贴着冰面细看，那些脸的轮廓隐隐约约，像沉在湖底的旧影，被岁月磨得只剩一点痕迹。维吉尔说，越往里、罪越深的，冻得越严实——到最后会整个人嵌进冰里，连一根手指都动弹不得。背叛祖国的，背叛亲族的，背叛主人的，背叛恩人的……凡是把一份信任辜负到底的，都被送到这片最冷的地方，冷到连悔恨都凝结成晶体，冷到他们再也不能伸出手。","望着这一片寂静，我竟生出一丝荒唐的念头。这里如此死寂，如此“寒冷”，比起上层那些火海与泥沼，反倒像是某种安息之地。没有咆哮，没有挣扎，几乎看不出什么痛苦。我低声问维吉尔：“恶意若真是冰冷如斯，是不是反而没那么可怕？至少，他们已不再受苦了。”说话时，我甚至听见自己的语气里带着一点松懈——仿佛从这漫长地狱的喧闹里，终于找到一处可以喘息的角落；这里一片纯净、一片安静，反比那些火与泥要舒服得多。","维吉尔的目光穿过冰面落在我身上，带着一丝责备的温柔：“你错了。最冷的不是他们的身体，而是他们的心。背叛之人，生前早已把温度和信任一同冻结。这冰不是惩罚，是他们自己心的外化——他们已经无法再爱，也无法被爱。这样的冷，才是人间至冷。你可知道，地狱里最可怕的刑罚，不是痛，而是永远地、真切地感受不到任何温度？”我怔住了。原来最深的苦，不是疼痛，而是再也无法感受任何温度，像一盏被冻熄的灯，纵然灯芯犹存，也只剩下一层冷透的玻璃。","我望着湖面上那层恍若安宁的白，忽然打了个寒噤。方才那句“至少不再受苦了”的庆幸，此刻像一片薄冰贴在我胸口，凉得让我几乎叫出声来。原来“无痛”与“无感”之间，隔着天壤——痛，至少证明我还活着，还能爱、还能悔；而无感，却是连“在乎”的资格都一并失去。我于是明白，科奇图斯最可怕的地方，不是它冻住了这些人，而是它让他们彻底忘了还有“温度”这回事。我悄悄把“信任”两个字攥在手心，像攥着一点不肯融化的火种，生怕自己哪天也冷却成这湖里的一角寒冰。"],"choice":{"prompt":"对“恶意寒冷无妨”的念头，你决定……","options":[{"text":"默念“信任的温度不可辜负”。","to":"7-3"},{"text":"点点头，觉得“这种冷也挺清静”。","end":{"kind":"灵魂沉沦","title":"融化不掉的冷","text":"我这样想着，脚下的冰忽然变得柔软，像要把我吸进去。维吉尔一声惊呼，却已来不及拉我。冰层缓缓合拢，我的睫毛、额头、胸口相继织上霜花，连最后一丝“原来这样也挺好”的念头也被冻住。我开始后悔，可后悔也需要温度啊。在一片寂静的白里，我终于发现，自己成了科奇图斯的一部分——一个被心里那点冷漠，永远留在这里的人。"}}]}},{"id":"7-3","title":"卡伊纳之环","paragraphs":["维吉尔领着我，沿着冰湖的边缘向深处前行。他把这片广袤的白命名为“卡伊纳”——第一环，以背弃亲族的该隐为名。这里的冰凝得稍浅一些，被冻住的人大多只露出头颈，面孔朝下，垂在一小片冰洞之外，像一列列被遗忘的残烛。他们的眉发上缀满冰凌，一根根垂下来，在微光里细碎地闪，像一盏盏被雪掩埋的灯。我走过时，能听见极细微的“咯——咯——”声，并非言语，而是牙齿在寒冷中无力地碰撞，仿佛连闭嘴的力气都已被冻光，只剩下这断断续续的、无人听懂的呢喃。","忽然，我听见一阵近乎碎裂的撞击声，由远及近。两个头颅，在冰面上狠狠地撞在一起——一个撞向另一个，另一个又不甘示弱地撞回来，像是两座永远不肯停歇的钟，谁也不肯让谁。维吉尔说，那是亚历山德罗与拿破仑，一对亲兄弟。他们生前为争夺家产而互相算计、互相加害，用尽最亲密之人的信任，把血亲变成了仇敌；如今在这最深处，成了彼此的刑具，永远相对、永远相撞，永远无法和解，也永远无法停息。那一下一下的撞击，落在冰上，也落在我心上，像是替所有被辜负的亲情，敲着一口沉闷的回音。","我看着那两个一次次撞得头破、又被冰封住的神情，心头掠过一丝寒意。血与血之间，最该同心的两个人，却把彼此当成了最大的仇敌。我不由自主地想：幸好不是我——幸好我的家中没有这样的明争暗斗。这种“见怪不怪”的庆幸，像一件薄衣，刚披上便结成了霜，贴着我的皮肤，凉凉的，却让我隐隐有些不自在。我甚至隐约觉得，这件薄衣底下，正遮着我不愿细看的东西；那种庆幸越是真切，我心里那份不安就越是清晰，仿佛有什么在说：你也在躲开一面镜子。","我正想让这份庆幸安然落地，维吉尔却仿佛看穿了我：“你以为你只是旁观？那两兄弟争的，是家产；而你曾为一份荣耀、一句闲话，与最亲近的人冷过脸、住了口——那是另一种形式的相撞，只是还没冻成冰罢了。多少回，你把该说的话咽回去，把该伸的手收回来，把最亲的人晾在一边，只因一时意气。卡伊纳的自责，从不问亲疏，只问你是否把血脉、把至亲，当成了敌人。”我沉默良久，那件庆幸的薄衣褪了下去，只留下一点微凉的、挥之不去的愧疚，像一根刺，扎在我与亲近之人之间。","我站在原地，不愿再往前走，只觉得脚踝一圈一圈地发凉。我曾以为，所谓的背叛，是唱词里那种惊天动地的阴谋；可此刻我忽然明白，更多时候它细小得几乎看不见——是一句冷话，一次沉默，一场赌气，把朝夕相处的人，一点点推到了冰的另一边。没有谁是一夜之间成了罪人的，都是这一寸、那一步，慢慢冻过来的。我在心里把这些念头一遍遍翻着，像是要赶在踏入更深处之前，先把自己身上的这座“小卡伊纳”看清、放下，才好继续往前走。"],"choice":{"prompt":"面对“见怪不怪”的念头，你选择……","options":[{"text":"反思自己是否也曾薄待至亲。","to":"7-4"},{"text":"耸耸肩：“骨肉相残，与我何干。”","end":{"kind":"灵魂沉沦","title":"无动于衷的代价","text":"我耸耸肩，转身离开那对相撞的兄弟，心里想着“与我何干”。可这句话像开了个口子，冰冷的空气顺着它灌进我的胸腔。脚下的冰无声地抬升，没过我的小腿、腰腹。我这才慌了，努力想喊维吉尔，却发现连声音也被冻在半途。最后，我成了卡伊纳顶端一颗探出冰面的头颅，独自对着黑暗，与另一颗不相干的头颅遥遥相撞，麻木，却再没有一丝温度。"}}]}},{"id":"7-4","title":"安特诺拉之环","paragraphs":["再往里，冰层变得更硬、更冷，维吉尔称之为“安特诺拉”——背弃祖国的罪者所在。冰面上一片刺眼的净白，几乎没有杂色，我却远远看见两个身影，姿态异样地挤在一起。走近了才看清，那是一个人，一口咬住另一个人的后脑，直直地、死死地啃咬着，仿佛那是世上唯一能给予他力量的东西。被咬的那人一动不动，早已冻得僵直，连头都不曾偏转一点，任由那牙齿嵌进自己凝固的皮肉。两个人就这样纠缠在同一块冰里，像一尊永远不会完成的雕塑，被一个动作永远钉死。","维吉尔唤我上前询问。那咬人的罪者竟抬起头来——他叫乌格利诺，曾是比萨的领主；他嘴里咬着，是当年把他与子孙投入塔中的鲁杰里大主教。乌格利诺的声音像冰刃，一字一字刮过我的耳膜：“你若想知道我为何这般恨他——请想一想，我与他同处一室，我看着他，看着我那四个子女，一个接一个饿死在塔中……他们饿死了，我却还活着。你说，我还如何能忘？我恨不得把这份痛，原原本本地还给他，让他也尝一尝我咽过的那些日子。”说到后来，他的声音低了下去，像一根绷断的弦，在静里久久地颤。","我胸口像被什么东西狠狠攥住。那不是指责，不是单纯的怨恨——那是一种被剥夺到极限、连哭都哭不出来的痛。我几乎要被他那浓烈的恨意吞没，几乎要跟着咒骂那个背信的人，几乎要把“恨”当成这里唯一真实的东西，把它当作可以倚仗的怒火，仿佛附和了他，我就能替那座塔里的人出一口我从未受过的气。可就在愤怒即将脱口而出之际，我心底一个细微的声音轻轻问我：他若只是一个受害者，为何会在这背叛者之环？这盘终究输了的棋，他又究竟是如何亲手落子的？","维吉尔缓缓道：“乌格利诺是受害者，却也是背叛者。他把仇恨当作活下去的理由，宁愿永远咬住仇人不放，也不肯放掉自己的恨。他的罪，是他的恨把他也变成了囚徒——一个连恨都舍不得放下的灵魂，永远走不出那座塔。你怜悯他，也要看清他。真正的悲悯，是看清一个人的罪之后，仍愿意替他感到一丝痛。”我望着那张被仇恨冻住的脸，第一次明白：恨，可以比饿死人更冷，冷得连眼泪都早已结了冰。","我久久没有言语。乌格利诺的恨，是那样真实、那样烈，以至于它几乎可以原谅一切——因为它本来就是被撕碎之后，才结出的果实。可也正因如此，我才更清晰地看见：他其实把人生的最后一点东西，也献给了那个早已湮灭的过去。被辜负固然痛，可若把这痛牢牢攥成恨，便等于让加害者永远赢了第二次。我深吸一口气，把“恨”与“悲”在心里分作两处：恨是一口越养越冷的井，悲却是一点能照见他为什么会变成这样的光。我不想做那座塔里的人。"],"choice":{"prompt":"面对乌格利诺的恨与悲，你……","options":[{"text":"既悲其遭遇，也看清其自囚。","to":"7-5"},{"text":"被恨意淹没，同声咒骂鲁杰里。","end":{"kind":"灵魂沉沦","title":"恨到尽头无悲悯","text":"我跟着他一同咒骂，越骂越觉得痛快，仿佛替他出了一口气。咒骂声在冰面上回荡，我的声音却渐渐变了调——它变得陌生，变得像乌格利诺，像所有不肯放手的人。我低头，才发现自己也被封进了那座象征性的塔：四壁是冰，头顶是无光的雪。我把恨当成了食物，可它越嚼越空，我终于也成了一个咬住仇人、再也说不出半句“我原谅”的人。"}}]}},{"id":"7-5","title":"托勒密之环","paragraphs":["我们继续前行，来到第三个环——“托勒密”，以背弃客人之谊而得名。与之前的冰环不同，这里的罪者大多仰面朝上，面孔正对着我和维吉尔，仿佛还在等待什么人来访，等一场永远不会到来的道歉。可他们的脸却比任何地方都要僵硬，像一张张被冻住的面具，五官被冰封得纹丝不动。我更仔细地看，才发现他们的眼睛蒙着一层薄薄的、冰亮的膜，像结了一层水汽的窗，透着一种永远也流不出悲凉的、透明的光。他们静静望着上方，仿佛整个地狱里，只有他们还惦记着“被原谅”这件事。","维吉尔指着其中一个说：“你看他的眼眶。他不是死后才这样，而是——他还想哭。他生前背叛了宾主之谊，伤害了善待他的主人与朋友；如今心中有悔，眼泪涌上来，却在眼眶里冻住了，结成冰罩，再也流不出来。一个连哭都哭不出的人，才是哭得最厉害的人。”我望着那层薄冰，仿佛能看见里面凝固着的一点湿意——正是它，让这张冷得刺骨的脸，透出了人间最深的一种哀戚，静默到没有声音。那不是嚎啕，而是被堵死在胸口、永远无法释出的东西。","我盯着那一双双结冰的眼睛，忽然想到自己。我曾多少次，在察觉到别人待我以真诚时，用辜负去回敬；在别人把自己的屋檐、善意、信任递给我时，我转身把它当成阶梯或是玩笑。那时我总觉得，诺言与情谊是轻的，转眼就能抹去；重的东西是利益，是体面，是与我无关的路人。失信于一个客人、一个朋友，又有什么要紧？可它真的要紧——只是要等到结冰的那一天，我才明白，原来我曾这么轻易地，把别人捧给我的真心，随手丢在了地上。","维吉尔的声音平静地落下来：“情谊是人间最脆弱的易碎品，也是最珍贵的礼物——因为它是自愿的、不求回报的。你辜负它，剥夺的其实不是对方，而是你自己心里那份能亲近人的能力。托勒密环的罚，不是让人痛苦，而是让人彻底失去‘哭’的能力——连悔恨都注定要冻死在眼眶里。”我打了一个寒噤。从这一刻起，我告诫自己：不要轻易接住一份善意，更不要轻易辜负它，因为有些东西，辜负一次，就再也补不回来。","我望着那些仰面却流不出泪的脸，突然对“礼貌”与“客套”生出了新的敬畏。原来人与人之间，最不该轻慢的，恰恰是那些看似“不必当真”的善意——一顿饭，一间屋，一次相托，一句承诺。它们之所以珍贵，正因为都是不设防的、自愿交出来的。我也想起，自己有多少次把“谢谢”说得很轻，把别人的好当作理所当然。在托勒密环的这一角，我终于明白：那些你随手抛掉的诚意，其实正是一个人在这个世界上，所能给出的、最柔软也最难得的东西。"],"choice":{"prompt":"对“待客失信也无妨”的想法，你……","options":[{"text":"暗自立誓，珍视每一份情谊。","to":"7-6"},{"text":"觉得“那不过小事一桩”。","end":{"kind":"灵魂沉沦","title":"哭不出来的悔","text":"我轻描淡写地说了句“小事一桩”，转身便走。冰面忽然变得极滑，我仰面倒下，后脑结结实实地撞在冰上。一股温热涌上眼眶——那是悔恨，来得比想象中快得多。可就在它要溢出的刹那，一层薄冰封住了我的眼睛。我拼命地想哭，泪水却只能在冰罩后面打转，冰凉地贴着我的眼球。我终于明白：有些信任，辜负一次，就再也哭不回来了。"}}]}},{"id":"7-6","title":"犹大之环 · 卢西法","paragraphs":["越往里，那冷越不是我所能描述的。那不再是皮肤的冷，而是一种渗透进骨头、让人连思绪都快要凝住的白。维吉尔说，这是第四个环——“犹大”，以出卖主的叛徒犹大为名。这里是地狱真正的心底，背叛恩主者被整个冻进冰里，连头颈、指尖都不例外，只留下冻得透亮的轮廓，像一尊尊嵌在冰里的、不再有生命的雕像，连脸也被磨得干干净净。没有声音，没有任何动静，除了一个方向——湖泊的正中央。","我顺着那个方向望去，浑身顿时凝固。那里立着一个庞大得难以名状的身影——卢西法，堕天的撒旦。他三张脸朝向不同的方向，六只巨翼在这无风的冰湖上不停扇动，每一下都扇出让我骨髓结冰的阴风，仿佛要把整个地狱的寒气，都汇成一股吹进这片湖里，才冻得住这最深的罪。而他的三张嘴里，各衔着一个背叛恩主的人：犹大、布鲁图斯、卡西乌斯。他在啃噬，永不休止，仿佛要把“恩将仇报”这四个字，永远嚼在嘴里，嚼不烂，也吐不出。","我的目光钉在那三张被撕咬的脸上。我忽然发现，自己心里竟升起一丝异样的熟悉：那三个出卖者所做的事——为了利益、为了权势、为了一个名字能被永远记住，把对自己最好的人推入深渊——我仿佛也在什么地方、什么事上，见过它们的影子。甚至，我曾为自己身上的某些念头，生出过“若是不得不如此”的借口。这熟悉感令我震颤，也令我羞愧，像是有什么东西正从黑暗里，隔着冰，朝我默默点头。","维吉尔缓缓开口：“卢西法原是天使中最美的，却因傲慢沦为此刻的怪物。你不必因为能看到自己的影子而生出认同——那正是它的用意。看清它，是为了不成为它；承认自己心里有恶的种子，是为了亲手除掉它。最深的恶，从不在你看不见的地方，而恰恰在你觉得‘似曾相识’的瞬间，转过身来。”我低下头，把那份危险的熟悉与认同，轻轻放在脚下，像是放下一件烫手的、本不该握住的东西，心里却留下一点凉。","我却忍不住又抬头，想看得更清楚些。那六只翅膀每扇一下，我胸口的凉意便深一分；可同时，我也隐隐觉得，这股寒意里有一点说不清的醒意——它逼着我承认，我并不是与那三个人毫无关系，我身上也藏着一模一样的“为了什么而背叛”的种子。正是这一点醒意，让我没有再往后退。我把手按在胸口，对自己说：我不是他们，可若我想保证自己不是他们，就得先敢看这面镜子。这一眼，比上界所有的火焰，都更叫我清醒。"],"choice":{"prompt":"面对“似曾相识”的黑暗，你……","options":[{"text":"警醒自省，拒绝成为它。","to":"7-7"},{"text":"暗自承认：“我或许也做得出。”","end":{"kind":"灵魂沉沦","title":"心底的犹大环","text":"我在心里轻轻应了一声“或许我也做得出”。那本是一句轻如微尘的自嘲，却在冰湖中央激起回响。卢西法的六翼猛地一合，我脚下凝出新的冰，把我一步步推向那三张啃噬的嘴。我挣扎着，却发现心里的那声“认同”已化作锁链。最后，我在冰中逐渐透明，成了犹大环里新的一员——不是因为做了什么，而是因为在深渊底端，我真的把自己认成了它。"}}]}},{"id":"7-7","title":"直面卢西法与脱出地狱","paragraphs":["维吉尔一把握住我的手：“时候到了。要离开地狱，唯一的路，是穿过卢西法的身体，越过这个世界的心底。”我望着那庞然巨影，几乎不敢相信。可我的导师已攀上卢西法背侧的蓬乱毛发，如同一艘小船泊上了巨岩，稳稳地站定。我跟着他，从卢西法的躯干扶摇而下，越过它的腰、它的腿，一直落到最深、最冷的所在——地球的正中心。那里没有天，没有地，只有一种奇异的、仿佛一切都静止了的寂静，连时间都像被冻住了。","在那里，维吉尔与我转身，攀上一条与我们来时相反的道路。我们穿过岩石与黑暗，天穹在我们身后一点点翻转，像一枚被缓缓转过来的硬币。终于，我的眼睛重新触到了一点点不一样的光——是星星。我以为自己还在梦中，狠狠眨了眨眼，随即又看见一束更淡、更暖的光，从远处的地平线漫开。是黎明。是久违的、属于人间的黎明。我几乎要落下泪来，那是我第一次觉得，光明原来是那么柔软的东西。","我站在陌生的土地上，仰望着那片我几乎已经忘记的星空，久久说不出话。维吉尔的声音第一次带上温度：“走完地狱，你恨过，怕过，也怜悯过。现在你明白了——这一路的审判，不是为了宣泄，也不是为了让你看别人的罪。它是要你走到深渊的最底，亲手触碰自己心里的恶；而在这最低处，你才听得见更高处的召唤。你若只是学会了恨，这趟路便白走了；你若懂得了自省，才不枉此行。”","我闭上眼睛。乌格利诺放不下的恨、托勒密环那哭不出的泪、卢西法嘴里那三张被嚼碎的脸……它们不再是别人的故事，而是我灵魂里一个个被照亮的角落。“我身上的罪，与世人皆有的罪，本是一体。”我轻轻说出这句话，心里那座沉重的山竟松动了，像是被黎明的一点光慢慢化开，又像有什么东西在心底重新点了火。我抬起头，迎着黎明的光，一步一步向山顶走去。地狱在身后合拢，而前方，还有一段更高的路，等着我去走。希望，从这里升起。","我走出一段，又忍不住回头望了一眼。那口深不见底的井，那座封着万千冰躯的湖，已经缩成了地平线下一道隐约的白。原来所有被辜负过的信任，所有被冻住的悔恨，都不是白白存在——它们让我彻底看清，什么叫“珍贵”。可如今它们都留在了身后，而此刻我脚边透着暖意的，是草、是土，是再寻常不过的人间。我深深吸了一口清晨的空气，把目光投向更高处。前面或许还有另一座山、另一道坡，但我知道，只要记得这一路的冷与光，我就不必再怕。黎明已至。"],"choice":{"prompt":"在地狱的最低处，你终于……","options":[{"text":"向黎明与希望，迈出脚步。","to":"END"},{"text":"被这深渊震慑，不敢再向前。","end":{"kind":"灵魂沉沦","title":"钉在最低处的魂","text":"我望着那片黎明，却觉得它太过遥远，远得令我胆怯。我停下，蹲在原地，只觉得地狱虽然可怕，好歹是我熟悉的。就在我低头的这一瞬，一道寒冷的阴影从身后罩来，卢西法的三张脸微微侧过，其中一张嘴里仍嚼着不散的恩义。我的脚踝结上不易察觉的冰。我始终没能迈出那一步，永远留在了最深的犹大环顶，望得见光，却再也走不出去。"}}]}}]}];   // [ {chapter,circle,title,subtitle,nodes:[{id,title,paragraphs,choice}]} ]
