const TERRAIN_COLORS = ["#1b3a5c", "#7aa05a", "#2f6b3a", "#8d7b52", "#d9c17a", "#8a8a8a"];
const SETTLEMENT_COLORS = ["#e6194b", "#3cb44b", "#ffe119", "#4363d8", "#f58231", "#911eb4", "#46f0f0", "#f032e6", "#bcf60c", "#fabebe", "#008080", "#e6beff", "#9a6324", "#fffac8", "#800000", "#aaffc3", "#808000", "#ffd8b1", "#000075", "#808080"];
const W = DATA.width, H = DATA.height;
const frames = DATA.frames, metrics = DATA.metrics;
const cv = document.getElementById('world'), cx = cv.getContext('2d');
const chart = document.getElementById('chart'), cc = chart.getContext('2d');
const slide = document.getElementById('slider'), playBtn = document.getElementById('play');
const speedSel = document.getElementById('speed'), tlabel = document.getElementById('tlabel');
const statsEl = document.getElementById('stats'), tickEl = document.getElementById('tick');
const legendEl = document.getElementById('legend');
const cw = cv.width / W, ch = cv.height / H;
let bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
const bx = bg.getContext('2d');

function drawTerrain(){
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const c = TERRAIN_COLORS[DATA.terrain[y][x]] || '#000';
    bx.fillStyle = c; bx.fillRect(x*cw, y*ch, Math.ceil(cw), Math.ceil(ch));
  }
}
function metricAt(tick){
  let best = metrics[0];
  for(const m of metrics){ if(m.tick <= tick) best = m; else break; }
  return best;
}
function drawFrame(i){
  const f = frames[i];
  cx.drawImage(bg, 0, 0);
  // settlements
  for(const s of f.s){
    cx.strokeStyle = SETTLEMENT_COLORS[s[3] % SETTLEMENT_COLORS.length];
    cx.globalAlpha = 0.75; cx.lineWidth = 2;
    cx.beginPath(); cx.arc((s[0]+0.5)*cw, (s[1]+0.5)*ch, Math.max(6, Math.sqrt(s[2])*3.2), 0, Math.PI*2); cx.stroke();
    cx.globalAlpha = 1;
  }
  // agents
  for(const a of f.a){
    const sid = a[3], rel = a[2];
    cx.fillStyle = sid > 0 ? SETTLEMENT_COLORS[sid % SETTLEMENT_COLORS.length]
                           : ['#ffffff','#ffd166','#06d6a0','#ef476f'][rel % 4];
    const r = 1.6 + Math.min(2.4, a[4]*0.28);
    cx.beginPath(); cx.arc((a[0]+0.5)*cw, (a[1]+0.5)*ch, r, 0, Math.PI*2); cx.fill();
  }
  const m = metricAt(f.t);
  tickEl.textContent = f.t + '  (' + f.season + ')';
  tlabel.textContent = '第 ' + f.t + ' tick · ' + f.season + ' · 人口 ' + m.population;
  const rows = [
    ['人口', m.population], ['出生/区间', m.births], ['死亡/区间', m.deaths],
    ['饿死', m.starvation_deaths], ['冲突死亡', m.conflict_deaths],
    ['贸易', m.trades], ['攻击', m.attacks], ['背叛', m.betrayals],
    ['结盟', m.alliances], ['战争', m.wars],
    ['平均科技', m.mean_tech], ['最高科技', m.max_tech],
    ['聚落数', m.settlements], ['最大聚落', m.largest_settlement],
    ['财富基尼', m.gini_wealth], ['平均合作', m.mean_cooperation],
    ['平均攻击性', m.mean_aggression], ['文化多样性', m.culture_diversity],
    ['世界食物', m.world_food], ['灾难次数', m.disasters]
  ];
  statsEl.innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
}
function drawChart(cursor){
  cc.clearRect(0,0,chart.width,chart.height);
  const pops = metrics.map(m=>m.population); const mx = Math.max(1, ...pops);
  const n = pops.length; const W2 = chart.width, H2 = chart.height;
  cc.strokeStyle = '#30363d'; cc.beginPath(); cc.moveTo(0,H2-1); cc.lineTo(W2,H2-1); cc.stroke();
  cc.strokeStyle = '#58a6ff'; cc.lineWidth = 1.6; cc.beginPath();
  pops.forEach((p,i)=>{ const x = i/(n-1||1)*W2, y = H2 - p/mx*(H2-6) - 3;
    i? cc.lineTo(x,y) : cc.moveTo(x,y); });
  cc.stroke();
  if(cursor !== undefined){
    const x = cursor/(n-1||1)*W2;
    cc.strokeStyle = '#f0883e'; cc.lineWidth = 1; cc.beginPath(); cc.moveTo(x,0); cc.lineTo(x,H2); cc.stroke();
  }
}
chart.addEventListener('click', e => {
  const r = chart.getBoundingClientRect();
  const frac = (e.clientX - r.left) / r.width;
  setFrame(Math.round(frac * (frames.length-1)));
});
let idx = 0, timer = null;
function setFrame(i){
  idx = Math.max(0, Math.min(frames.length-1, i));
  slide.value = idx; drawFrame(idx); drawChart(idx);
}
function stop(){ if(timer){ clearInterval(timer); timer = null; playBtn.textContent = '▶ 播放'; } }
function play(){
  if(timer) return stop();
  playBtn.textContent = '⏸ 暂停';
  const sp = parseInt(speedSel.value, 10);
  timer = setInterval(()=>{ if(idx >= frames.length-1) return stop(); setFrame(idx+1); }, 240/sp);
}
playBtn.addEventListener('click', play);
slide.addEventListener('input', ()=>{ stop(); setFrame(parseInt(slide.value,10)); });
legendEl.innerHTML = '<span class="chip"><span class="dot" style="background:#58a6ff"></span>按聚落着色（无聚落者按信仰着色）</span>'
  + '<span class="chip"><span class="dot" style="background:#3cb44b"></span>聚落圈大小 = 人口</span>'
  + '<span class="chip">点越小 = 科技越低</span>';
drawTerrain();
setFrame(0);
</script>
