<style>
/* ============================================================

:root{

.tb:hover{background:rgba(201,162,90,.15)}

aside,section{background:var(--panel);border:1px solid #4a3a20;padding:14px 16px}

.tabs{margin-bottom:10px}

.tabs button.on{background:rgba(201,162,90,.18);color:var(--gold2);border-color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.clue{border:1px solid #4a3a20;background:var(--panel2);padding:10px;cursor:pointer;transition:.15s;position:relative}
.clue:hover{border-color:var(--gold2);transform:translateY(-2px)}
.clue .tag{font-size:11px;letter-spacing:2px;color:var(--gold);display:block;margin-bottom:6px}
.clue .ct{font-size:14px;color:var(--ink);line-height:1.5;margin-bottom:6px}

.clue.key{border-color:var(--gold2);box-shadow:0 0 12px rgba(201,162,90,.25)}

/* ============================================================

/*__CORE_START__*/
/** 组合标准化：去掉重复、排序，返回 '+' 连接键 */
function coreKey(ids){
  return Array.from(new Set(ids)).sort().join('+');
}
/** 检查一组线索是否命中推理矩阵。
 *  返回 { hit:true, ded }（命中）或 { hit:false, wrong:true }（错误推论） */
function coreCheckCombo(ids, D){
  const key = coreKey(ids);
  for(const d of D.DEDUCTIONS){
    for(const c of d.combos){
      if(coreKey(c) === key) return { hit:true, ded:d };
    }
  }
  return { hit:false, wrong:true };
}
/** 是否已集齐全部关键结论 */
function coreHasAllKeys(owned, D){
  const want = D.DEDUCTIONS.filter(d=>d.key).length;
  let have = 0;
  for(const d of D.DEDUCTIONS) if(d.key && owned.includes(d.id)) have++;
  return have >= want;
}
/** 指控判定：
 *  owned 为已获结论 id 数组；返回 { result:'win'|'insufficient'|'wrong', suspect } */
function coreAccuse(suspectId, owned, D){
  const right = D.ACCUSE_WIN.suspect;
  if(!coreHasAllKeys(owned, D)) return { result:'insufficient', suspect:suspectId };
  if(suspectId !== right) return { result:'wrong', suspect:suspectId };
  return { result:'win', suspect:suspectId };
}
/** 存档序列化（只含推理进度） */
function coreSerialize(st, D){
  return JSON.stringify({ v:1, owned:st.owned, basket:st.basket, mistakes:st.mistakes, won:st.won, lost:st.lost });
}
/** 读档反序列化；非法/旧版本返回 null */
function coreDeserialize(raw, D){
  try{
    const o = JSON.parse(raw);
    if(!o || o.v !== 1) return null;
    if(!Array.isArray(o.owned) || !Array.isArray(o.basket)) return null;
    return { owned:o.owned, basket:o.basket, mistakes:o.mistakes||0, won:!!o.won, lost:!!o.lost };
  }catch{ return null; }
}
/*__CORE_END__*/

/* ============================================================
   DOM 层（游戏交互）
   ============================================================ */
const D = __DATA__;
const $ = s => document.querySelector(s);
const SAVE_KEY = "foglamp_case_v1";

/* ---- 运行时状态 ---- */
let st = { owned:[], basket:[], mistakes:0, won:false, lost:false };
let tab = "证词";               // 当前标签页：证词/物证/结论

/* ---- 工具 ---- */
function log(text, cls){
  const p = document.createElement("p");
  if(cls) p.className = cls;
  p.textContent = text;
  $("#log").appendChild(p);
  $("#log").scrollTop = 1e5;
}
function byId(id){ return D.CLUES.concat(D.DEDUCTIONS.map(d=>({ ...d, kind:"结论", speaker:"推理所得", text:d.text }))).find(c=>c.id===id); }
function permutKey(ids){ return coreKey(ids); }

/* ---- 谜面初始化：所有结论卡不发放，初始只显示证词/物证 ---- */
function visibleClues(){
  if(tab === "结论") return D.DEDUCTIONS.filter(d=>st.owned.includes(d.id));
  return D.CLUES.filter(c=>c.kind === tab);
}

/* ---- 渲染：嫌疑人卡 ---- */
function renderSuspects(){
  const box = $("#suspects"); box.innerHTML = "";
  for(const s of D.SUSPECTS){
    const d = document.createElement("div"); d.className = "sus";
    d.innerHTML = `<h3>${s.name}</h3><div class="role">${s.role}</div><p>${s.brief}</p>`;
    const b = document.createElement("button");
    b.textContent = "⚖ 指控此人";
    b.onclick = () => accuse(s.id, s.name);
    d.appendChild(b);
    box.appendChild(d);
  }
}

/* ---- 渲染：线索卡 ---- */
function renderCards(){
  const box = $("#cards"); box.innerHTML = "";
  for(const c of visibleClues()){
    const d = document.createElement("div");
    d.className = "clue" + (st.owned.includes(c.id) ? " own" : "");
    if(c.key) d.className += " key";
    if(st.basket.includes(c.id)) d.className += " pick";
    const tag = c.kind === "结论" ? (c.key ? "★ 关键" : "○ 结论") : c.kind;
    d.innerHTML = `<span class="tag">${tag} · ${c.speaker}</span>
      <div class="ct">${c.icon ? c.icon + " " : ""}${c.title}</div>
      <div class="cs">${c.text}</div>` + (st.basket.includes(c.id) ? '<span class="rm">✕</span>' : "");
    d.onclick = () => { 
      if(st.basket.includes(c.id)){ st.basket = st.basket.filter(x=>x!==c.id); }
      else if(!st.owned.includes(c.id) || c.kind === "结论"){
        if(st.basket.length >= 3){ note("推理台已满（最多 3 张）——先清空或移除一张。"); return; }
        if(!st.basket.includes(c.id)) st.basket.push(c.id);
      }
      renderBasket(); renderCards(); autosave();
    };
    box.appendChild(d);
  }
}
function note(t){ $("#desk-note").textContent = t; }
function renderBasket(){
  const box = $("#basket"); box.innerHTML = "";
  for(let i=0;i<3;i++){
    const s = document.createElement("div");
    const id = st.basket[i];
    s.className = "slot" + (id ? " on" : "");
    s.textContent = id ? byId(id).title : (i === 0 ? "点选第一张…" : "（空）");
    box.appendChild(s);
  }
  note(st.basket.length === 3 ? "组合就绪——点「组合推理」。" : `已选 ${st.basket.length} / 3。`);
}

/* ---- 推理：核心调用 + DOM 结果 ---- */
function reason(){
  if(st.basket.length < 2){ log("至少放入 2 张线索卡才能推理。", "bad"); return; }
  const res = coreCheckCombo(st.basket, D);
  if(res.hit){
    const d = res.ded;
    if(!st.owned.includes(d.id)) st.owned.push(d.id);
    st.basket = [];
    log(`【推理成立】${d.icon} 得到结论《${d.title}》：${d.text}`, "good");
    if(d.herring) log("（干扰线：记档案，别用来指控。）", "meta");
    if(d.key) log(`关键线索 ★ ${countKeys()}/4——集齐即可指控！`, "good");
    openModal({
      title: d.icon + " 新线索成立：" + d.title,
      body: `<div class="who">${d.herring ? "○ 干扰线 · 存疑" : d.key ? "★ 关键结论" : "○ 支持性结论"}</div><p>${d.text}</p>`,
      btn: "收入档案",
    });
  } else {
    st.mistakes++;
    st.basket = [];
    const t = D.WRONG_POOL[(st.mistakes - 1) % D.WRONG_POOL.length];
    log(`【错误推论】${t}（失误 ${st.mistakes}/${D.MISTAKE_LIMIT}）`, "bad");
    openModal({ title:"⚖ 错误推论", body:`<p>${t}</p>`, btn:"再想想" });
  }
  renderAll(); checkLose();
}
function countKeys(){ return D.DEDUCTIONS.filter(d=>d.key && st.owned.includes(d.id)).length; }

/* ---- 指控 ---- */
function accuse(sid, name){
  const s = D.SUSPECTS.find(x=>x.id===sid);
  const res = coreAccuse(sid, st.owned, D);
  if(res.result === "insufficient"){
    st.mistakes++;
    log(`【证据不足】你还缺少关键推理——「${name}」的律师替你挡下了这次指控。（失误 +1）`, "bad");
    openModal({ title:"⚖ 证据不足", body:`<p>「你没有四条关键结论就敢指控？法官被我请来了。」— ${name}</p><div class="who">还需 ${4-countKeys()} 条 ★ 关键结论。</div>`, btn:"退庭" });
  } else if(res.result === "wrong"){
    st.mistakes++;
    log(`【错误指控】${name} 的辩白：${s.alibi}（失误 +1）`, "bad");
    openModal({ title:"⚖ 指控失败", body:`<p>${s.alibi}</p>`, btn:"承认错误" });
  } else {
    st.won = true;
    log(`【真相大白】${D.ACCUSE_WIN.line}`, "good");
    openWin();
  }
  renderAll(); checkLose();
}
function checkLose(){
  if(st.mistakes >= D.MISTAKE_LIMIT && !st.won){
    st.lost = true;
    openLose();
  }
}

/* ---- 弹窗 ---- */
function openModal({title, body, btn}){
  const v = document.createElement("div"); v.className = "veil";
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<h3>${title}</h3><div class="body">${body}</div>`;
  const b = document.createElement("button"); b.textContent = btn || "关闭";
  b.onclick = () => v.remove();
  m.appendChild(b); v.appendChild(m); document.body.appendChild(v);
}
function openWin(){
  const v = document.createElement("div"); v.className = "veil";
  v.innerHTML = `<div class="modal winbox"><h2>案 破</h2><div class="sig">⚜</div>
    <p>真凶：科尔·克雷文。<br>十年账册、一夜钟声——你把 1931 年雾灯镇案钉进了档案。镇上的人终于可以睡个好觉；而神父会在离镇的马车上，一遍遍背诵他妹妹的祷词。</p>
    <button id="w-again">再办一桩 (重新调查)</button></div>`;
  v.querySelector("#w-again").onclick = () => resetGame();
  document.body.appendChild(v);
}
function openLose(){
  const v = document.createElement("div"); v.className = "veil";
  v.innerHTML = `<div class="modal winbox"><h2>推理生涯终结</h2><div class="sig">🕯</div>
    <p>失误六次，雾灯镇的警官没收了你的徽章。这桩案子，成了你卷宗里唯一的黑洞——夜里还会听见 10:07 的钟声。</p>
    <button id="l-again">从头再来 (重新调查)</button></div>`;
  v.querySelector("#l-again").onclick = () => resetGame();
  document.body.appendChild(v);
}

/* ---- 存档 / 读档 / 重置（核心序列化函数 + localStorage） ---- */
function autosave(){ try{ localStorage.setItem(SAVE_KEY, coreSerialize(st, D)); }catch(e){} }
function saveGame(){ autosave(); log("档案已封存。", "meta"); }
function loadGame(){
  const raw = localStorage.getItem(SAVE_KEY);
  const loaded = coreDeserialize(raw, D);
  if(!loaded){ log("没有可读取的档案——先玩、再存档。", "bad"); return; }
  st = { owned:loaded.owned, basket:[], mistakes:loaded.mistakes, won:loaded.won, lost:loaded.lost };
  if(st.won){ openWin(); return; }
  if(st.lost){ openLose(); return; }
  renderAll();
  log("档案已展开——接着上次的线索继续。", "good");
}
function resetGame(){
  localStorage.removeItem(SAVE_KEY);
  st = { owned:[], basket:[], mistakes:0, won:false, lost:false };
  document.querySelectorAll(".veil").forEach(v=>v.remove());
  renderAll();
  log("新的一卷：1931 年 11 月 23 日，雾灯镇。", "meta");
}

/* ---- 总渲染 ---- */
function renderAll(){
  $("#m-num").textContent = st.mistakes;
  $("#m-max").textContent = D.MISTAKE_LIMIT;
  const got = countKeys();
  $("#k-stars").textContent = "★".repeat(got) + "☆".repeat(4-got);
  $("#k-stars").style.color = got >= 4 ? "var(--green)" : "var(--gold2)";
  renderSuspects(); renderCards(); renderBasket();
}

/* ---- 事件绑定 ---- */
document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    tab = b.dataset.tab;
    renderCards();
  };
});
$("#btn-reason").onclick = reason;
$("#btn-clear").onclick = () => { st.basket = []; renderBasket(); renderCards(); autosave(); };
$("#btn-save").onclick = saveGame;
$("#btn-load").onclick = loadGame;
$("#btn-reset").onclick = () => {
  if(confirm("确定要清空进度、重新调查吗？")) resetGame();
};

/* ---- 启动：读档优先，否则新开 ---- */
(function boot(){
  const raw = localStorage.getItem(SAVE_KEY);
  const loaded = coreDeserialize(raw, D);
  if(loaded){
    st = { owned:loaded.owned, basket:[], mistakes:loaded.mistakes, won:loaded.won, lost:loaded.lost };
    if(st.won){ openWin(); }
    else if(st.lost){ openLose(); }
  }
  renderAll();
  log("1931 · 雾灯镇药房后屋：钟停在 10:07。证词与物证共 14 张，请开始你的推理。", "meta");
})();
</script>
</body>
</html>
