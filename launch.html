<style>
  .wrap { position: relative; z-index: 2; max-width: 980px; margin: 0 auto; padding: clamp(88px,9vw,120px) clamp(16px,4vw,28px) 60px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-family: var(--font-display); font-size: clamp(28px,4.2vw,52px); font-weight: var(--display-w); letter-spacing: -.02em; }
  h1 em { font-style: normal; color: var(--a1); }
  .hud { display: flex; gap: 16px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; color: var(--fg-faint); }
  .hud b { display: block; margin-top: 4px; font-size: 22px; color: var(--fg); letter-spacing: 0; }

  .stage { position: relative; border: 1px solid var(--line-strong); border-radius: 2px; overflow: hidden; background: #05060c; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }

  .panel { display: grid; grid-template-columns: 1fr 1fr auto; gap: 18px; align-items: end; margin-top: 16px; }
  .ctl label { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .16em; color: var(--fg-faint); margin-bottom: 8px; }
  .ctl b { color: var(--a1-t); font-size: 12px; letter-spacing: 0; }
  .ctl input[type=range] { width: 100%; accent-color: var(--a1); height: 3px; cursor: pointer; }

  .g-btn {
    padding: 12px 22px; border-radius: 2px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--a1); background: var(--a1); color: var(--on-accent);
    font-size: 13px; letter-spacing: .06em;
  }
  .g-btn.ghost { background: transparent; color: var(--fg); border-color: var(--line-strong); }

  .msg { margin-top: 14px; min-height: 44px; font-size: 13px; line-height: 1.9; color: var(--fg-dim); }
  .msg b { color: var(--a1-t); }

  .foot { margin-top: 12px; display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; color: var(--fg-faint); }
  .dew { color: var(--a1-t); }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true">

  <div class="motif"><div class="m-grid"></div><div class="m-glow"></div></div>
  <div class="vignette"></div>
</div>

<header class="nav" id="nav">

    <button class="sun" id="themeBtn" type="button" aria-label="外观设置">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <g class="sun-rays" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="24" y1="3.5" x2="24" y2="9" /><line x1="24" y1="39" x2="24" y2="44.5" />
          <line x1="3.5" y1="24" x2="9" y2="24" /><line x1="39" y1="24" x2="44.5" y2="24" />
          <line x1="9.5" y1="9.5" x2="13.4" y2="13.4" /><line x1="34.6" y1="34.6" x2="38.5" y2="38.5" />
          <line x1="9.5" y1="38.5" x2="13.4" y2="34.6" /><line x1="34.6" y1="13.4" x2="38.5" y2="9.5" />

</header>

<div class="theme-panel" id="themePanel" aria-hidden="true">
  <div class="tp-head"><span>换一种光</span><em>T 开关</em></div>
  <div class="tp-tabs" role="tablist">
    <button class="tp-tab is-on" type="button" data-tab="color">颜色 <b id="famNow">东方</b></button>
    <button class="tp-tab" type="button" data-tab="style">风格 <b id="styleNow">电影</b></button>
  </div>
  <div class="tp-pane" id="paneColor"><div class="fam-list" id="famList"></div><p class="fam-blurb" id="famBlurb"></p><div class="sw-grid" id="swList"></div></div>
  <div class="tp-pane" id="paneStyle" hidden><div class="st-grid" id="styleList"></div><p class="tp-tip">字体、圆角、质感。</p></div>
  <div class="tp-foot" id="tpFoot">5 个色系 · 60 种颜色 · 10 种风格</div>
</div>

<main class="wrap">
  <div class="head">
    <h1>把卫星<em>送进窗口</em></h1>
    <div class="hud">
      <span>最佳<b id="best">—</b></span>
      <span>试了<b id="tries">0</b></span>
    </div>
  </div>

  <div class="stage"><canvas id="cv"></canvas></div>

  <div class="panel">
    <div class="ctl">
      <label>发射角 <b id="angV">26°</b></label>
      <input id="ang" type="range" min="0" max="80" value="26" step="1" />
    </div>
    <div class="ctl">
      <label>推力 <b id="powV">58</b></label>
      <input id="pow" type="range" min="30" max="100" value="58" step="1" />
    </div>
    <button class="g-btn" id="fire">点火</button>
  </div>

  <p class="msg" id="msg">把卫星推进那条虚线环里，蓝色那段是"窗口" —— 得从那儿穿过去。</p>

  <div class="foot">
    <span>露水 <b class="dew" id="dew">0</b></span>
    <span>← 乒乓 · 一盆花 →</span>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/nav.js?vixqxy5"></script>
<script src="js/i18n.js?vixqxy5"></script>
<script src="js/settings.js?vixqxy5"></script>
<script src="js/music.js?vixqxy5"></script>
<script src="js/fx.js?vixqxy5"></script>
<script src="js/main.js?vixqxy5"></script>
<script src="js/eggs.js?vixqxy5"></script>
<script src="js/arcade.js?vixqxy5"></script>
<script>
(function () {
  'use strict';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const angEl = document.getElementById('ang');
  const powEl = document.getElementById('pow');
  const angV = document.getElementById('angV');
  const powV = document.getElementById('powV');
  const msg = document.getElementById('msg');
  const bestEl = document.getElementById('best');
  const triesEl = document.getElementById('tries');
  const dewEl = document.getElementById('dew');
  const fireBtn = document.getElementById('fire');

  let W = 0, H = 0, dpr = 1;
  let cx = 0, cy = 0, R = 0, ringR = 0;
  let winA = 0, winB = 0;           // 窗口的角度范围（弧度）
  let rocket = null, trail = [], flying = false;
  let tries = 0;
  let best = 0;

  function fit() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    R = Math.min(W * 0.62, H * 1.15);
    cx = W / 2;
    cy = H + R * 0.82;
    ringR = R * 1.26;
    // 窗口固定在地平线右侧一段
    winA = -1.28; winB = -0.98;
    draw();
  }

  function launchPoint() { return { x: cx, y: cy - R }; }

  function fire() {
    if (flying) return;
    const ang = parseInt(angEl.value, 10) * Math.PI / 180;
    const power = parseInt(powEl.value, 10);
    const p0 = launchPoint();
    const v = 240 + power * 4.2;
    rocket = {
      x: p0.x, y: p0.y,
      vx: Math.sin(ang) * v,
      vy: -Math.cos(ang) * v,
      t: 0
    };
    trail = [[rocket.x, rocket.y]];
    flying = true;
    tries++;
    triesEl.textContent = tries;
    msg.innerHTML = '在飞……';

    let last = performance.now();
    (function step(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      if (!flying) return;

      const dx = rocket.x - cx, dy = rocket.y - cy;
      const d = Math.hypot(dx, dy) || 1;
      const g = 420;
      rocket.vx -= (dx / d) * g * dt;
      rocket.vy -= (dy / d) * g * dt;

      const prevD = d;
      rocket.x += rocket.vx * dt;
      rocket.y += rocket.vy * dt;
      rocket.t += dt;
      trail.push([rocket.x, rocket.y]);
      if (trail.length > 900) trail.shift();

      const nd = Math.hypot(rocket.x - cx, rocket.y - cy);

      // 穿过环
      if ((prevD - ringR) * (nd - ringR) <= 0 && prevD !== nd) {
        const k = (ringR - prevD) / (nd - prevD);
        const ix = rocket.x - (rocket.x - (rocket.x - rocket.vx * dt)) * (1 - k);
        const iy = rocket.y - (rocket.y - (rocket.y - rocket.vy * dt)) * (1 - k);
        const a = Math.atan2(iy - cy, ix - cx);
        resolve(a);
        return;
      }
      if (rocket.t > 7 || nd < R * 0.9) { resolve(null); return; }

      draw();
      requestAnimationFrame(step);
    })(last);
  }

  function resolve(angle) {
    flying = false;
    const p = Arcade.palette();
    if (angle === null) {
      msg.innerHTML = '掉回去了。<b>再调一下角度或推力。</b>';
      draw();
      return;
    }
    // 角度归一到 -PI..PI
    let a = angle;
    const inside = a >= winA && a <= winB;
    const center = (winA + winB) / 2;
    const offset = Math.abs(a - center);
    const score = Math.max(0, Math.round(100 - offset * 120));

    if (inside) {
      if (score > best) { best = score; bestEl.textContent = score; }
      const dew = Math.max(1, Math.round(score / 20));
      Arcade.add(dew); dewEl.textContent = Arcade.coins();
      msg.innerHTML = '入轨。<b>窗口命中</b>，偏差 ' + Math.round(offset * 57.3) + '°，得分 <b>' + score + '</b>，露水 +' + dew + '。';
      Arcade.setBest('launch', score);
      const dew2 = dew;
      setTimeout(function () {
        if (confirm('要一张入轨证书吗？')) {
          Arcade.certificate({
            title: '发射窗口',
            lines: ['卫星入轨成功', '窗口偏差 ' + Math.round(offset * 57.3) + '°', '得分 ' + score + ' 分']
          });
        }
      }, 400);
    } else {
      msg.innerHTML = '穿过了，但<b>不在窗口里</b>（偏了 ' + Math.round(offset * 57.3) + '°）。再调一点。';
    }
    draw();
  }

  function draw() {
    const p = Arcade.palette();
    ctx.clearRect(0, 0, W, H);

    // 星
    ctx.fillStyle = p.fg;
    for (let i = 0; i < 90; i++) {
      const x = (i * 137.5) % W;
      const y = (i * 89.7) % (H * 0.9);
      ctx.globalAlpha = ((i * 37) % 70) / 100 + 0.1;
      ctx.fillRect(x, y, 1.2, 1.2);
    }
    ctx.globalAlpha = 1;

    // 地球
    const g = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.4, R * 0.1, cx, cy, R);
    g.addColorStop(0, p.a2);
    g.addColorStop(1, p.bg);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();

    // 大气边缘
    ctx.strokeStyle = p.a1;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(cx, cy, R + 1, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 目标环
    ctx.strokeStyle = p.dim;
    ctx.globalAlpha = 0.6;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;

    // 窗口
    ctx.strokeStyle = p.a1;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, winA, winB);
    ctx.stroke();

    // 轨迹
    if (trail.length > 1) {
      ctx.strokeStyle = p.a3;
      ctx.lineWidth = 1.6;
      ctx.globalAlpha = .85;
      ctx.beginPath();
      ctx.moveTo(trail[0][0], trail[0][1]);
      for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i][0], trail[i][1]);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 火箭
    const p0 = launchPoint();
    const rx = flying ? rocket.x : p0.x;
    const ry = flying ? rocket.y : p0.y;
    ctx.fillStyle = p.a3;
    ctx.shadowColor = p.a3;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(rx, ry, 4.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  angEl.addEventListener('input', function () { angV.textContent = angEl.value + '°'; });
  powEl.addEventListener('input', function () { powV.textContent = powEl.value; });
  fireBtn.addEventListener('click', fire);
  window.addEventListener('keydown', function (e) { if (e.key === 'Enter') fire(); });
  window.addEventListener('resize', fit);

  fit();
  dewEl.textContent = Arcade.coins();
  const b = Arcade.best('launch');
  if (b) bestEl.textContent = b;
})();
</script>
</body>
</html>
