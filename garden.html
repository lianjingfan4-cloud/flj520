<style>
  .game-wrap { position: relative; z-index: 2; max-width: 1040px; margin: 0 auto; padding: clamp(96px, 11vw, 130px) clamp(16px, 4vw, 32px) 60px; }

  .g-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
  .g-title { font-family: var(--font-display); font-size: clamp(30px, 5vw, 62px); line-height: 1.06; letter-spacing: -.035em; font-weight: var(--display-w); }
  .g-title em { font-family: var(--font-serif); font-style: italic; background: linear-gradient(100deg, var(--a1), var(--a2), var(--a3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .g-sub { font-size: 13px; line-height: 1.9; color: var(--fg-dim); max-width: 32ch; }

  .hud { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
  .hud-cell {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border: 1px solid var(--card-line); border-radius: var(--radius-sm);
    background: var(--card); backdrop-filter: blur(var(--card-blur));
  }
  .hud-cell i { font-style: normal; font-size: 18px; line-height: 1; color: var(--a1-t); display: grid; place-items: center; }
  .hud-cell i svg { width: 21px; height: 21px; display: block; }
  .hud-cell b { font-family: var(--font-display); font-size: clamp(20px, 2.4vw, 30px); font-weight: var(--display-w); letter-spacing: -.02em; line-height: 1; }
  .hud-cell span { display: block; font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .16em; color: var(--fg-faint); text-transform: uppercase; margin-top: 4px; }
  .hud-cell .hud-txt { display: flex; flex-direction: column; }

  .stage-box {
    position: relative; border-radius: var(--radius); overflow: hidden;
    border: 1px solid var(--card-line); background: var(--card);
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .stage-box svg { display: block; width: 100%; height: auto; }
  .stage-box:active { transform: scale(.998); }

  .grow-bar { position: relative; height: 6px; border-radius: 99px; background: var(--line); margin: 14px 0 6px; overflow: hidden; }
  .grow-bar i { position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: 99px; background: linear-gradient(90deg, var(--a1), var(--a2)); transition: width .45s var(--ease-out); box-shadow: 0 0 18px var(--a1); }
  .grow-note { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; color: var(--fg-faint); }

  .g-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .g-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px;
    border-radius: var(--btn-r, 999px); border: 1px solid var(--line-strong);
    font-size: 12.5px; color: var(--fg); cursor: pointer;
    transition: border-color .3s var(--ease), background-color .3s var(--ease), transform .3s var(--ease);
  }
  .g-btn:hover { border-color: var(--a1); background: color-mix(in srgb, var(--a1) 10%, transparent); }
  .g-btn:active { transform: translateY(1px); }
  .g-btn.primary { background: var(--btn-primary-bg); color: var(--on-accent); border-color: transparent; box-shadow: var(--glow); }
  .g-btn[disabled] { opacity: .4; pointer-events: none; }

  .float-plus {
    position: fixed; pointer-events: none; z-index: 9990;
    font-family: var(--font-display); font-size: 18px; font-weight: 600;
    color: var(--a1-t); text-shadow: 0 0 16px var(--a1);
    animation: floatUp 1s var(--ease-out) forwards;
  }
  @keyframes floatUp { to { transform: translate(-50%, -64px); opacity: 0; } }

  .egg-pop { position: fixed; pointer-events: none; z-index: 9990; font-size: 16px; animation: floatUp 1.1s var(--ease-out) forwards; }

  .chick { cursor: pointer; transition: transform .25s var(--ease-out); transform-box: fill-box; transform-origin: center bottom; }
  .chick:hover { transform: translateY(-4px) scale(1.06); }
  .chick.jump { animation: chickJump .5s var(--ease); }
  @keyframes chickJump { 40% { transform: translateY(-14px) rotate(-6deg); } 70% { transform: translateY(-4px) rotate(4deg); } }

  .g-tip { margin-top: 16px; font-size: 12px; line-height: 1.9; color: var(--fg-faint); }
  .g-tip b { color: var(--a1-t); font-weight: 500; }

  @media (max-width: 640px) {
    .hud { grid-template-columns: 1fr 1fr; }
    .hud-cell:nth-child(3) { grid-column: span 2; }
  }
</style>

<script>
(function () {
  'use strict';

  const KEY = 'nova-garden-v1';
  const STAGES = ['种子', '发芽', '抽叶', '结蕾', '开花', '极光花'];
  const NEED = [6, 10, 16, 24, 34]; // 从第 n 阶段升到下一阶段需要的水滴

  let state = { water: 0, eggs: 0, stage: 0, total: 0 };

  const $ = function (id) { return document.getElementById(id); };
  const plantG = $('plantG');
  const chicksG = $('chicksG');
  const stageBox = $('stageBox');

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && typeof s.water === 'number') state = { water: s.water | 0, eggs: s.eggs | 0, stage: Math.min(5, Math.max(0, s.stage | 0)), total: s.total | 0 };
      }
    } catch (e) { }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { }
  }

  /* ---------------- 天气：按日期定，今天是什么就是什么 ---------------- */
  const WX = [
    { id: 'sun',   name: '晴', icon: '☀', mult: 2, tip: '太阳好，浇一滴顶两滴' },
    { id: 'cloud', name: '阴', icon: '☁', mult: 1, tip: '阴天，长得慢一点' },
    { id: 'rain',  name: '雨', icon: '☂', mult: 3, tip: '下雨了，接住' },
    { id: 'snow',  name: '雪', icon: '❄', mult: 2, tip: '雪落在叶子上不化' }
  ];
  const now = new Date();
  const seed = now.getFullYear() * 1000 + (now.getMonth() + 1) * 40 + now.getDate();
  const weather = WX[seed % WX.length];

  function buildWeatherChip() {
    const host = document.querySelector('.hud') || document.querySelector('.grow-note');
    if (!host || document.getElementById('wxChip')) return;
    const el = document.createElement('span');
    el.id = 'wxChip';
    el.className = 'wx-chip';
    el.innerHTML = '<i>' + weather.icon + '</i>' + weather.name + ' · 水×' + weather.mult;
    el.title = weather.tip;
    host.appendChild(el);
  }

  /* ---------------- 小鸡合成 ---------------- */
  const CHICK_MAX = 4;
  function chickLevels() {
    if (!Array.isArray(state.lv)) state.lv = [1, 1];
    return state.lv;
  }
  function chickPower() {
    return chickLevels().reduce(function (a, b) { return a + b; }, 0);
  }
  function mergeChicks() {
    const lv = chickLevels();
    for (let k = 1; k < CHICK_MAX; k++) {
      const idx = [];
      lv.forEach(function (v, i) { if (v === k && idx.length < 2) idx.push(i); });
      if (idx.length === 2) {
        lv.splice(idx[1], 1);
        lv[idx[0]] = k + 1;
        state.eggs += k * 2;
        save(); render();
        toast('两只 ' + k + ' 级合成了一只 ' + (k + 1) + ' 级，还多下了 ' + (k * 2) + ' 个蛋');
        return true;
      }
    }
    toast('没有两只同级的小鸡可以合');
    return false;
  }

  function buildMergeBtn() {
    const host = document.querySelector('.actions') || document.querySelector('.hud');
    if (!host || document.getElementById('mergeBtn')) return;
    const b = document.createElement('button');
    b.id = 'mergeBtn';
    b.className = 'g-btn';
    b.type = 'button';
    b.textContent = '合成小鸡';
    b.addEventListener('click', mergeChicks);
    host.appendChild(b);
  }

  /* ---------------- 夜晚形态 ---------------- */
  function paintNight() {
    const h = new Date().getHours();
    document.body.classList.toggle('night', h >= 22 || h < 6);
  }
  paintNight();
  setInterval(paintNight, 60000);

  /* ---------------- 极光花：露水 + 证书 ---------------- */
  function bloomReward() {
    let done = false;
    try { done = localStorage.getItem('nova-bloom') === '1'; } catch (e) { }
    if (done) return;
    try { localStorage.setItem('nova-bloom', '1'); } catch (e) { }
    if (window.Arcade) {
      Arcade.add(5);
      setTimeout(function () {
        if (confirm('极光花开了。要一张开花的证书吗？')) {
          Arcade.certificate({
            title: '一盆花',
            lines: ['极光花开了', '浇水 ' + state.total + ' 次', '露水 +5']
          });
        }
      }, 500);
    }
  }

  /* ---------------- 画那株花 ---------------- */
  function plantSVG(stage) {
    const s = 'stroke="var(--fg)" stroke-width="2.4" fill="none" stroke-linecap="round"';
    let out = '';
    // 土堆
    out += '<ellipse cx="400" cy="424" rx="52" ry="10" fill="var(--fg)" opacity=".12"/>';

    if (stage === 0) {
      out += '<ellipse cx="400" cy="424" rx="9" ry="6" fill="var(--a1)" opacity=".85"/>';
      out += '<circle cx="400" cy="418" r="2.4" fill="var(--a2)"/>';
      return out;
    }
    const h = [0, 26, 74, 118, 158, 190][stage];
    out += '<path d="M400,424 V' + (424 - h) + '" ' + s + ' stroke-width="3"/>';

    if (stage >= 1) {
      out += '<path d="M400,' + (424 - 18) + ' q-26,-10 -34,-24 q22,-8 34,14" fill="var(--a2)" opacity=".8" stroke="var(--fg)" stroke-width="1.6"/>';
      out += '<path d="M400,' + (424 - 18) + ' q26,-10 34,-24 q-22,-8 -34,14" fill="var(--a1)" opacity=".8" stroke="var(--fg)" stroke-width="1.6"/>';
    }
    if (stage >= 2) {
      out += '<path d="M400,' + (424 - 64) + ' q-34,-12 -44,-30 q28,-10 44,18" fill="var(--a1)" opacity=".75" stroke="var(--fg)" stroke-width="1.6"/>';
      out += '<path d="M400,' + (424 - 92) + ' q34,-12 44,-30 q-28,-10 -44,18" fill="var(--a2)" opacity=".75" stroke="var(--fg)" stroke-width="1.6"/>';
    }
    if (stage >= 3) {
      out += '<ellipse cx="400" cy="' + (424 - h + 6) + '" rx="16" ry="24" fill="var(--a2)" opacity=".85" stroke="var(--fg)" stroke-width="1.8"/>';
      out += '<path d="M400,' + (424 - h - 12) + ' q6,10 0,18" stroke="var(--fg)" stroke-width="1.6" fill="none" opacity=".6"/>';
    }
    if (stage >= 4) {
      const cy = 424 - h + 4;
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI * 2 / 6) * i;
        const x = 400 + Math.cos(a) * 26;
        const y = cy + Math.sin(a) * 26;
        out += '<ellipse cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" rx="17" ry="12" fill="' + (i % 2 ? 'var(--a1)' : 'var(--a3)') + '" opacity=".9" stroke="var(--fg)" stroke-width="1.4" transform="rotate(' + (a * 57.3).toFixed(1) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"/>';
      }
      out += '<circle cx="400" cy="' + cy + '" r="14" fill="var(--a2)" stroke="var(--fg)" stroke-width="1.6"/>';
    }
    if (stage >= 5) {
      const cy = 424 - h + 4;
      out += '<circle cx="400" cy="' + cy + '" r="58" fill="none" stroke="var(--a3)" stroke-width="1" opacity=".45"/>';
      out += '<circle cx="400" cy="' + cy + '" r="78" fill="none" stroke="var(--a1)" stroke-width=".8" opacity=".28"/>';
      for (let i = 0; i < 10; i++) {
        const a = (Math.PI * 2 / 10) * i + 0.3;
        const x = 400 + Math.cos(a) * (92 + (i % 3) * 14);
        const y = cy + Math.sin(a) * (92 + (i % 3) * 14);
        out += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (i % 2 ? 2 : 3) + '" fill="var(--a3)" opacity=".8"/>';
      }
    }
    return out;
  }

  /* ---------------- 画小鸡 ---------------- */
  const CHICKS = [
    { x: 196, y: 452, s: 1 },
    { x: 610, y: 470, s: .9 },
    { x: 286, y: 486, s: .8 }
  ];
  function chickSVG(c, i) {
    return '<g class="chick" data-chick="' + i + '" transform="translate(' + c.x + ',' + c.y + ') scale(' + c.s + ')">' +
      '<ellipse cx="0" cy="0" rx="15" ry="13" fill="var(--a3)" opacity=".9" stroke="var(--fg)" stroke-width="1.6"/>' +
      '<circle cx="-4" cy="-14" r="9" fill="var(--a3)" opacity=".95" stroke="var(--fg)" stroke-width="1.6"/>' +
      '<path d="M5,-14 l9,4 l-9,4 z" fill="var(--a1)" stroke="var(--fg)" stroke-width="1.2"/>' +
      '<circle cx="-6" cy="-16" r="1.6" fill="var(--fg)"/>' +
      '<path d="M-6,13 v7 M5,13 v7" stroke="var(--fg)" stroke-width="1.6" stroke-linecap="round"/>' +
      '<path d="M-13,2 q-8,2 -10,-4" stroke="var(--fg)" stroke-width="1.4" fill="none" opacity=".5"/>' +
      '</g>';
  }

  /* ---------------- 界面刷新 ---------------- */
  function needNow() { return state.stage >= 5 ? 0 : NEED[Math.min(state.stage, NEED.length - 1)]; }

  function render() {
    plantG.innerHTML = plantSVG(state.stage);
    chicksG.innerHTML = CHICKS.map(chickSVG).join('');

    $('hudWater').textContent = state.water;
    $('hudEgg').textContent = state.eggs;
    $('hudStage').textContent = state.stage + ' / 5';
    $('stageName').textContent = STAGES[state.stage];

    const need = needNow();
    if (state.stage >= 5) {
      $('growFill').style.width = '100%';
      $('growText').textContent = '它开花了 —— 而且不会再谢';
    } else {
      const pct = Math.min(100, (state.water / need) * 100);
      $('growFill').style.width = pct + '%';
      $('growText').textContent = '还差 ' + Math.max(0, need - state.water) + ' 滴水' + (state.stage < 2 ? '发芽' : state.stage < 3 ? '抽叶' : state.stage < 4 ? '结蕾' : '开花');
    }
    $('tradeBtn').disabled = state.eggs < 3;
    save();
  }

  function floatAt(x, y, text, cls) {
    const el = document.createElement('div');
    el.className = cls || 'float-plus';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.transform = 'translate(-50%,-50%)';
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1100);
  }

  function toast(msg) {
    const t = $('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(function () { t.classList.remove('show'); }, 2000);
  }

  /* ---------------- 浇水 ---------------- */
  function water(x, y) {
    state.water += weather.mult * 1;
    state.total += 1;
    let leveled = false;
    while (state.stage < 5 && state.water >= NEED[state.stage]) {
      state.water -= NEED[state.stage];
      state.stage += 1;
      leveled = true;
    }
    render();
    if (x !== undefined) floatAt(x, y, '+1');
    if (leveled) {
      const name = STAGES[state.stage];
      toast(state.stage >= 5 ? '开花了 ✦ 这盆花叫「极光」' : '长到「' + name + '」了');
      if (state.stage >= 5) { bloomReward(); }
    }
  }

  stageBox.addEventListener('click', function (e) {
    water(e.clientX, e.clientY);
  });
  stageBox.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); water(); }
  });

  $('waterBtn').addEventListener('click', function (e) {
    water(e.clientX, e.clientY);
  });

  $('tradeBtn').addEventListener('click', function (e) {
    if (state.eggs < 3) return;
    state.eggs -= 3;
    state.water += 10;
    render();
    floatAt(e.clientX, e.clientY, '＋10 滴');
    toast('3 个蛋换了 10 滴水');
  });

  $('petBtn').addEventListener('click', function (e) {
    const chicks = document.querySelectorAll('.chick');
    const c = chicks[Math.floor(Math.random() * chicks.length)];
    if (c) {
      c.classList.remove('jump');
      void c.getBoundingClientRect();
      c.classList.add('jump');
    }
    state.eggs += 1;
    render();
    floatAt(e.clientX, e.clientY, '+1 🥚');
    toast('小鸡被摸得很开心，下了一颗蛋');
  });

  $('resetBtn').addEventListener('click', function () {
    if (!confirm('要把这盆花铲掉，重新种吗？')) return;
    state = { water: 0, eggs: 0, stage: 0, total: 0 };
    render();
    toast('重新种下了');
  });

  /* ---------------- 小鸡下蛋 ---------------- */
  setInterval(function () {
    if (document.hidden) return;
    state.eggs += Math.max(1, Math.round(chickPower() / 2));
    render();
    const box = stageBox.getBoundingClientRect();
    floatAt(box.left + box.width * (0.3 + Math.random() * 0.4), box.top + box.height * 0.8, '+1 🥚', 'egg-pop');
  }, 10000);

  /* ---------------- 启动 ---------------- */
  load();
  render();
  buildWeatherChip();
  buildMergeBtn();
  if (window.Arcade) {
    const dew = document.getElementById('dewCount');
    if (dew) dew.textContent = Arcade.coins();
  }
})();
</script>
<script src="js/polish.js?vpb5ljr"></script>
</body>
