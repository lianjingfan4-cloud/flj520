<!doctype html>
<html lang="zh-CN" data-palette="graphite" data-family="nocturne" data-style="minimal" data-mode="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>标一张照片 · 图寻题库</title>
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="dark light" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="js/look.js?vpew2hw"></script>
<link rel="stylesheet" href="css/style.css?vpew2hw" />
<link rel="stylesheet" href="css/main.css?vpew2hw" />
<link rel="stylesheet" href="css/pages.css?vpew2hw" />
<style>
  .wrap { max-width: 820px; margin: 0 auto; padding: 84px 20px 60px; position: relative; z-index: 2; }
  h1 { font-family: var(--font-display); font-size: clamp(22px, 3.4vw, 34px); font-weight: var(--display-w); }
  h1 em { font-style: normal; color: var(--a1); }
  .sub { margin-top: 8px; font-size: 12.5px; line-height: 1.9; color: var(--fg-dim); }
  .shot { margin-top: 18px; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; background: #05060a; }
  .shot img { width: 100%; display: block; max-height: 56vh; object-fit: contain; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .bar input {
    flex: 1; min-width: 200px; padding: 13px 15px; border-radius: 4px;
    border: 1px solid var(--line-strong); background: color-mix(in srgb, var(--bg) 60%, transparent);
    color: var(--fg); font-size: 15px;
  }
  .bar input:focus { outline: none; border-color: var(--a1); }
  .g-btn { padding: 12px 20px; border-radius: 4px; border: 1px solid var(--line-strong); background: transparent; color: var(--fg); font-size: 13px; cursor: pointer; }
  .g-btn.primary { background: var(--a1); border-color: var(--a1); color: var(--on-accent); }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
  .chips button {
    padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--fg-dim); font-size: 12px; cursor: pointer;
  }
  .chips button:hover { border-color: var(--a1); color: var(--fg); }
  .meta { margin-top: 14px; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; color: var(--fg-faint); }
  .done-list { margin-top: 18px; font-size: 12px; color: var(--fg-dim); line-height: 1.9; max-height: 150px; overflow-y: auto; }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main class="wrap">
  <h1>标一张照片，<em>多一道题</em></h1>
  <p class="sub">照片一张一张看，打一个地名回车就存下。<b>至少标 4 个不同的地方</b>，图寻就会从卫星图换成这套照片题库。</p>

  <div class="shot"><img id="img" alt="" /></div>

  <div class="bar">
    <input id="place" placeholder="这是哪儿？例：莫斯科 / 上海 / 高密" autocomplete="off" list="places" />
    <button class="g-btn primary" id="saveBtn" type="button">存下 ⏎</button>
    <button class="g-btn" id="skipBtn" type="button">跳过</button>
  </div>
  <datalist id="places"></datalist>

  <div class="chips" id="chips"></div>

  <p class="meta" id="meta">—</p>
  <p class="bar" style="margin-top:16px">
    <button class="g-btn" id="exportBtn" type="button">导出题库（geo-bank.js）</button>
    <button class="g-btn" id="clearBtn" type="button">清空重标</button>
    <a class="g-btn" href="guess.html">← 回图寻</a>
  </p>
  <div class="done-list" id="doneList"></div>
</main>

<script src="js/kernel.js?vpew2hw"></script>
<script src="js/i18n.js?vpew2hw"></script>
<script src="js/fx.js?vpew2hw"></script>
<script src="js/main.js?vpew2hw"></script>
<script src="js/photos.js?vpew2hw"></script>
<script>
(function () {
  'use strict';
  const KEY = 'nova-geo-labels';
  const QUICK = ['莫斯科', '上海', '高密', '青岛', '圣彼得堡', '北京', '潍坊', '喀山'];
  const img = document.getElementById('img');
  const place = document.getElementById('place');
  const meta = document.getElementById('meta');
  const doneList = document.getElementById('doneList');
  const datalist = document.getElementById('places');

  const photos = (window.PHOTOS || []).map(function (p) { return p.src; });
  let labels = {};
  try { labels = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { labels = {}; }
  let queue = [], cur = '';

  function save() { try { localStorage.setItem(KEY, JSON.stringify(labels)); } catch (e) { } }
  function unlabeled() { return photos.filter(function (s) { return !labels[s]; }); }

  function next() {
    queue = unlabeled();
    if (!queue.length) {
      img.removeAttribute('src');
      meta.textContent = '照片标完了 —— 一共 ' + Object.keys(labels).length + ' 张。可以导出了。';
      return;
    }
    cur = queue[Math.floor(Math.random() * Math.min(queue.length, 40))];
    img.src = cur;
    place.value = '';
    place.focus();
    paint();
  }

  function paint() {
    const n = Object.keys(labels).length;
    const kinds = new Set(Object.values(labels));
    meta.textContent = '已标 ' + n + ' 张 · ' + kinds.size + ' 个地方 · 还剩 ' + unlabeled().length + ' 张没标';
    const counts = {};
    Object.values(labels).forEach(function (v) { counts[v] = (counts[v] || 0) + 1; });
    doneList.innerHTML = Object.keys(counts).map(function (k) { return k + ' ×' + counts[k]; }).join(' · ');
    datalist.innerHTML = Object.keys(counts).map(function (k) { return '<option value="' + k + '">'; }).join('');
  }

  function commit() {
    const v = place.value.trim();
    if (!v) { place.focus(); return; }
    labels[cur] = v;
    save();
    if (window.Site) Site.toast('记下了：' + v);
    next();
  }

  document.getElementById('saveBtn').addEventListener('click', commit);
  document.getElementById('skipBtn').addEventListener('click', next);
  place.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); commit(); } });

  document.getElementById('chips').innerHTML = QUICK.map(function (q) { return '<button type="button">' + q + '</button>'; }).join('');
  document.getElementById('chips').addEventListener('click', function (e) {
    const b = e.target.closest('button');
    if (!b) return;
    place.value = b.textContent;
    commit();
  });

  document.getElementById('exportBtn').addEventListener('click', function () {
    const names = Object.keys(labels);
    if (names.length < 4) { alert('至少标 4 张不同地方的照片，题库才能出四个选项。'); return; }
    const unique = Array.from(new Set(Object.values(labels)));
    const lines = names.map(function (src) {
      const ans = labels[src];
      const pool = unique.filter(function (x) { return x !== ans; });
      while (pool.length > 3) pool.splice(Math.floor(Math.random() * pool.length), 1);
      const opts = [ans].concat(pool);
      for (let i = opts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = opts[i]; opts[i] = opts[j]; opts[j] = t;
      }
      return "  { src: '" + src + "', place: '" + ans + "', opts: " + JSON.stringify(opts).replace(/"/g, "'") + " },";
    });
    const text = '/* geo-bank.js — 自动生成，共 ' + names.length + ' 题 */\nwindow.GEO = [\n' + lines.join('\n') + '\n];\n';
    const blob = new Blob([text], { type: 'text/javascript' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'geo-bank.js';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    if (window.Site) Site.toast('导出了 ' + names.length + ' 题，覆盖 me/js/geo-bank.js');
  });

  document.getElementById('clearBtn').addEventListener('click', function () {
    if (!confirm('清空所有标注？')) return;
    labels = {}; save(); next();
  });

  next();
})();
</script>
<script src="js/polish.js?vpew2hw"></script>
</body>
</html>
