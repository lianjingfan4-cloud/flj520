<!doctype html>
<html lang="zh-CN" data-palette="fjord" data-family="nocturne" data-style="cinematic" data-mode="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>去莫斯科的那趟车</title>
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="dark light" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600&family=Space+Grotesk:wght@300;400;500;600;700&family=ZCOOL+KuaiLe&family=Zhi+Mang+Xing&display=swap" rel="stylesheet" />

<script>document.documentElement.classList.add('js');</script>
<style>
  html, body { height: 100%; overflow: hidden; }
  .car {
    position: fixed; inset: 0; z-index: 3;
    display: grid; grid-template-rows: 1fr auto; place-items: center;
    padding: clamp(16px, 4vw, 40px);
  }
  .win {
    position: relative; width: min(86vw, 1100px); height: min(56vh, 560px);
    border-radius: 26px; overflow: hidden;
    border: 10px solid color-mix(in srgb, var(--fg) 12%, transparent);
    box-shadow: 0 40px 120px -50px #000, inset 0 0 60px rgba(0,0,0,.6);
  }
  .sky { position: absolute; inset: 0; background: linear-gradient(to bottom, #0a1020 0%, #16233a 42%, #2a3b52 72%, #3a4a5e 100%); }
  .stars { position: absolute; inset: 0; opacity: .7; }
  .layer { position: absolute; left: 0; bottom: 0; height: 100%; width: 300%; will-change: transform; }
  .l1 { animation: scroll 26s linear infinite; }
  .l2 { animation: scroll 16s linear infinite; }
  .l3 { animation: scroll 9s linear infinite; }
  .l4 { animation: scroll 4.5s linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-33.333%); } }
  .l1 svg, .l2 svg, .l3 svg, .l4 svg { width: 100%; height: 100%; display: block; }

  .glass { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.10) 0%, transparent 32%, transparent 68%, rgba(255,255,255,.05) 100%);
    box-shadow: inset 0 0 80px rgba(10,16,30,.75); }

  .bar { display: flex; align-items: center; gap: 18px; margin-top: 26px; flex-wrap: wrap; justify-content: center; }
  .cap { font-family: var(--font-serif); font-style: italic; font-size: clamp(15px, 1.7vw, 21px); color: var(--fg-dim); }
  .cap b { color: var(--fg); font-style: normal; }
  .back {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .18em;
    color: var(--fg-faint); text-decoration: none; border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }
  .back:hover { color: var(--a1-t); }

  .seat { position: absolute; left: 0; right: 0; bottom: 0; height: 18%;
    background: linear-gradient(to top, color-mix(in srgb, var(--fg) 8%, transparent), transparent); }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><div class="motif"><div class="m-glow"></div></div><div class="vignette"></div></div>
<div class="grain" aria-hidden="true"></div>

<div class="car">
  <div class="win">
    <div class="sky"></div>
    <div class="stars">

        <g fill="var(--fg)" opacity=".5">

          <circle cx="470" cy="55" r="1.1"/><circle cx="600" cy="110" r="1.3"/><circle cx="720" cy="48" r="1"/>
          <circle cx="840" cy="90" r="1.5"/><circle cx="960" cy="36" r="1.1"/><circle cx="1080" cy="104" r="1.2"/>
        </g>
      </svg>
    </div>

    <div class="layer l1">
      <svg viewBox="0 0 1800 600" preserveAspectRatio="none">
        <path d="M0,420 L120,340 L240,400 L360,300 L480,380 L620,320 L760,410 L900,330 L1040,400 L1180,310 L1320,390 L1460,330 L1600,410 L1800,350 L1800,600 L0,600 Z" fill="color-mix(in srgb, var(--a2) 38%, #0b1220)"/>

      </svg>
    </div>

    <div class="layer l2">
      <svg viewBox="0 0 1800 600" preserveAspectRatio="none">

    <div class="layer l3">

          <path d="M300,600 V300 M300,330 l-18,-24 M300,330 l18,-24"/>
          <path d="M560,600 V350 M560,380 l-15,-20 M560,380 l15,-20"/>
          <path d="M820,600 V310 M820,340 l-17,-22 M820,340 l17,-22"/>
          <path d="M1100,600 V345 M1100,375 l-16,-21 M1100,375 l16,-21"/>
          <path d="M1380,600 V315 M1380,345 l-17,-22 M1380,345 l17,-22"/>
          <path d="M1640,600 V340 M1640,370 l-15,-20 M1640,370 l15,-20"/>
          <path d="M1860,600 V330 M1860,360 l-16,-22 M1860,360 l16,-22"/>
        </g>
        <g stroke="var(--fg)" stroke-width="2" opacity=".45" fill="none" transform="translate(1800,0)">
          <path d="M60,600 V330 M60,360 l-16,-22 M60,360 l16,-22"/>
          <path d="M300,600 V300 M300,330 l-18,-24 M300,330 l18,-24"/>
          <path d="M560,600 V350 M560,380 l-15,-20 M560,380 l15,-20"/>
          <path d="M820,600 V310 M820,340 l-17,-22 M820,340 l17,-22"/>
          <path d="M1100,600 V345 M1100,375 l-16,-21 M1100,375 l16,-21"/>
          <path d="M1380,600 V315 M1380,345 l-17,-22 M1380,345 l17,-22"/>
          <path d="M1640,600 V340 M1640,370 l-15,-20 M1640,370 l15,-20"/>
          <path d="M1860,600 V330 M1860,360 l-16,-22 M1860,360 l16,-22"/>
        </g>
      </svg>
    </div>

    <div class="layer l4">
      <svg viewBox="0 0 1800 600" preserveAspectRatio="none">
        <g stroke="color-mix(in srgb, var(--fg) 60%, transparent)" stroke-width="3" opacity=".5">
          <path d="M0,540 h1800"/>
        </g>
        <g fill="color-mix(in srgb, var(--fg) 28%, transparent)">
          <rect x="40" y="556" width="60" height="6"/><rect x="220" y="556" width="60" height="6"/>
          <rect x="400" y="556" width="60" height="6"/><rect x="580" y="556" width="60" height="6"/>
          <rect x="760" y="556" width="60" height="6"/><rect x="940" y="556" width="60" height="6"/>
          <rect x="1120" y="556" width="60" height="6"/><rect x="1300" y="556" width="60" height="6"/>
          <rect x="1480" y="556" width="60" height="6"/><rect x="1660" y="556" width="60" height="6"/>
        </g>
        <g fill="color-mix(in srgb, var(--fg) 28%, transparent)" transform="translate(1800,0)">
          <rect x="40" y="556" width="60" height="6"/><rect x="220" y="556" width="60" height="6"/>
          <rect x="400" y="556" width="60" height="6"/><rect x="580" y="556" width="60" height="6"/>
          <rect x="760" y="556" width="60" height="6"/><rect x="940" y="556" width="60" height="6"/>
          <rect x="1120" y="556" width="60" height="6"/><rect x="1300" y="556" width="60" height="6"/>
          <rect x="1480" y="556" width="60" height="6"/><rect x="1660" y="556" width="60" height="6"/>
        </g>
      </svg>
    </div>

    <div class="glass"></div>
  </div>

  <div class="bar">
    <span class="cap">六天五夜，<b>窗外的雪一直没停</b>。</span>
    <a class="back" href="room.html">← 回到房间</a>
  </div>
</div>
