<!doctype html>
<html lang="zh-CN" data-palette="xuan" data-family="oriental" data-style="print" data-mode="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>密码本</title>
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="light dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600&family=Space+Grotesk:wght@300;400;500;600;700&family=ZCOOL+KuaiLe&family=Zhi+Mang+Xing&display=swap" rel="stylesheet" />
<script src="js/look.js?vpfdp5c"></script>
<link rel="stylesheet" href="css/style.css?vpfdp5c" />
<link rel="stylesheet" href="css/main.css?vpfdp5c" />
<script>document.documentElement.classList.add('js');</script>
<style>
  .book-wrap { position: relative; z-index: 2; max-width: 760px; margin: 0 auto; padding: clamp(90px,10vw,130px) clamp(20px,5vw,40px) 70px; }
  h1 { font-family: var(--font-song); font-size: clamp(30px,4.6vw,52px); letter-spacing: .02em; margin-bottom: 8px; }
  h1 em { font-style: normal; color: var(--a1); }
  .sub { color: var(--fg-dim); font-size: 13px; line-height: 1.9; margin-bottom: 28px; }

  .entry { border-top: 1px solid var(--line-strong); padding: 20px 0; display: grid; grid-template-columns: 34px 1fr; gap: 14px; }
  .entry .no { font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; color: var(--fg-faint); padding-top: 4px; }
  .entry h3 { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
  .entry p { font-size: 13px; line-height: 1.95; color: var(--fg-dim); }
  .entry .lock { font-family: var(--font-mono); font-size: 11px; letter-spacing: .16em; color: var(--fg-faint); }
  .entry.open h3 { color: var(--a1-t); }
  .entry.open .lock { color: var(--a1); }
  .entry .code {
    display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 3px;
    border: 1px dashed var(--line-strong); font-family: var(--font-mono); font-size: 13px; letter-spacing: .18em; color: var(--fg);
  }

  .final {
    margin-top: 30px; padding: 24px; border: 1px solid var(--line-strong); border-radius: 4px;
    opacity: .35; transition: opacity .6s var(--ease), border-color .6s;
  }
  .final.on { opacity: 1; border-color: var(--a1); }
  .final h3 { font-family: var(--font-brush); font-size: 26px; margin-bottom: 10px; }
  .final p { font-size: 13.5px; line-height: 2; color: var(--fg-dim); }
  .final .big { font-family: var(--font-mono); font-size: 15px; letter-spacing: .3em; color: var(--a1-t); margin-top: 14px; }

  .back { display: inline-block; margin-top: 30px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .18em; color: var(--fg-faint); text-decoration: none; }
  .back:hover { color: var(--a1-t); }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><div class="motif"><div class="m-halftone"></div></div><div class="vignette"></div></div>
<div class="grain" aria-hidden="true"></div>

<main class="book-wrap">
  <h1>密码<em>本</em></h1>
  <p class="sub">三处地方各有一句口令。走到过的，这里会记得。<br />三个都齐了，最后那页才会亮。</p>

  <div class="entry" id="e1">
    <span class="no">01</span>
    <div>
      <h3>房间</h3>
      <p class="lock">未解锁</p>
      <div class="body" hidden></div>
    </div>
  </div>

  <div class="entry" id="e2">
    <span class="no">02</span>
    <div>
      <h3>一封信</h3>
      <p class="lock">未解锁</p>
      <div class="body" hidden></div>
    </div>
  </div>

  <div class="entry" id="e3">
    <span class="no">03</span>
    <div>
      <h3>一趟车</h3>
      <p class="lock">未解锁</p>
      <div class="body" hidden></div>
    </div>
  </div>

  <div class="final" id="final">
    <h3>三个都在的时候</h3>
    <p>房间是「换了人间」，信是「空天2202」，车是六天五夜。<br />把它们按顺序连起来，是一句话：</p>
    <p class="big" id="secret">— — —</p>
  </div>

  <a class="back" href="index.html">← 回到主页</a>
</main>

<script src="js/kernel.js?vpfdp5c"></script>
<script src="js/nav.js?vpfdp5c"></script>
<script src="js/i18n.js?vpfdp5c"></script>
<script src="js/eggs.js?vpfdp5c"></script>
<script src="js/audio.js?vpfdp5c"></script>
<script>
(function () {
  'use strict';
  const get = function (k) { try { return localStorage.getItem(k) === '1'; } catch (e) { return false; } };

  const ENTRIES = [
    { el: 'e1', flag: 'nova-room-open', lock: '去页脚找那个「房间」，连点七下小太阳也行。',
      text: '房间的口令是 <b>换了人间</b>。', code: '换了人间' },
    { el: 'e2', flag: 'nova-letter-open', lock: '房间里有一封信。',
      text: '信的口令是 <b>空天2202</b>。', code: '空天2202' },
    { el: 'e3', flag: 'nova-train-open', lock: '房间里还有一扇窗，窗外是雪。',
      text: '那趟车开了 <b>六天五夜</b>。', code: '六天五夜' }
  ];

  let opened = 0;
  ENTRIES.forEach(function (e) {
    const box = document.getElementById(e.el);
    if (!box) return;
    const lock = box.querySelector('.lock');
    const body = box.querySelector('.body');
    if (get(e.flag)) {
      opened++;
      box.classList.add('open');
      lock.textContent = '已解锁';
      body.hidden = false;
      body.innerHTML = '<p>' + e.text + '</p><span class="code">' + e.code + '</span>';
    } else {
      lock.textContent = e.lock;
      box.classList.remove('open');
    }
  });

  if (opened >= 3) {
    const f = document.getElementById('final');
    f.classList.add('on');
    document.getElementById('secret').textContent = '换 了 人 间 · 空 天 2 2 0 2 · 六 天 五 夜';
    try { localStorage.setItem('nova-codex', '1'); } catch (e) { }
    if (window.EggKit) window.EggKit.bump('codex');
  }
})();
</script>
<script src="js/polish.js?vpfdp5c"></script>
</body>
</html>
